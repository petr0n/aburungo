# Chapter 9 vocabulary — around town.
#
# The position words are the reason this chapter exists. 前, 後ろ and 隣 were
# taught back in the directions lessons; 上, 下, 中, 外 and 間 never were, so the
# learner could say "in front of the station" and not "inside the station" —
# half a system, and the missing half is the more useful one.
#
# The こそあど set also finishes here. これ/それ/あれ/どれ came in Lesson 1 and
# この/その/あの/どの in Chapter 7; そちら/あちら/どちら complete it beside こちら.
# Chapter 8 deferred them on the grounds that they belong with pointing rather
# than describing, and this is where pointing happens.
#
# Public buildings are deliberately absent: 駅, 学校, 病院, 銀行, 郵便局, 図書館
# and 公園 are all long taught. Checking that first is what kept this chapter
# from repeating a lesson the ladder already had.
#
# content-source: training — headwords, readings and part of speech verified
#   against JMdict 3.6.2 on 2026-08-17, sequence numbers inline, all twenty-one
#   flagged common.
# jlpt-source: training — JLPT level unverified

# ── Above, below, inside, outside (Lesson 1) ──────────────────────────────────

- id: vocab.ue
  jlpt: N5
  word_type: noun
  theme: position
  japanese: 上
  reading: うえ
  romaji: ue
  english: on, above
  notes: A noun, not a preposition — 机の上, literally "the desk's above". JMdict seq 1352130.

- id: vocab.shita
  jlpt: N5
  word_type: noun
  theme: position
  japanese: 下
  reading: した
  romaji: shita
  english: under, below
  notes: JMdict seq 1184140.

- id: vocab.naka
  jlpt: N5
  word_type: noun
  theme: position
  japanese: 中
  reading: なか
  romaji: naka
  english: inside, in
  notes: Also "among" a group of people. JMdict seq 1423310.

- id: vocab.soto
  jlpt: N5
  word_type: noun
  theme: position
  japanese: 外
  reading: そと
  romaji: soto
  english: outside
  notes: JMdict seq 1203250.

- id: vocab.aida
  jlpt: N5
  word_type: noun
  theme: position
  japanese: 間
  reading: あいだ
  romaji: aida
  english: between
  notes: Takes two things joined by と — 駅と学校の間. Also a stretch of time. JMdict seq 1215230.

