  theme: town
  japanese: 渡る
  reading: わたる
  romaji: wataru
  english: to cross
  notes: Intransitive (vi), and it takes を for the thing crossed — 道を渡ります — which is unusual for an intransitive verb. JMdict seq 1444680.
