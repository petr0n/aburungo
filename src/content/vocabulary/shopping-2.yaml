# N5 shopping vocabulary, depth pass for Situation 3 (Units 13-15).
# Densifies the existing shop / sizes / do-you-have-it units (DR-017).
#
# Example sentences are Tatoeba, chosen by hand. Several words here carry no
# example: shiroi could not get one because the search substring-matches it
# inside omoshiroi, so nearly every candidate meant "interesting", not "white".
#
# content-source: training — headwords verified against JMdict 3.6.2 on 2026-08-04
# jlpt-source: training — JLPT level unverified (JMdict carries no JLPT data)
# example-source: Tatoeba via JMdict-examples 3.6.2 (CC BY 2.0 FR), ids inline

