# N5 transit vocabulary, depth pass for Situation 4 (Units 16-20).
# Densifies the existing station / platform / taxi / bus lessons (DR-017).
#
# Example sentences are Tatoeba, chosen by hand. Most transit words have no
# N5-appropriate candidate — the corpus tends to formal or N4+ grammar for them
# (koto ga aru, ware-ware), so they ship without one rather than with a poor fit.
#
# content-source: training — headwords verified against JMdict 3.6.2 on 2026-08-04
# jlpt-source: training — JLPT level unverified (JMdict carries no JLPT data)
# example-source: Tatoeba via JMdict-examples 3.6.2 (CC BY 2.0 FR), ids inline

