# N5 basics vocabulary, depth pass for Situation 1 (Units 1-7). Densifies the
# existing greetings/basics lessons rather than extending the ladder (DR-017).
#
# Example sentences are Tatoeba, pulled via server/scripts/find-examples.ts and
# selected by hand. Candidates were reviewed, not pasted: the ranking favours
# kana-heavy sentences, which surfaces unusable ones like "I have a lot of
# phlegm" for takusan. Words with no clean N5-level candidate carry no example
# rather than a poor one.
#
# content-source: training — headwords verified against JMdict 3.6.2 on 2026-08-04
# jlpt-source: training — JLPT level unverified (JMdict carries no JLPT data)
# example-source: Tatoeba via JMdict-examples 3.6.2 (CC BY 2.0 FR), ids inline

# ── Question words (Units 1, 3) ───────────────────────────────────────────────

- id: vocab.dare
  jlpt: N5
  word_type: noun
  theme: basics
  japanese: 誰
  reading: だれ
  romaji: dare
  english: who
  example:
    japanese: 誰かがドアをノックした。
    english: Someone knocked on the door.
    tatoeba_id: "137114"

- id: vocab.itsu
