# Chapter 8 vocabulary — describing things and people.
#
# The ladder already had 23 い-adjectives, which is why this chapter is not the
# "adjectives chapter" it first looked like it should be. 大きい, 小さい, 新しい,
# 古い, 高い and 安い were all long since taught. What was missing was the body,
# and the *pairs* — the opposites that only make sense together.
#
# So they are taught together: 長い with 短い, 重い with 軽い, 強い with 弱い,
# 早い with 遅い. Each pair is one idea with two ends, and splitting them across
# lessons would teach half a concept twice.
#
# 痛い sits with the body words rather than with the other feelings, because
# 頭が痛いです is the sentence the body vocabulary exists to build.
#
# Already taught and deliberately absent: 大きい, 小さい, 新しい, 古い, 高い,
# 安い, 暑い, 寒い, 暖かい, 涼しい, いい, 面白い, 暗い, 手, 顔.
#
# content-source: training — headwords, readings and part of speech verified
#   against JMdict 3.6.2 on 2026-08-17, sequence numbers inline, all twenty-one
#   flagged common.
# jlpt-source: training — JLPT level unverified

