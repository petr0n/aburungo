# Chapter 5 vocabulary — home, work & study (DR-026).
#
# The chapter that finally teaches verbs in bulk. The ladder had 26 verbs in 44
# lessons, almost all of them motion or eating; everything you do to an object
# was missing, so a learner could say where they were going but not that they
# had opened the window.
#
# Transitivity is the spine of the first lesson and the reason 開ける/開く and
# 閉める/閉まる are taught as pairs rather than as four separate words. Japanese
# marks the difference in the verb itself, which English does not — "the door
# opens" and "I open the door" share a verb in English and never in Japanese.
# Every verb here therefore records vt or vi in its notes.
#
# Already taught elsewhere and deliberately absent: 寝る, 帰る, 入る, 出る, 行く,
# 来る, する, 買う, 見る, 聞く, 読む, 書く, 話す, 会う, 歩く, 食べる, 飲む, 起きる,
# 部屋, 名前, 服.
#
# content-source: training — headwords, readings, part of speech and
#   transitivity verified against JMdict 3.6.2 on 2026-08-16, sequence numbers
#   inline. つける needed care: matching on the kana alone returns "to install
#   (a king, emperor)", a homograph that is not even flagged common. The entry
#   taught here is 点ける, seq 1610400. できる has the same trap and was held back
#   to a later chapter rather than rushed.
# jlpt-source: training — JLPT level unverified (JMdict carries no JLPT data);
#   all forty-one appear in both the Tanos and open-anki N5 reference lists

# ── Opening and closing ───────────────────────────────────────────────────────

- id: vocab.akeru
  jlpt: N5
  word_type: verb
  verb_class: ru
  theme: home
  japanese: 開ける
  reading: あける
  romaji: akeru
  english: to open (something)
  notes: Transitive (vt) — you open it. Pairs with 開く, which is what the thing itself does. JMdict seq 1202450.

- id: vocab.aku
  jlpt: N5
  word_type: verb
  verb_class: u
  theme: home
  japanese: 開く
  reading: あく
  romaji: aku
  english: to open (by itself)
  notes: Intransitive (vi) — the door opens. Never takes を. JMdict seq 1586270.

- id: vocab.shimeru
  jlpt: N5
  word_type: verb
  verb_class: ru
  theme: home
  japanese: 閉める
  reading: しめる
  romaji: shimeru
  english: to close (something)
  notes: Transitive (vt), the mirror of 開ける. JMdict seq 1508590.

- id: vocab.shimaru
  jlpt: N5
  word_type: verb
  verb_class: u
  theme: home
  japanese: 閉まる
  reading: しまる
  romaji: shimaru
  english: to close (by itself)
  notes: Intransitive (vi). The shop closes; nobody is mentioned. JMdict seq 1436560.

- id: vocab.mado
  jlpt: N5
  word_type: noun
  theme: home
  japanese: 窓
  reading: まど
  romaji: mado
  english: window
  notes: JMdict seq 1401400.

