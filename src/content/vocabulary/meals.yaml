# Chapter 11 vocabulary — meals and the kitchen.
#
# The largest cluster left in the N5 gap list, and a strange hole in a ladder
# that has been able to order in a restaurant since its second chapter. The
# learner could say コーヒーをお願いします and could not say breakfast, lunch,
# dinner, or the word for food itself.
#
# The three meals are taught as one system rather than three words. 朝ご飯,
# 昼ご飯 and 晩ご飯 are 朝, 昼 and 晩 stuck to ご飯, all of which the learner
# already has except 晩 -- so the lesson is really teaching one word and a
# pattern, which is why it can afford five entries.
#
# 食べ物 and 飲み物 are the same trick on verbs the learner owns, and the same
# trick that built 買い物 in the town chapter. Teaching them next to each other
# is what turns a coincidence into a rule.
#
# 箸 was invisible until the coverage matcher stopped letting 橋 (はし, bridge) mask
# it. A kitchen lesson with a fork and no chopsticks was the cost of that bug.
#
# Already taught and deliberately absent: ご飯, パン, お茶, 肉, 魚, 野菜, 果物,
# たまご, すし, ラーメン, 天ぷら, おにぎり, 牛乳, ビール, ジュース, コーヒー,
# おいしい, 甘い, 辛い, レストラン, メニュー, 注文, 席, 朝食.
#
# content-source: training — headwords, readings and part of speech verified
#   against JMdict 3.6.2 on 2026-08-20, sequence numbers inline, all
#   twenty-eight flagged common.
# jlpt-source: training — JLPT level unverified

# ── The three meals (Lesson 1) ────────────────────────────────────────────────

- id: vocab.ban
  jlpt: N5
  word_type: noun
  theme: time
  japanese: 晩
  reading: ばん
  romaji: ban
  english: evening, night
  notes: Overlaps 夜, which you know. 夜 is the time of day; 晩 is the evening as an occasion, which is why the meal is 晩ご飯. JMdict seq 1482110.

- id: vocab.asagohan
  jlpt: N5
  word_type: noun
  theme: food
  japanese: 朝ご飯
  reading: あさごはん
  romaji: asagohan
  english: breakfast
  notes: 朝 plus ご飯. The spoken word; 朝食, which you know, is the written and formal one. JMdict seq 1586330.

- id: vocab.hirugohan
  jlpt: N5
  word_type: noun
  theme: food
  japanese: 昼ご飯
  reading: ひるごはん
  romaji: hirugohan
  english: lunch
  notes: JMdict seq 1602340.

- id: vocab.bangohan
  jlpt: N5
  word_type: noun
  theme: food
  japanese: 晩ご飯
  reading: ばんごはん
  romaji: bangohan
  english: dinner, evening meal
  notes: JMdict seq 1601340.

- id: vocab.yuugata
  jlpt: N5
  word_type: noun
  theme: time
  japanese: 夕方
  reading: ゆうがた
  romaji: yuugata
  english: early evening, dusk
  notes: Roughly three to six, before 晩 proper. JMdict seq 1542790.

# ── Food, drink, and what you think of it (Lesson 2) ──────────────────────────

- id: vocab.tabemono
  jlpt: N5
  word_type: noun
  theme: food
  japanese: 食べ物
  reading: たべもの
  romaji: tabemono
  english: food
  notes: 食べる plus 物 — literally "eating thing". JMdict seq 1358340.

- id: vocab.nomimono
  jlpt: N5
  word_type: noun
  theme: food
  japanese: 飲み物
  reading: のみもの
  romaji: nomimono
  english: drink, beverage
  notes: The same build on 飲む. JMdict seq 1600430.

- id: vocab.ryouri
  jlpt: N5
  word_type: noun
  theme: food
  japanese: 料理
  reading: りょうり
  romaji: ryouri
  english: cooking, cuisine, a dish
  notes: Takes する — 料理をします is to cook. Also the finished dish itself. JMdict seq 1554310.

- id: vocab.mazui
  jlpt: N5
  word_type: i-adj
  theme: food
  japanese: まずい
  reading: まずい
  romaji: mazui
  english: bad-tasting, unappetising
  notes: Written in kana. The opposite of おいしい, and blunt enough that people soften it — say あまりおいしくないです about someone's cooking. JMdict seq 1495000.

