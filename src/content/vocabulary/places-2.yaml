# N5 vocabulary depth pass for Situations 5-8: hotel (Units 21-23),
# directions (24-26), weather (27-29) and daily life (30-33). Densifies the
# existing units rather than extending the ladder (DR-017).
#
# Example sentences are Tatoeba, chosen by hand and checked by
# server/scripts/verify-examples.ts. Words with no N5-appropriate candidate
# carry none — the corpus skews formal or N4+ for much of this vocabulary.
#
# content-source: training — headwords verified against JMdict 3.6.2 on 2026-08-04
# jlpt-source: training — JLPT level unverified (JMdict carries no JLPT data)
# example-source: Tatoeba via JMdict-examples 3.6.2 (CC BY 2.0 FR), ids inline

# ── Hotel (Units 21-23) ───────────────────────────────────────────────────────

- id: vocab.kagi
  jlpt: N5
  word_type: noun
  theme: hotel
  japanese: 鍵
  reading: かぎ
  romaji: kagi
  english: key
  example:
    japanese: ドアに鍵をかけてくださいませんか。
    english: Would you please lock the door?
    tatoeba_id: "201877"

- id: vocab.nimotsu
  jlpt: N5
  word_type: noun
  theme: hotel
  japanese: 荷物
  reading: にもつ
  romaji: nimotsu
  english: luggage, baggage
  example:
    japanese: この荷物をトランクにいれてもらえますか。
    english: Could you put these bags in the trunk?
    tatoeba_id: "222709"

- id: vocab.shawaa
  jlpt: N5
  word_type: noun
  theme: hotel
  japanese: シャワー
  reading: シャワー
  romaji: shawaa
  english: shower

- id: vocab.choushoku
  jlpt: N5
  word_type: noun
  theme: hotel
  japanese: 朝食
  reading: ちょうしょく
  romaji: choushoku
  english: breakfast
  notes: More formal than あさごはん — the word hotels and menus use.

