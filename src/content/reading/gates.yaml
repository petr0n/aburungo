# Book Three gate texts: the passage that closes each band.
#
# docs/plans/book-three-bands.md section 1: a band's checkpoint gains "a gate text
# the learner could not have read when the band opened". The evidence here is the
# band's own grammar, quoted verbatim from the passage -- a pattern the learner
# meets in that band, standing in running text they read at its end.
#
# Matched by hand, not by surface search. A string search for the band patterns
# also finds めずらしい and すばらしい for らしい, しまいました for まい, 時間には for
# 間に, 実際に for 際に, and なくてはならない (obligation) for てはならない
# (prohibition). None of those are the pattern, and none are used.
#
# Two sources. kc.* are KC よむよむ stories (Japan Foundation Kansai Center,
# CC BY-NC 2.1 JP), data/reading/kc-yomyom.json. They are A1-A2, and six bands
# teach N3 grammar none of them uses, so those six close with gv.* passages:
# one paragraph each from Global Voices 日本語 (CC BY 3.0), chosen 2026-10-04
# from 300 articles, data/reading/gv-passages.json, which carries the author and
# translator credit the licence requires.

- band: b3.band-0
  story: kc.senshuyasai
  patterns: [grammar.b3-passive-godan]
  evidence:
    - 水ナスは江戸時代から泉州地域で作られています。
    - 泉州たまねぎは明治時代から作られています。
    - 「日本のたまねぎ作りの最初の場所」だと言われるくらい泉州は有名なんですよ。

- band: b3.band-1
  story: gv.65377-13
  patterns: [grammar.b3-okage-de]
  evidence:
    - でも私は家族のおかげで一つの道を見つけた。

- band: b3.band-2
  story: gv.62448-1
  patterns: [grammar.b3-nimokakawarazu]
  evidence:
    - 私はこれまでオーストラリアの広大な地をくまなく旅してきたにもかかわらず、私が生きてきた4分の3世紀の間に野生のカモノハシを見たのはわずか一度である。

- band: b3.band-3
  story: gv.63643-20
  patterns: [grammar.b3-cond-tatoe-temo]
  evidence:
    - たとえ日本で永住権を得たとしても、子どもたちのために何としてでもネパールへ帰ると言う人もいる。

- band: b3.band-4
  story: gv.58290-32
  patterns: [grammar.b3-uchini]
  evidence:
    - 5分もたたないうちに踊り出す人がいます。

- band: b3.band-5
  story: kc.idolyametai
  patterns: [grammar.b3-mitai, grammar.b3-wake]
  evidence:
    - ぼくは、みんなみたいにダンスも歌も上手じゃないし、おもしろいわけでもないです。

- band: b3.band-6
  story: kc.manhole
  patterns: [grammar.b3-bakari, grammar.b3-kurai]
  evidence:
    - …でも、下ばかり見て歩いているとあぶないですよ。
    - ふたの形は丸くて、60cmくらいの大きさが多いです。

- band: b3.band-7
  story: kc.kabocha
  patterns: [grammar.b3-you-ni-suru]
  evidence:
    - かぼちゃを食べて、風邪をひかないようにしましょう！

- band: b3.band-8
  story: gv.58639-14
  patterns: [grammar.b3-beki]
  evidence:
    - 私が、明らかに女性にもっと向いている医学を選ばないなんて、入試の点数を無駄にしていると言う人もいましたし、工学を学びたいのならもっと女子向きのものを選ぶべきだという人もいました。

- band: b3.band-9
  story: kc.hijoguchi
  patterns: [grammar.b3-toiu, grammar.b3-koto]
  evidence:
    - はじめは「非常口」という文字だけのサインでしたが、子どもや外国人にもわかりやすいように、絵のサインを作りました。
    - 見たことがありますか？

- band: b3.band-10
  story: gv.63627-1
  patterns: [grammar.b3-de-aru]
  evidence:
    - それは淹（い）れたてかどうか、また薄くしてもらえるかどうかである。
