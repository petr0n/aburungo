# Chapter 6 phrases — the te-form (DR-027).
#
# Almost every sentence here is 〜てください, because that is what makes the form
# worth learning on the day you learn it: the ladder already carries ten
# memorised 〜てください phrases (右に曲がってください, ゆっくり話してください,
# タオルを持ってきてください) that no lesson ever explained. These sentences are
# the same shape, built deliberately, so the old ones stop being lumps of sound.
#
# One sentence per conjugation group, using a verb from that group, so the
# grammar pattern attached to each lesson has a real example to blank out.
#
# The last three use 〜ています, which finally lets the ladder say things it has
# been unable to say: 知っています rather than the odd 知ります, and a natural
# answer to "what are you doing".
#
# content-source: training — N5 canonical, pending Tatoeba verification.
#   JMdict cannot verify composed sentences (only fixed expressions are
#   headwords), so sentence checks need Tatoeba, not JMdict.
# jlpt-source: training — JLPT level unverified

# ── Ichidan and the irregulars ────────────────────────────────────────────────

- id: te.please-look
  jlpt: N5
  scenario: actions
  japanese: 見てください。
  reading: みてください。
  romaji: mite kudasai.
  english: Please look.

- id: te.please-open-the-window
  jlpt: N5
  scenario: actions
  japanese: 窓を開けてください。
  reading: まどをあけてください。
  romaji: mado o akete kudasai.
  english: Please open the window.

- id: te.may-i-borrow
  jlpt: N5
  scenario: actions
  japanese: 借りてもいいですか。
  reading: かりてもいいですか。
  romaji: karite mo ii desu ka.
  english: May I borrow it?

