- id: people.wearing-a-skirt
  jlpt: N5
  scenario: people
  japanese: スカートをはいています。
  reading: スカートをはいています。
  romaji: sukaato o haite imasu.
  english: She is wearing a skirt.

- id: people.take-your-shoes-off-here
  jlpt: N5
  scenario: people
  japanese: ここで靴を脱ぎます。
  reading: ここでくつをぬぎます。
  romaji: koko de kutsu o nugimasu.
  english: You take your shoes off here.

