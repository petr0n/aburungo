# Book Two, Chapter 5 phrases — wanting, planning, proposing.
#
# Every sentence here is built from words the ladder already teaches plus the
# chapter's one new noun. The endings carry the whole load, which is the point:
# a learner should hear 行きたい, 行くつもりです and 行きましょう as three things
# done to one verb they have owned since Book One.
#
# Several pairs are deliberate twins, so the contrast is reviewable rather than
# asserted -- 新しい車が買いたいです against 新しい車がほしいです (an action you
# want against a thing you want), 来週、友達に会うつもりです against 昨日、友達に
# 会うつもりでした (a plan against a plan that was), 一緒に行きましょう against
# 一緒に行きませんか (proposing against inviting).
#
# The answering sentences in the question lesson, the proposing lesson and the
# inviting lesson are four independent utterances. They are not exchanges and
# must not be authored into one: a scripted dialogue is multi-sentence composed
# text, which is the surface the content rules exist to keep out.
#
# Two sentences reach back to the chapter that joined sentences -- から in
# 日本に行きたいから、お金がほしいです and けど in the plan that changed. That is
# a backwards dependency on material already taught, and it buys the two
# sentences that show want-a-thing against want-to-do, and had-planned against
# didn't, inside one sentence each rather than across two.
#
# content-source: training — N5/N4 canonical, pending Tatoeba verification.
#   JMdict cannot verify composed sentences (only fixed expressions are
#   headwords), so sentence checks need Tatoeba, not JMdict. The shapes were
#   checked against the Tatoeba-sourced examples bundled with JMdict for
#   Applications 3.6.2 on 2026-08-31 -- 「私は来年留学するつもりです。」 (Tatoeba
#   152381) attests plain non-past + つもりです -- but no sentence below is a
#   verbatim quotation, so none carries a Tatoeba id.
# jlpt-source: training — the level marks the band this chapter sits in.

# ── Wanting to do something ───────────────────────────────────────────────────

- id: want.i-want-to-go-to-japan
  jlpt: N4
  scenario: deciding
  japanese: 日本に行きたいです。
  reading: にほんにいきたいです。
  romaji: nihon ni ikitai desu.
  english: I want to go to Japan.

- id: want.i-want-to-see-a-film
  jlpt: N4
  scenario: deciding
  japanese: 映画が見たいです。
  reading: えいががみたいです。
  romaji: eiga ga mitai desu.
  english: I want to see a film.

- id: want.i-want-to-go-shopping
  jlpt: N4
  scenario: deciding
  japanese: 買い物がしたいです。
  reading: かいものがしたいです。
  romaji: kaimono ga shitai desu.
