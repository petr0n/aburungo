# ── They say... (recognition only — see the blocked note above) ───────────────

- id: quote.this-mountain-is-said-to-be-famous
  jlpt: N4
  scenario: quoting
  japanese: この山は有名だと言われています。
  reading: このやまはゆうめいだといわれています。
  romaji: kono yama wa yuumei da to iwarete imasu.
  english: This mountain is said to be famous.
  # Passive: the chapter teaches れる/られる for reading only, so the produce
  #   step must never ask a learner to type this back.
  recognitionOnly: true
  notes: Recognition only. Read it and understand it; you are not asked to build it. The passive form 言われる is next book's material — what matters here is noticing that the person who said it has disappeared from the sentence, and that だ survives after a な-adjective even under this extra layer.

- id: quote.fish-is-said-to-be-good-for-you
  jlpt: N4
  scenario: quoting
  japanese: 魚は体にいいと言われています。
  reading: さかなはからだにいいといわれています。
  romaji: sakana wa karada ni ii to iwarete imasu.
  english: Fish is said to be good for you.
  # Passive: the chapter teaches れる/られる for reading only, so the produce
  #   step must never ask a learner to type this back.
  recognitionOnly: true
  notes: Recognition only, the same as its neighbour. Here the quoted clause ends in an i-adjective, so there is no だ — the rule you learned for と holds unchanged inside the passive.

