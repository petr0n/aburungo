# Book Two, Chapter 7 phrases — what somebody else said, and what you think.
#
# Every sentence below is a plain-form clause with と stapled to the end of it
# and a reporting or thinking verb closing the sentence. The clause is the part
# the learner already owns -- 行く, 食べた, 買わない, 寒い, 学生だ are all forms
# the plain-form chapter built -- so nothing here is competing with the one
# thing the chapter is teaching, which is what goes after the clause.
#
# The two families are kept visibly apart, because English blurs them and
# Japanese does not. 言う and 聞く always point at a source outside the speaker,
# so every report sentence has a third person as its subject: 友達は, 先生は,
# 母は. 思う always points at the speaker's own head, so no opinion sentence has
# one. That split is the chapter's whole pedagogical claim, and it is visible in
# the sentences rather than only asserted in a note.
#
# Several sentences are built as halves of a pair, so a contrast the grammar
# notes claim is checkable in review rather than taken on trust:
#
#   友達は寒いと言いました              against  友達は学生だと言いました
#     -- an i-adjective clause takes no だ, a noun clause cannot drop it
#   この本は面白いと思います            against  この仕事は面白いと思っています
#     -- a judgement formed now against a stance held for a while
#   この山は有名だと言われています      against  魚は体にいいと言われています
#     -- だ survives inside the passive, and is still wrong after an i-adjective
#
# The three sentences that close the chapter each carry a report and an opinion
# joined by けど, which the joining chapter already taught. They are single
# utterances, not exchanges: a scripted back-and-forth is multi-sentence
# composed text, which is the surface the content rules exist to keep out, and
# a chapter about people reporting what other people said is the likeliest
# place in the book to drift into one.
#
# ---------------------------------------------------------------------------
# BLOCKED, READ BEFORE WIRING: quote.this-mountain-is-said-to-be-famous and
# quote.fish-is-said-to-be-good-for-you are recognition-only content. Book Two
# is a `shifted` book, so a Phrase in it routes to the typed FillBlankCard, and
# these two must never be typed -- producing れる/られる is next book's work, and
# the chapter design (book-two-chapter-07.md §5.2) makes recognition-only the
# binding condition on teaching the passive here at all. The engine primitive
# that would express this (`recognitionOnly?: boolean` on Phrase, checked in
# ReviewStep ahead of the shifted branch, exactly as isKanji is checked today)
# does not exist yet -- verified absent from src/ on 2026-08-31. Until it lands,
# the passive lesson is authored but not safe to ship.
# ---------------------------------------------------------------------------
#
# content-source: training — N5/N4 canonical, pending Tatoeba verification.
#   JMdict cannot verify a composed sentence (only fixed expressions are
#   headwords), so every shape below was checked against the Tatoeba-sourced
#   examples bundled with JMdict for Applications 3.6.2 on 2026-08-31 --
#   「スミスさんが「海兵隊は必要ない」と言いました。」and「下院議員は支出に歯止め
#   をかけると言いました。」attest と言いました on a quoted clause,「私の祖母は、
#   口癖のように１００歳まで生きると言っていましたが、８５歳で亡くなりました。」
#   と言っていました,「気象庁は今晩雨が降ると言っている。」a weather report under
#   と言っている,「彼は重病だと言われている。」and「彼女はウーマンリブ運動の指導者
#   だと言われている。」noun／な-adjective + だ inside the passive,「フランス人は
#   芸術を愛好すると言われている。」a verb clause inside it,「カールがドイツに移り
#   住むと聞いた時には驚いた。」and「ジョンの両親は彼の乗った飛行機が定刻どおりだ
#   と聞いてほっとしているようだった。」と聞く on a verb clause and on だ,
#   「デスクトップにショートカットを作成しておいたほうが、いろいろ便利だと思います。」
#   and「自分自身でするべきだと思いますよ。」だと思います,「彼らの計画はうまく
#   いかないと思う。」and「これは生物の学習法としてはあまりよくないと思う。」the
#   negative sitting in the clause rather than on 思う,「ちょっときつく言い過ぎた
#   かな、とずっと思っています。」と思っています, and「津山一高い山は滝山だと思って
#   いました。」と思っていました. No sentence below is a verbatim quotation, so
#   none carries a Tatoeba id.
# jlpt-source: training — the level marks the band this chapter sits in.

# ── What was said ─────────────────────────────────────────────────────────────

- id: quote.my-friend-said-theyre-going-tomorrow
  jlpt: N4
  scenario: quoting
  japanese: 友達は明日行くと言いました。
  reading: ともだちはあしたいくといいました。
  romaji: tomodachi wa ashita iku to iimashita.
  english: My friend said they're going tomorrow.

