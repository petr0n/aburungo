  reading: ひまなら、てつだってください。
  romaji: hima nara, tetsudatte kudasai.
  english: If you're free, please help.

# ── Picking the right if (Lesson 7) ───────────────────────────────────────────

- id: cond.if-spring-comes-it-gets-warm
  jlpt: N4
  scenario: conditions
  japanese: 春になれば、暖かくなります。
  reading: はるになれば、あたたかくなります。
  romaji: haru ni nareba, atatakaku narimasu.
