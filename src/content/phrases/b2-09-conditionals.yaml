  reading: でんきをつければ、あかるくなります。
  romaji: denki o tsukereba, akaruku narimasu.
  english: If you turn on the light, it gets bright.

- id: cond.if-you-book-itll-be-fine
  jlpt: N4
  scenario: conditions
