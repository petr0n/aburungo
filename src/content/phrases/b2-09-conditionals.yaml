# ── Two ifs that aren't the same (Lesson 4) ───────────────────────────────────

- id: cond.press-here-and-water-comes-out
  jlpt: N4
  scenario: conditions
  japanese: ここを押すと、水が出ます。
  reading: ここをおすと、みずがでます。
  romaji: koko o osu to, mizu ga demasu.
  english: Press here, and water comes out.

- id: cond.if-no-water-comes-out-press-again
  jlpt: N4
  scenario: conditions
  japanese: 水が出なかったら、もう一度押してください。
  reading: みずがでなかったら、もういちどおしてください。
  romaji: mizu ga denakattara, mou ichido oshite kudasai.
  english: If no water comes out, please press it again.

- id: cond.when-winter-comes-it-gets-cold
  jlpt: N4
  scenario: conditions
  japanese: 冬になると、寒くなります。
  reading: ふゆになると、さむくなります。
  romaji: fuyu ni naru to, samuku narimasu.
  english: When winter comes, it gets cold.

- id: cond.if-youre-cold-please-close-the-window
  jlpt: N4
  scenario: conditions
  japanese: 寒かったら、窓を閉めてください。
  reading: さむかったら、まどをしめてください。
  romaji: samukattara, mado o shimete kudasai.
  english: If you're cold, please close the window.

# ── A third way to say if (Lesson 5) ──────────────────────────────────────────

- id: cond.if-you-read-the-book-youll-understand
  jlpt: N4
  scenario: conditions
  japanese: 本を読めば、わかります。
  reading: ほんをよめば、わかります。
  romaji: hon o yomeba, wakarimasu.
  english: If you read the book, you'll understand.

- id: cond.if-you-turn-on-the-light-it-gets-bright
  jlpt: N4
