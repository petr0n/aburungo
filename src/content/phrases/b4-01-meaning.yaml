# Book Four, Chapter 2 phrases -- meaning to, telling to.
#
# Thirty-four sentences, four or five to a lesson, and not one of them is ours.
# 04-stage-reading.md section 8 withdrew the composed-sentence exemption at the
# reading stage and above -- "no training-canonical sentences at the reading
# stage and above" -- and Book Four is past that line twice over. So every
# sentence below is a verbatim Tatoeba pair carried out of
# server/data/jmdict-examples-eng-3.6.2.json with its id in `tatoebaId`, and
# nothing was composed, trimmed, joined or smoothed. Where a shape had no clean
# attested sentence, the shape is stated in a grammarNote and has no card -- the
# ichidan volitional is the clearest case, and lesson 1 says so out loud.
#
# These sentences also carry this chapter's vocabulary
# (vocabulary/b4-01-meaning.yaml, thirty-six words), which is Book Four's own
# rule rather than Book Three's: a lesson teaches the untaught content words of
# the sentences it quotes (docs/plans/book-four-bands.md section 2). The grammar
# still chose the sentence; where two sentences taught a form equally well, the
# one whose unknown words were worth teaching won.
#
# ---------------------------------------------------------------------------
# WHAT THE BREAKDOWN OFFERED AND THIS FILE DECLINED, each with its reason.
#
#   #223675 (このジンをトニック水で割ろう) -- the one sentence declined on the
#     reading rather than on room. トニック水 has no JMdict entry in that form,
#     so トニックすい is a transcription this author is confident in and cannot
#     cite, and a `reading` field is the string a learner types back. Lesson 1
#     keeps 呼ぼう for the godan shape and states 割る -> 割ろう as a rule.
#   #158934 (私はポップ・ミュージックはそろそろ卒業しようと思っているの) -- ends
#     in the explanatory の, which is band 2's material and not this chapter's.
#     Lesson 2's standing-intention card is 190926 instead.
#   #227223 (お金を借りようと思ってかけずり回った) -- かけずり回る appears once
#     in the whole corpus and is the main verb of the sentence.
#   #188722 (猿まねはやめろ) -- 174863 carries the same ichidan imperative やめろ
#     and teaches 現実 with it; 猿まね is rare and would have been carded for
#     nothing.
#   #201814 (ドアをバタンと閉めるな) -- lesson 5 had five cards without it and
#     234503 is the better fifth, because するな is the prohibition a learner
#     will meet most.
#   #202510 (ディーラーは車を売りたがっている) is carded; #143122
#     (政府はともすればマスメディアを統制したがる) is not. It is the corpus's
#     clearest bare たがる and the register point lesson 7 makes, but ともすれば,
#     マスメディア and 統制 are three unknowns in a twenty-two character
#     sentence, two of them rare. The lesson states the point in prose and
#     leaves the sentence uncarded rather than teaching three words to make one
#     remark about tone.
#
# ---------------------------------------------------------------------------
# GRAMMAR THE LEARNER DOES NOT YET HAVE, screened card by card.
#
# Nothing here uses だろう／でしょう, んです／のです, そうだ or keigo -- the four
# things this chapter's own attestation pass was told to keep out. Four cards do
# carry something untaught, and each says so in its own note rather than being
# passed off as readable:
#
#   といけない ("it won't do if", so "in case") in 184062 and 123613. Both are
#     `recognitionOnly`. JMdict carries the frame at 行けない seq 1000730 sense
#     7, "so as not to ..., in case ...", which is where the gloss comes from.
#   しか ... ない in 195876. No chapter of any book teaches it -- checked
#     against every grammar file, not assumed -- although the breakdown says
#     Book Two did. The note glosses it and the card stands, because しか does
#     not change what the learner types.
#   the embedded question のか in 187499. Book Two teaches か on a direct
#     question and Book Three teaches こと; neither teaches a question folded
#     into a sentence, so the note names it.
#
# Three cards use の as a nominaliser (174863, 82590, 187134). That is not
# taught either, and b3-09-reference.yaml is unusually clear about it: Japanese
# "has a second nominaliser, の ... and no chapter of this course has taught it,
# this one included", closing with "when you meet a のが or のを where you
# expected ことが or ことを, that is what you are looking at, and nothing here is
# broken." The notes point back at that rather than pretending の was taught.
#
# ---------------------------------------------------------------------------
# ENGLISH GLOSSES. Tatoeba's own where Tatoeba's own would do. Eleven of the
# thirty-four depart from it, listed here by id and kind so a reviewer can check
# them rather than take them on trust. Every Japanese string is untouched.
#
#   Where the corpus English hid the grammar or the word the card exists for:
#   225647 -- "Let's not go into details" hides both ようにしよう and くどくど.
#     Glossed "Let's try not to go on about it".
#   74135 -- "I thought I could settle it by phone" reads as the potential; the
#     Japanese is 済まそう plus 思いました. Glossed "I thought I'd settle it by
#     phone".
#   146969 -- "The small car boom is ending" hides the on-the-point-of reading
#     that is the whole card. Glossed "The small car boom is about to end".
#   82274 -- "It's no use asking me for money" drops ようとしても and softens
#     せびる. Glossed "It's no use trying to get money out of me".
#   174286 -- "Weigh your words well" hides 後先をよく考えて and the imperative
#     言え. Glossed "Think about what comes of it before you speak".
#   174863 -- "Stop hiding your head in the sand" hides 現実, a word this lesson
#     cards. Glossed "Stop running away from reality".
#   82590 -- "Please stop playing with your hat" puts a please in front of
#     やめなさい, which is the one thing なさい does not have. Glossed "Stop
#     fiddling with your hat".
#   226902 -- "in my mother's presence" is three registers above お袋, and
#     "talk about" loses 触れる. Glossed "Don't bring it up in front of my mum".
#
#   Where the corpus English was wrong for the sentence:
#   222865 -- drops この夏は entirely. Glossed "This summer I'm going to get a
#     good tan".
#   184062 -- splits one Japanese sentence into two English ones. Glossed as
#     one, "Don't go near the bulldog, in case he bites you".
#
#   Wording only, meaning unchanged:
#   86738 -- captured -> caught.
#
# ---------------------------------------------------------------------------
# One reading JMdict could not settle and one it settled wrongly, both recorded
# because a reader will otherwise assume the corpus was followed blindly.
# 揚がった in 74476 is indexed in JMdict against 上がる seq 1352290 sense 17, to
# get stage fright, which cannot be what a tempura is doing; the reading あがった
# is the same either way and the gloss follows 揚がる seq 2864573 sense 1, to be
# deep fried. 恵一 is a personal name the dictionary does not carry at all, and
# けいいち is taken from the corpus's own English, "Keiichi".
#
# Every other compound reading was checked against JMdict: 忍者 1467470,
# 転地療養 1704100, 小型車 2011310, 後先 1269850, 天ぷら 1440590, 喜怒哀楽
# 1218870, 気にかける 1221700, いじり回す 1000810, お守り 1002060 (not おもり,
# seq 2268160, which is babysitting), 育児休暇 2059820, 一握り 1160980, 何事
# 1188740, 握り 1152660, 無駄 1530510.
#
# These are independent utterances. Several would sit together -- やめろ and
# やめなさい most obviously -- and they are deliberately not authored as an
# exchange; a scripted back-and-forth is composed multi-sentence text, which
# stays out even when both halves are separately attested.
#
# content-source: Tatoeba, via the sentence pairs embedded in JMdict for
#   Applications 3.6.2 (server/data/jmdict-examples-eng-3.6.2.json). Every
#   phrase carries its sentence id in `tatoebaId`; the id is quoted, because
#   YAML reads a bare 235316 as a number and the schema rejects it. Verified by
#   id against the corpus on 2026-09-06 -- all 34 resolve and every Japanese
#   string below matches its source character for character. Kana readings and
#   romaji are transcriptions of the quoted sentence, not new content.
# jlpt-source: training -- the level marks the band this content sits in, not
#   each form's textbook level. The volitional and the imperative are canonical
#   N4 grammar and arrive here only because Books One and Two taught the polite
#   forms above them; the sentences carrying them are N3-band text.

# ── Let's, plainly ────────────────────────────────────────────────────────────

- id: b4band1.lets-have-tea-at-three
  jlpt: N3
  scenario: volitional
  japanese: ３時はお茶にしよう。
  reading: さんじはおちゃにしよう。
  romaji: sanji wa ocha ni shiyou.
  english: Let's have tea at 3:00.
  tatoebaId: "235316"
  notes: しよう is する in the volitional, and it is exactly what ましょう says without the politeness. にする is deciding on something, so the sentence settles three o'clock as the moment for tea rather than ordering a drink -- JMdict files it under お茶 sense 2, tea break, not sense 1, the drink.

- id: b4band1.lets-play-at-being-ninjas
  jlpt: N3
  scenario: volitional
  japanese: 忍者ごっこをしよう。
  reading: にんじゃごっこをしよう。
  romaji: ninja gokko o shiyou.
  english: Let's make believe we're ninjas.
  tatoebaId: "122030"
  notes: ごっこ (JMdict seq 1004950) sticks on a noun and makes it a game of pretending to be that -- 電車ごっこ, playing trains. The proposal itself is the bare しよう, which is what a child or a friend says where a shop assistant would say しましょう.

- id: b4band1.lets-call-the-dog-skipper
  jlpt: N3
  scenario: volitional
  japanese: その犬をスキッパーと呼ぼう。
  reading: そのいぬをスキッパーとよぼう。
  romaji: sono inu o sukippaa to yobou.
  english: Let's call the dog Skipper.
  tatoebaId: "210943"
  notes: 呼ぶ is godan and ends in ぶ, so the last sound moves to the お row and takes う -- 呼ぼう. The と in front of the name is the same quoting と as in と言う; 呼ぶ used this way is JMdict sense 4, to name or designate.

- id: b4band1.lets-not-go-on-about-it
  jlpt: N3
  scenario: volitional
  japanese: くどくど言わないようにしよう。
  reading: くどくどいわないようにしよう。
  romaji: kudokudo iwanai you ni shiyou.
  english: Let's try not to go on about it.
  tatoebaId: "225647"
  notes: ようにする, from Book Three's chapter on purpose, put into the volitional -- let us make a point of not doing this. The corpus English, "Let's not go into details", hides both halves, so the gloss here says try, which is what ようにする adds.

- id: b4band1.you-shall-be-my-daughters-husband
  jlpt: N3
  scenario: volitional
  japanese: お前を娘の夫にしよう。
  reading: おまえをむすめのおっとにしよう。
  romaji: omae o musume no otto ni shiyou.
  english: You shall be my daughter's husband.
  tatoebaId: "226919"
  notes: The same しよう and no invitation in it -- one person announcing a decision about someone else. What tells you which reading you have is who is being addressed and whether they get a say, not the verb. お前 is JMdict seq 1002290, tagged familiar and male and glossed formerly honorific, now very informal, so this is a speaker who outranks the person in front of him.

# ── Meaning to ────────────────────────────────────────────────────────────────

- id: b4band1.im-going-to-join-a-demonstration
  jlpt: N3
  scenario: intention
  japanese: デモに参加しようと思う。
  reading: デモにさんかしようとおもう。
  romaji: demo ni sanka shiyou to omou.
  english: I'm going to join a demonstration.
  tatoebaId: "202096"
  notes: The volitional with と思う after it. 参加します would report a fact; 参加しようと思う reports the decision as the speaker's own, taken now. デモ is short for デモンストレーション and means a protest.

- id: b4band1.this-summer-im-getting-a-tan
  jlpt: N3
  scenario: intention
  japanese: この夏はこんがり焼こうと思います。
  reading: このなつはこんがりやこうとおもいます。
  romaji: kono natsu wa kongari yakou to omoimasu.
  english: This summer I'm going to get a good tan.
  tatoebaId: "222865"
  notes: 思います rather than 思う, which is the only difference politeness makes to this pattern -- everything before と stays plain. 焼く here is the sense for tanning skin, and こんがり is the sound-word for something browned nicely, usually toast.

- id: b4band1.i-thought-id-settle-it-by-phone
  jlpt: N3
  scenario: intention
  japanese: 電話で済まそうと思いました。
  reading: でんわですまそうとおもいました。
  romaji: denwa de sumasou to omoimashita.
  english: I thought I'd settle it by phone.
  tatoebaId: "74135"
  notes: In the past tense the pattern reports an intention the speaker had, and often one that then met an obstacle. 済ます is to get a thing settled, and で marks what you settle it with, so 電話で済ます is dealing with the matter by phone instead of in person.

- id: b4band1.im-thinking-of-going-away-for-my-health
  jlpt: N3
  scenario: intention
  japanese: 医者が勧めるので、どこかへ転地療養に行こうと思っています。
  reading: いしゃがすすめるので、どこかへてんちりょうようにいこうとおもっています。
  romaji: isha ga susumeru node, dokoka e tenchiryouyou ni ikou to omotte imasu.
  english: I'm thinking of going somewhere for a change of air, since my doctor advises me to.
  tatoebaId: "190926"
  recognitionOnly: true
  notes: 思っている rather than 思う -- an intention the speaker has been carrying rather than one formed on the spot, which is why English reaches for I'm thinking of. Recognition only because of 転地療養, a four-character compound (JMdict seq 1704100) meaning going somewhere with a better climate for your health; its reading is not something the sentence lets you work out.

# ── Trying to, about to ───────────────────────────────────────────────────────

- id: b4band1.she-was-caught-trying-to-steal-jewellery
  jlpt: N3
  scenario: trying
  japanese: 彼女は宝石を盗もうとして捕まった。
  reading: かのじょはほうせきをぬすもうとしてつかまった。
  romaji: kanojo wa houseki o nusumou to shite tsukamatta.
  english: She was caught trying to steal jewelry.
  tatoebaId: "86738"
  notes: とする after a volitional is JMdict's own gloss for the pattern (seq 2136890, sense 1) -- to try to, or to be about to. Here it is the attempt, and the て-form として hangs the attempt on what happened next. The corpus said captured; caught is the word an English speaker would use about a shop.

- id: b4band1.he-tried-to-get-the-robot-going
  jlpt: N3
  scenario: trying
  japanese: 彼はロボットを動かそうとした。
  reading: かれはロボットをうごかそうとした。
  romaji: kare wa robotto o ugokasou to shita.
  english: He tried to make the robot run.
  tatoebaId: "110310"
  notes: The plainest shape in the lesson -- volitional, とした, done. Nothing in the Japanese says whether the robot moved; ようとした reports the attempt and stops there, and English "tried to" carries the same silence.

- id: b4band1.i-tried-to-open-the-door
  jlpt: N3
  scenario: trying
  japanese: ドアを開けようとしたら、ドアの握りがとれた。
  reading: ドアをあけようとしたら、ドアのにぎりがとれた。
  romaji: doa o akeyou to shitara, doa no nigiri ga toreta.
  english: I tried to open the door, and the doorknob came off.
  tatoebaId: "201790"
  notes: 開ける is ichidan, so its volitional is stem plus よう -- 開けよう -- and this is the chapter's one carded example of that shape. たら, from Book Two, then does what it does with a past event -- I tried, and this is what I found. 握り is the knob or handle (JMdict seq 1152660, sense 3).

- id: b4band1.the-small-car-boom-is-about-to-end
  jlpt: N3
  scenario: trying
  japanese: 小型車のブームは終わろうとしている。
  reading: こがたしゃのブームはおわろうとしている。
  romaji: kogatasha no buumu wa owarou to shite iru.
  english: The small car boom is about to end.
  tatoebaId: "146969"
  notes: The second job of the same pattern, and the one that has nothing to do with trying. A boom cannot intend anything, so ようとしている can only mean it is on the point of ending. When the subject is a thing rather than a person, this is the reading to take.

- id: b4band1.its-no-use-trying-to-get-money-out-of-me
  jlpt: N3
  scenario: trying
  japanese: 僕に金をせびろうとしても無駄だ。
  reading: ぼくにかねをせびろうとしてもむだだ。
  romaji: boku ni kane o sebirou to shite mo muda da.
  english: It's no use trying to get money out of me.
  tatoebaId: "82274"
  notes: ようとしても is the pattern with Book Three's ても on the end -- even if you try. せびる (JMdict seq 1006560) is pestering someone for money, harder than asking. 金 is お金 without the polite お, the everyday bare form.

# ── Do it ─────────────────────────────────────────────────────────────────────

- id: b4band1.if-youre-doing-it-do-it-well
  jlpt: N3
  scenario: command
  japanese: どうせやるなら上手にやれ。
  reading: どうせやるならじょうずにやれ。
  romaji: douse yaru nara jouzu ni yare.
  english: If you do it at all, do it well.
  tatoebaId: "201388"
  notes: やる is godan, so the imperative moves the last sound to the え row -- やれ. Book Two met なら on a noun; here it follows a plain verb and does the same job, if it is a case of doing it. どうせ (seq 1008950) is the resigned since-it-makes-no-difference adverb that sets the tone.

- id: b4band1.hurry-so-you-catch-the-train
  jlpt: N3
  scenario: command
  japanese: 汽車に間に合うように急げ。
  reading: きしゃにまにあうようにいそげ。
  romaji: kisha ni maniau you ni isoge.
  english: Hurry up in order to catch the train.
  tatoebaId: "183142"
  notes: 急ぐ ends in ぐ, so the imperative is 急げ. ように from Book Three's purpose chapter says what the hurrying is for. 汽車 is specifically a steam train, which is why the sentence sounds older than it is.

- id: b4band1.think-before-you-speak
  jlpt: N3
  scenario: command
  japanese: 後先をよく考えて物を言え。
  reading: あとさきをよくかんがえてものをいえ。
  romaji: atosaki o yoku kangaete mono o ie.
  english: Think about what comes of it before you speak.
  tatoebaId: "174286"
  notes: 言う ends in う, and its imperative is 言え. 後先 (seq 1269850) is literally after-and-before; JMdict files this sentence under its sense 3, consequences. The corpus gloss, "Weigh your words well", is good English and shows neither the thinking nor the command, so the card says both.

- id: b4band1.stop-running-away-from-reality
  jlpt: N3
  scenario: command
  japanese: 現実を回避するのはもうやめろ。
  reading: げんじつをかいひするのはもうやめろ。
  romaji: genjitsu o kaihi suru no wa mou yamero.
  english: Stop running away from reality.
  tatoebaId: "174863"
  notes: やめる is ichidan, so its imperative drops る and adds ろ -- やめろ. 回避する is evading something. The のは in the middle turns 現実を回避する into a thing that can be stopped; that の is the nominaliser Book Three's reference chapter named and did not teach, and this is one of the places it warned you would meet it.

- id: b4band1.bring-a-plate
  jlpt: N3
  scenario: command
  japanese: 恵一、天ぷら揚がったから、皿持って来い。
  reading: けいいち、てんぷらあがったから、さらもってこい。
  romaji: Keiichi, tenpura agatta kara, sara motte koi.
  english: Keiichi, the tempura's done, so bring a plate.
  tatoebaId: "74476"
  notes: 来る has an irregular imperative, 来い, read こい. Nothing about this sentence is rude -- it is a household at dinner, and the imperative there is ordinary. 揚がる is what deep-fried food does when it is ready, and 持って来い is the te-form plus 来い, bring it here.

# ── Don't ─────────────────────────────────────────────────────────────────────

- id: b4band1.dont-do-wicked-things
  jlpt: N3
  scenario: prohibition
  japanese: あくどい事をするな。
  reading: あくどいことをするな。
  romaji: akudoi koto o suru na.
  english: Don't do wicked things.
  tatoebaId: "234503"
  notes: Dictionary form plus な, and the dictionary form is the tell -- する, not し, not している. JMdict lists this な separately (seq 2029110, sense 1) as the prohibitive particle used with the dictionary form of a verb. あくどい is sense 2 of seq 1000260, crooked or unscrupulous.

- id: b4band1.dont-bring-it-up-in-front-of-my-mum
  jlpt: N3
  scenario: prohibition
  japanese: お袋の前ではそのことに触れるな。
  reading: おふくろのまえではそのことにふれるな。
  romaji: ofukuro no mae de wa sono koto ni fureru na.
  english: Don't bring it up in front of my mum.
  tatoebaId: "226902"
  notes: 触れる with に is touching on a subject rather than touching a thing (JMdict sense 4). お袋 is a man's casual word for his own mother, so the whole sentence sits in the same relaxed register the な does -- one friend warning another.

- id: b4band1.dont-worry-what-others-say
  jlpt: N3
  scenario: prohibition
  japanese: 他人のいうことを気にかけるな。
  reading: たにんのいうことをきにかけるな。
  romaji: tanin no iu koto o ki ni kakeru na.
  english: Don't worry about what others say.
  tatoebaId: "138537"
  notes: 気にかける (seq 1221700) is a set expression -- to let something weigh on you. いうこと is the こと you have had since Book Three, a clause turned into a noun, and 他人 is other people in the cooler sense of people outside your own circle.

- id: b4band1.dont-let-your-feelings-show
  jlpt: N3
  scenario: prohibition
  japanese: 喜怒哀楽を見せるな。
  reading: きどあいらくをみせるな。
  romaji: kidoairaku o miseru na.
  english: Don't let your feelings show.
  tatoebaId: "183532"
  notes: 見せる is ichidan and its dictionary form is what な attaches to, so the shape is unchanged from するな. 喜怒哀楽 (seq 1218870) is a four-character idiom -- joy, anger, grief, pleasure -- and it is learnt whole, as one word meaning the emotions.

- id: b4band1.dont-go-near-the-bulldog
  jlpt: N3
  scenario: prohibition
  japanese: 噛みつくといけないのでそのブルドッグに近寄るな。
  reading: かみつくといけないのでそのブルドッグにちかよるな。
  romaji: kamitsuku to ikenai node sono burudoggu ni chikayoru na.
  english: Don't go near the bulldog, in case he bites you.
  tatoebaId: "184062"
  recognitionOnly: true
  notes: Recognition only, because といけない is a frame no chapter has taught -- JMdict glosses it at 行けない sense 7 as so as not to, or in case. Read it as it would not do if he bit you, then ので for the reason, then the prohibition. The corpus split this into two English sentences; the Japanese is one.

# ── Do it, from above ─────────────────────────────────────────────────────────

- id: b4band1.stop-fiddling-with-your-hat
  jlpt: N3
  scenario: instruction
  japanese: 帽子を弄り回すのはやめなさい。
  reading: ぼうしをいじりまわすのはやめなさい。
  romaji: boushi o ijirimawasu no wa yamenasai.
  english: Stop fiddling with your hat.
  tatoebaId: "82590"
  notes: やめなさい beside lesson 4's やめろ is the whole point of this lesson -- same verb, same instruction, one step less blunt and one step above the listener rather than level with them. The corpus put a please in front of it, which なさい does not have. 弄り回す (seq 1000810) is fiddling with something.

- id: b4band1.take-a-charm-for-safety
  jlpt: N3
  scenario: instruction
  japanese: 安全のために御守りを持って行きなさい。
  reading: あんぜんのためにおまもりをもっていきなさい。
  romaji: anzen no tame ni omamori o motte ikinasai.
  english: Take an amulet for safety's sake.
  tatoebaId: "191316"
  notes: なさい goes on the ます-stem, so 行きます becomes 行きなさい. ために from Book Three gives the purpose. お守り here is おまもり, the charm you buy at a shrine (seq 1002060); the same characters read おもり mean babysitting, which is a different entry.

- id: b4band1.cover-your-mouth-when-you-cough
  jlpt: N3
  scenario: instruction
  japanese: 咳、くしゃみ、あくびをする時は口を手で隠しなさい。
  reading: せき、くしゃみ、あくびをするときはくちをてでかくしなさい。
  romaji: seki, kushami, akubi o suru toki wa kuchi o te de kakushinasai.
  english: Cover your mouth when you cough, sneeze, or yawn.
  tatoebaId: "184713"
  notes: The register なさい is built for -- a rule addressed to a child or a class, firm and not unkind. 隠します becomes 隠しなさい. くしゃみ is a sneeze and あくび a yawn; 咳 you have had since Book Two's doctor chapter.

- id: b4band1.stop-lazing-about-and-find-something-to-do
  jlpt: N3
  scenario: instruction
  japanese: 家でごろごろするのをやめて、何かすることを見つけなさい。
  reading: いえでごろごろするのをやめて、なにかすることをみつけなさい。
  romaji: ie de gorogoro suru no o yamete, nanika suru koto o mitsukenasai.
  english: Stop being lazy and find something to do.
  tatoebaId: "187134"
  notes: Two instructions joined by a te-form, with なさい only on the last -- that is the ordinary way to give a pair of them. ごろごろ is the sound-word for lolling about (JMdict sense 4, idly). Both のを and ことを turn a verb into a thing here, and the の one is the nominaliser Book Three named without teaching.

- id: b4band1.take-a-map-in-case-you-get-lost
  jlpt: N3
  scenario: instruction
  japanese: 道に迷うといけないから、地図をもって行きなさい。
  reading: みちにまようといけないから、ちずをもっていきなさい。
  romaji: michi ni mayou to ikenai kara, chizu o motte ikinasai.
  english: Take a map with you in case you get lost.
  tatoebaId: "123613"
  recognitionOnly: true
  notes: Recognition only for the same reason as the bulldog -- といけない is untaught. 道に迷う is the set phrase for losing your way. Everything after から is the plainest なさい in the corpus, and 持って行きなさい is what a parent says at the door.

# ── What someone else wants ───────────────────────────────────────────────────

- id: b4band1.tom-is-eager-to-buy-a-new-car
  jlpt: N3
  scenario: wanting
  japanese: トムはしきりに新車を買いたがっている。
  reading: トムはしきりにしんしゃをかいたがっている。
  romaji: Tomu wa shikiri ni shinsha o kaitagatte iru.
  english: Tom is eager to buy a new car.
  tatoebaId: "200084"
  notes: 買いたい would be the speaker's own wish. About somebody else it becomes 買いたがる, and in practice 買いたがっている -- a wish you can see him having. JMdict's entry for たがる (seq 2122940) says it plainly, not used in the first person. しきりに is sense 2, eagerly.

- id: b4band1.the-dealer-wants-to-sell-a-car
  jlpt: N3
  scenario: wanting
  japanese: ディーラーは車を売りたがっている。
  reading: ディーラーはくるまをうりたがっている。
  romaji: diiraa wa kuruma o uritagatte iru.
  english: The dealer wants to sell a car.
  tatoebaId: "202510"
  notes: The same shape on a third person who is not a person you know -- たがる needs somebody outside the speaker and nothing more. ディーラー in Japanese usually means a car dealer specifically (JMdict sense 1).

- id: b4band1.does-nancy-want-a-dog
  jlpt: N3
  scenario: wanting
  japanese: ナンシーは犬を飼いたがっていますか。
  reading: ナンシーはいぬをかいたがっていますか。
  romaji: Nanshii wa inu o kaitagatte imasu ka.
  english: Does Nancy want to have a dog?
  tatoebaId: "198980"
  notes: A neutral question, which is worth seeing because たがる is often described as disapproving. Here nobody is being criticised. 飼う is keeping an animal, not 買う, buying one -- the same reading, and only the character and the object tell them apart.

- id: b4band1.only-a-handful-of-men-take-childcare-leave
  jlpt: N3
  scenario: wanting
  japanese: ほんの一握りの男性しか育児休暇を取りたがらない。
  reading: ほんのひとにぎりのだんせいしかいくじきゅうかをとりたがらない。
  romaji: hon no hitonigiri no dansei shika ikuji kyuuka o toritagaranai.
  english: Only a handful of men want to take childcare leave.
  tatoebaId: "195876"
  notes: たがらない is the negative -- not wanting to, which usually reads as reluctance rather than indifference. しか with a negative verb means only, and no chapter has taught it yet; take しか ... ない as a pair, nobody but these. ほんの一握り is a mere handful.

- id: b4band1.everybody-wanted-to-know-what-had-happened
  jlpt: N3
  scenario: wanting
  japanese: 何事が起こったのか誰もが知りたがっていた。
  reading: なにごとがおこったのかだれもがしりたがっていた。
  romaji: nanigoto ga okotta no ka daremo ga shiritagatte ita.
  english: Everybody was anxious to know what had happened.
  tatoebaId: "187499"
  notes: たがっていた, the past -- they wanted to know, then. 誰もが with a positive verb is everyone; with a negative it would be nobody. 何事が起こったのか is a question folded into the sentence as the thing they wanted to know, which no chapter has taught yet.
