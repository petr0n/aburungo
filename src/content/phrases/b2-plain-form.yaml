# Book Two, Chapter 1 phrases — plain form, said out loud.
#
# Every sentence here is built from verbs and nouns the ladder already teaches,
# conjugated into forms it never did. That is the chapter's whole payload, so
# the sentences are deliberately plain: no new words carrying the interest, just
# the form doing the work.
#
# Several are the exact twins of sentences the learner already has in polite
# form, and they are chosen that way so the pairing is reviewable rather than
# asserted -- 昨夜本を読んだ against 昨夜本を読みました, 昨日は暇だった against
# 昨日は暇でした, 窓を開けないでください against 窓を開けてください.
#
# The register lesson's four sentences are four independent utterances. They are
# not an exchange and must not be authored into one: a scripted dialogue is
# multi-sentence composed text, which is the surface the content rules exist to
# keep out.
#
# content-source: training — N5/N4 canonical, pending Tatoeba verification.
#   JMdict cannot verify composed sentences (only fixed expressions are
#   headwords), so sentence checks need Tatoeba, not JMdict. The shapes were
#   checked against the Tatoeba-sourced examples bundled with JMdict for
#   Applications 3.6.2 on 2026-08-29 -- 「英国へ行ったことがありますか。」and
#   「私は彼に会ったことがある。」attest the experience pattern, 「息を深く吸ったり
#   吐いたりしてください。」the listing pattern -- but no sentence below is a
#   verbatim quotation, so none carries a Tatoeba id.
# jlpt-source: training — the level marks the band this chapter sits in.

# ── The form, named ───────────────────────────────────────────────────────────

