# Chapter 10 phrases — talking about yesterday (DR-031).
#
# The ladder already carries five sentences in the past tense — どこから来ました
# か, アメリカから来ました, 先月日本へ行きました, 去年日本へ来ました,
# ごちそうさまでした — and not one lesson ever said that ました is a tense. They
# were memorised as lumps, the way 曲がってください was before the te-form
# chapter. These sentences are the same shape, built deliberately.
#
# Every sentence uses one new element and nothing else new: the verbs, nouns and
# adjectives are all long taught, so the only thing to work out is the ending.
#
# The negatives are deliberately plain. ませんでした and くなかったです are long
# endings and the sentence around them is kept short so the ending is the part
# that stands out.
#
# content-source: training — N5 canonical, pending Tatoeba verification.
#   JMdict cannot verify composed sentences (only fixed expressions are
#   headwords), so sentence checks need Tatoeba, not JMdict.
# jlpt-source: training — JLPT level unverified

# ── What you did ──────────────────────────────────────────────────────────────

- id: past.i-ate-bread-this-morning
  jlpt: N5
  scenario: past
  japanese: 今朝パンを食べました。
  reading: けさパンをたべました。
  romaji: kesa pan o tabemashita.
  english: I ate bread this morning.

- id: past.i-met-the-teacher
  jlpt: N5
  scenario: past
  japanese: さっき先生に会いました。
  reading: さっきせんせいにあいました。
  romaji: sakki sensei ni aimashita.
  english: I met the teacher a moment ago.

- id: past.i-read-a-book-last-night
  jlpt: N5
  scenario: past
  japanese: 昨夜本を読みました。
  reading: ゆうべほんをよみました。
  romaji: yuube hon o yomimashita.
  english: I read a book last night.

