# ── What the doctor says ──────────────────────────────────────────────────────

- id: doctor.please-rest
  jlpt: N5
  scenario: health
  japanese: 休んでください。
  reading: やすんでください。
  romaji: yasunde kudasai.
  english: Please rest.
  notes: What the doctor says to you. Recognise it; you are not the one saying it.

- id: doctor.please-take-this-medicine
  jlpt: N5
  scenario: health
  japanese: この薬を飲んでください。
  reading: このくすりをのんでください。
  romaji: kono kusuri o nonde kudasai.
  english: Please take this medicine.
  notes: What the doctor says to you. Recognise it; you are not the one saying it.

- id: doctor.appointment-please
  jlpt: N5
  scenario: health
  japanese: 予約をお願いします。
  reading: よやくをおねがいします。
  romaji: yoyaku o onegai shimasu.
  english: I'd like to make an appointment.

- id: doctor.ill-call-the-hospital
  jlpt: N5
  scenario: health
  japanese: 病院に電話します。
  reading: びょういんにでんわします。
  romaji: byouin ni denwa shimasu.
  english: I'll call the hospital.

