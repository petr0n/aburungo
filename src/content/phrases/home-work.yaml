# Chapter 5 phrases — home, work & study.
#
# Every sentence uses the ～を～ます frame the ladder already established with
# 毎日コーヒーを飲みます, plus が for the intransitive half, に for a destination
# and で for a place of activity. Nothing here needs the て-form, the past tense
# or ～ています, none of which the ladder teaches yet — which is why 住む gets no
# sentence of its own despite being in this chapter's word list. It is almost
# always 住んでいます in real use, and 住みます would be teaching a form nobody
# says. The word is taught with a note; the sentence waits for the て-form.
#
# The transitive/intransitive pairs are deliberately adjacent (窓を開けます
# against 窓が開きます) so the を/が swap is visible in the sentences and not only
# asserted in the grammar note.
#
# Checked with `pnpm jlpt:sentences n5 --for ...` before authoring: the Tatoeba
# corpus yields about fifteen usable sentences across this chapter's thirty-two
# target words, and on inspection nearly all are above N5 or unsuitable. So
# these follow the same path as the other 108 phrases in this repo.
#
# content-source: training — N5 canonical, pending Tatoeba verification.
#   JMdict cannot verify composed sentences (only fixed expressions are
#   headwords), so sentence checks need Tatoeba, not JMdict.
# jlpt-source: training — JLPT level unverified

# ── Opening and closing ───────────────────────────────────────────────────────

- id: home.open-the-window
  jlpt: N5
  scenario: home
  japanese: 窓を開けます。
  reading: まどをあけます。
  romaji: mado o akemasu.
  english: I open the window.

- id: home.the-window-opens
  jlpt: N5
  scenario: home
  japanese: 窓が開きます。
  reading: まどがあきます。
  romaji: mado ga akimasu.
  english: The window opens.

- id: home.close-the-window
  jlpt: N5
  scenario: home
  japanese: 窓を閉めます。
  reading: まどをしめます。
  romaji: mado o shimemasu.
  english: I close the window.

