  reading: さむいとき、まどをしめます。
  romaji: samui toki, mado o shimemasu.
  english: When it's cold, I close the window.

- id: join.when-its-quiet-i-read
  jlpt: N4
  scenario: polite
  japanese: 静かな時、本を読みます。
  reading: しずかなとき、ほんをよみます。
  romaji: shizuka na toki, hon o yomimasu.
  english: When it's quiet, I read.

- id: join.when-i-was-a-child
  jlpt: N4
  scenario: polite
  japanese: 子供の時、この公園で遊びました。
  reading: こどものとき、このこうえんであそびました。
  romaji: kodomo no toki, kono kouen de asobimashita.
  english: When I was a child, I played in this park.

# ── The book, the person, the place ───────────────────────────────────────────

- id: join.the-book-i-bought-yesterday
  jlpt: N4
  scenario: polite
  japanese: 昨日買った本は面白かったです。
  reading: きのうかったほんはおもしろかったです。
  romaji: kinou katta hon wa omoshirokatta desu.
  english: The book I bought yesterday was interesting.

- id: join.someone-who-speaks-english
