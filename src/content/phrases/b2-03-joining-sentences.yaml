- id: join.the-friend-i-met-last-year
  jlpt: N4
  scenario: polite
  japanese: 去年会った友達に電話しました。
  reading: きょねんあったともだちにでんわしました。
  romaji: kyonen atta tomodachi ni denwa shimashita.
  english: I called the friend I met last year.
