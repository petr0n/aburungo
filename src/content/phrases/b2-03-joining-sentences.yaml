  scenario: polite
  japanese: 家に着いた時、電話します。
  reading: いえについたとき、でんわします。
  romaji: ie ni tsuita toki, denwa shimasu.
  english: When I get home, I'll call.

- id: join.when-its-cold-i-close-the-window
  jlpt: N4
  scenario: polite
