# Book Two, Chapter 2 phrases — the same exchange, told from three sides.
#
# Everything here is polite. The chapter sits directly after the one that
# teaches plain form and deliberately does not use it: the difficulty in this
# material is perspective, not register, and mixing the two would hide which
# one a learner got wrong.
#
# The sentences are built as sets rather than as a list, because the whole
# chapter is about the choice between verbs and a choice needs something to
# choose against.
#
#   友達に花をあげました  ↔  友達が花をくれました
#       one gift, one pair of people, direction reversed. The verb is the only
#       thing that differs, which is the point.
#
#   母に本をあげました / 母が本をくれました / 母に本をもらいました
#       the three-way set the choosing lesson runs on. Same two people, same
#       book, all three verbs, so nothing in the vocabulary gives the answer
#       away and only the situation can.
#
#   母がお弁当を作ってくれました  ↔  母にお弁当を作ってもらいました
#   友達が傘を貸してくれました    ↔  友達に傘を貸してもらいました
#   先生が英語を教えてくれました  ↔  先生に英語を教えてもらいました
#       the favour patterns mirror exactly across lessons 7 and 9. Each pair is
#       one event described twice, from the giver's side and the receiver's.
#
# Two of the request sentences pair against phrases the ladder already carries:
# 待ってくれますか against te.please-wait (待ってください) and 傘を貸してくれませんか
# against te.please-lend-it-to-me (貸してください). The register difference is
# reviewable rather than asserted.
#
# The four request sentences in the asking lesson are four independent things a
# person might say. They are not an exchange and must not be authored into one.
#
# One sentence the breakdown asked for is not here: a review question mixing the
# borrowing family with the receiving family. A single utterance that genuinely
# contrasts 借りる against もらう needs a disjunction — か…か or それとも — which
# no lesson teaches yet, and the alternatives are two questions in a row, which
# is a scripted exchange. The lending lesson ships with three sentences instead
# of four and the contrast lives in the grammarNote.
#
# content-source: training — N4 canonical, pending Tatoeba verification.
#   JMdict cannot verify composed sentences (only fixed expressions are
#   headwords), so sentence checks need Tatoeba, not JMdict. Every shape below
#   was checked against the Tatoeba-sourced examples bundled with JMdict for
#   Applications 3.6.2 on 2026-08-31 — 「おじさんがぼくにカメラをくれました。」and
#   「兄は私にかわいらしい人形をくれました。」attest the くれる frame,
#   「あなたは時には妹さんにおこづかいをあげますか。」the あげる frame,
#   「友人からもらったコンパクト」and「私はたびたび彼から手紙をもらう。」the から
#   source, 「母はクリスマスケーキを作ってくれた。」and「ジョーンズ先生が私たちに
#   英会話を教えてくれます。」the 〜てくれる payoff, 「ホッチキスを貸してくれませんか。」
#   and「おすすめの靴屋を教えてくれませんか。」the request register, and
#   「私はお母さんにおとぎ話を読んでもらった。」the 〜てもらう frame. No sentence
#   below is a verbatim quotation, so none carries a Tatoeba id.
# jlpt-source: training — the level marks the band this chapter sits in.

# ── Giving something to someone (Lesson 1) ────────────────────────────────────

- id: giving.i-gave-a-friend-flowers
  jlpt: N4
  scenario: giving
  japanese: 友達に花をあげました。
  reading: ともだちにはなをあげました。
  romaji: tomodachi ni hana o agemashita.
  english: I gave a friend flowers.
  chunks: ["友達に", "花を", "あげました。"]

- id: giving.ill-give-my-sister-sweets
  jlpt: N4
  scenario: giving
  japanese: 妹にお菓子をあげます。
  reading: いもうとにおかしをあげます。
  romaji: imouto ni okashi o agemasu.
  english: I'll give my little sister some sweets.
  chunks: ["妹に", "お菓子を", "あげます。"]

- id: giving.what-will-you-give-for-the-birthday
  jlpt: N4
  scenario: giving
  japanese: 誕生日に何をあげますか。
  reading: たんじょうびになにをあげますか。
  romaji: tanjoubi ni nani o agemasu ka.
  english: What are you going to give for the birthday?
  chunks: ["誕生日に", "何を", "あげますか。"]

