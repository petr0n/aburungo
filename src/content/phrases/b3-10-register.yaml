#   chapter's own level and tagging them individually would misreport coverage.

# ── How writing says "is" ─────────────────────────────────────────────────────

- id: band10.a-rainbow-is-a-natural-phenomenon
  jlpt: N3
  scenario: register
  japanese: 虹は自然現象である。
  reading: にじはしぜんげんしょうである。
  romaji: niji wa shizen genshou de aru.
  english: A rainbow is a natural phenomenon.
  tatoebaId: "122964"
  notes: The whole lesson in nine characters. Said out loud to a friend, the last word would be だ. Written in an encyclopaedia entry, it is である. Same fact, same slot, a different register.

- id: band10.one-three-and-five-are-odd-numbers
  jlpt: N3
  scenario: register
  japanese: １、３、５は奇数である。
  reading: いち、さん、ごはきすうである。
  romaji: ichi, san, go wa kisuu de aru.
  english: One, three, and five are odd numbers.
  tatoebaId: "236127"
  notes: A definition, which is where である lives. Reference books, academic papers and mathematical writing state facts in this voice; a textbook written to sound friendly uses です instead.

- id: band10.all-men-are-equal
  jlpt: N3
  scenario: register
  japanese: 人間は全て平等である。
  reading: にんげんはすべてびょうどうである。
  romaji: ningen wa subete byoudou de aru.
  english: All men are equal.
  tatoebaId: "144261"
  notes: 平等 is a な-adjective, and である lands on it exactly where だ would. Nouns and な-adjectives take である; an い-adjective does not, the same restriction だ already has.

- id: band10.nigeria-was-once-a-british-colony
  jlpt: N3
  scenario: register
  japanese: ナイジェリアはかつてイギリスの植民地であった。
  reading: ナイジェリアはかつてイギリスのしょくみんちであった。
  romaji: naijeria wa katsute igirisu no shokuminchi de atta.
  english: At one time Nigeria was a British colony.
  tatoebaId: "199356"
  notes: The past. である is built out of で plus ある, so its past is ある's past -- であった. だった says the same thing in the spoken register.

- id: band10.lincoln-was-a-great-statesman
  jlpt: N3
  scenario: register
  japanese: リンカーンは偉大な政治家であった。
  reading: リンカーンはいだいなせいじかであった。
  romaji: rinkaan wa idai na seijika de atta.
  english: Lincoln was a great statesman.
  tatoebaId: "192484"
  notes: であった again, and this is the sentence shape a history book or an obituary is written in. 偉大な政治家だった would be the same claim in a conversation.

- id: band10.the-earth-is-not-a-perfect-globe
  jlpt: N3
  scenario: register
  japanese: 地球は完全な球体ではない。
  reading: ちきゅうはかんぜんなきゅうたいではない。
  romaji: chikyuu wa kanzen na kyuutai de wa nai.
  english: The earth is not a perfect globe.
  tatoebaId: "126970"
  notes: The negative, and it is the one part of this paradigm that is not new. じゃない, which you already have, is a contraction of ではない -- so writing does not need a special negative, it just declines to contract the one everybody uses.

- id: band10.africa-is-a-continent-greenland-is-not
  jlpt: N3
  scenario: register
  japanese: アフリカは大陸であるが、グリーンランドはそうではない。
  reading: アフリカはたいりくであるが、グリーンランドはそうではない。
  romaji: afurika wa tairiku de aru ga, guriinrando wa sou de wa nai.
  english: Africa is a continent; Greenland is not.
  tatoebaId: "230381"
  notes: であるが, though it is, is the written register's けど. That が joining two clauses is a but no lesson has taught you yet; where it sits between two halves of a sentence, read it as but.

- id: band10.he-is-a-doctor-and-a-university-professor
  jlpt: N3
  scenario: register
  japanese: あの人は医者でありまた大学の先生でもある。
  reading: あのひとはいしゃでありまただいがくのせんせいでもある。
  romaji: ano hito wa isha de ari mata daigaku no sensei de mo aru.
  english: He is a doctor and a university professor.
  tatoebaId: "230730"
  notes: であり is である stopped halfway, so the sentence can carry on -- is a doctor, and also is a teacher. This is the copula doing what the て-form does for verbs, and nothing in this course has shown you it before.

- id: band10.cars-are-factory-products-foods-are-farm-products
  jlpt: N3
  scenario: register
  japanese: 自動車は工業製品であり、食料は農作物である。
  reading: じどうしゃはこうぎょうせいひんであり、しょくりょうはのうさくぶつである。
  romaji: jidousha wa kougyou seihin de ari, shokuryou wa nousakubutsu de aru.
  english: Cars are factory products, while foods are farm products.
  tatoebaId: "150038"
  notes: The shape to take away whole -- one statement closed with であり, the next closed with である. Two claims balanced against each other with no conjunction between them at all, which is why formal writing reaches for it so often.

- id: band10.a-car-is-a-necessity-not-a-luxury
  jlpt: N3
  scenario: register
  japanese: アメリカでは自動車は必需品であり贅沢品ではない。
  reading: アメリカではじどうしゃはひつじゅひんでありぜいたくひんではない。
  romaji: amerika de wa jidousha wa hitsujuhin de ari zeitakuhin de wa nai.
  english: In the United States the automobile is a necessity and not a luxury.
  tatoebaId: "230257"
  notes: であり joining to a negative this time. What follows であり does not have to be another である -- here it is ではない, and the two halves are is and is not.

- id: band10.edison-was-not-a-bright-student
  jlpt: N3
  scenario: register
  japanese: エジソンは秀才ではなかった。
  reading: エジソンはしゅうさいではなかった。
  romaji: ejison wa shuusai de wa nakatta.
  english: Edison was not a bright student.
  tatoebaId: "227976"
  notes: The last cell of the paradigm, and it is built the way the others were -- ある goes to なかった, and the は stays. Book Two gave you じゃなかった; ではなかった is the same shape with nothing contracted.

# ── Still changing ────────────────────────────────────────────────────────────

- id: band10.old-traditions-are-crumbling-away
  jlpt: N3
  scenario: aspect
  japanese: 古い伝統が消滅しつつある。
  reading: ふるいでんとうがしょうめつしつつある。
  romaji: furui dentou ga shoumetsu shitsutsu aru.
  english: Old traditions are crumbling away.
  tatoebaId: "174615"
  notes: Stop the verb before ます -- 消滅し -- and add つつある. It says the change is under way and not finished. 消滅している would report a state already arrived at.

- id: band10.the-atmosphere-is-being-polluted
  jlpt: N3
  scenario: aspect
  japanese: 大気が汚染されつつある。
  reading: たいきがおせんされつつある。
  romaji: taiki ga osen saretsutsu aru.
  english: The atmosphere is being polluted.
  tatoebaId: "137591"
  notes: つつある sitting on a passive verb. 汚染される is the passive you already build; つつある then says it is happening progressively, and nobody is named as doing the polluting.

- id: band10.the-international-situation-is-becoming-grave
  jlpt: N3
  scenario: aspect
  japanese: 国際情勢は重大になりつつある。
  reading: こくさいじょうせいはじゅうだいになりつつある。
  romaji: kokusai jousei wa juudai ni naritsutsu aru.
  english: The international situation is becoming grave.
  tatoebaId: "173054"
  notes: なる in front of it gives なりつつある, is becoming, mid-change -- the news bulletin's way of saying a thing has not got there yet.

- id: band10.my-business-is-picking-up-again
  jlpt: N3
  scenario: aspect
  japanese: 私のビジネスは再び回復しつつあります。
  reading: わたしのビジネスはふたたびかいふくしつつあります。
  romaji: watashi no bijinesu wa futatabi kaifuku shitsutsu arimasu.
  english: My business is picking up again.
  tatoebaId: "164122"
  notes: ある is an ordinary verb, so it takes ます like any other. つつあります is the polite form, and it is what you would say to a client rather than write in a report.

- id: band10.computers-are-being-introduced-into-this-company
  jlpt: N3
  scenario: aspect
  japanese: コンピューターがこの会社に導入されつつあります。
  reading: コンピューターがこのかいしゃにどうにゅうされつつあります。
  romaji: konpyuutaa ga kono kaisha ni dounyuu saretsutsu arimasu.
  english: Computers are being introduced into this company.
  tatoebaId: "217282"
  notes: Three things stacked and each one readable on its own -- 導入する made passive, then つつある for the change under way, then ます for the register. Read them left to right and nothing is hidden.

- id: band10.the-weather-was-getting-worse-as-the-day-went-on
  jlpt: N3
  scenario: aspect
  japanese: 日が経つにつれて、天気は次第に悪化しつつあった。
  reading: ひがたつにつれて、てんきはしだいにあっかしつつあった。
  romaji: hi ga tatsu ni tsurete, tenki wa shidai ni akka shitsutsu atta.
  english: The weather was getting worse and worse as the day went on.
  tatoebaId: "122956"
  notes: The past, つつあった, because ある is what carries the tense. につれて at the front, as-and-when, is not taught anywhere in this course -- here it just says the two changes kept pace with each other.

- id: band10.we-are-born-crying
  jlpt: N3
  scenario: aspect
  japanese: 人は泣きつつ生まれ、泣き言を言いつつ暮らし、失望落胆して死ぬ。
  reading: ひとはなきつつうまれ、なきごとをいいつつくらし、しつぼうらくたんしてしぬ。
  romaji: hito wa nakitsutsu umare, nakigoto o iitsutsu kurashi, shitsubou rakutan shite shinu.
  english: We are born crying, spend our lives complaining, and die disappointed.
  tatoebaId: "144511"
  notes: つつ with no ある after it, twice in one sentence, doing ながら's own job -- crying while being born, complaining while living. The ます-stem in front of it is the same stem ながら takes.

- id: band10.we-must-keep-our-eyes-on-the-future
  jlpt: N3
  scenario: aspect
  japanese: 我々は将来を見据えつつ、今そこにある危機を乗り越えていかねばならない。
  reading: われわれはしょうらいをみすえつつ、いまそこにあるききをのりこえていかねばならない。
  romaji: wareware wa shourai o misuetsutsu, ima soko ni aru kiki o norikoete ikaneba naranai.
  english: We must keep our eyes on the future while getting through the crisis that is here now.
  tatoebaId: "185773"
  notes: Bare つつ again, and everything around it is written register too -- 我々 for we, and ねばならない, the literary shape of なければならない. This is the voice of an editorial.

# ── Because, in writing ───────────────────────────────────────────────────────

- id: band10.the-charges-were-dropped-because-of-his-youth
  jlpt: N3
  scenario: cause
  japanese: 若さゆえに彼に対する告訴は取り下げられた。
  reading: わかさゆえにかれにたいするこくそはとりさげられた。
  romaji: wakasa yue ni kare ni taisuru kokuso wa torisagerareta.
  english: The charges against him were dropped because of his youth.
  tatoebaId: "148764"
  notes: A noun, then ゆえに, then the consequence. から and ので are how a person would tell you the same thing; ゆえに is how the court report writes it.

- id: band10.canadian-english-has-features-of-both
  jlpt: N3
  scenario: cause
  japanese: その起源ゆえに、カナダ英語にはアメリカ英語とイギリス英語の両方の特徴がある。
  reading: そのきげんゆえに、カナダえいごにはアメリカえいごとイギリスえいごのりょうほうのとくちょうがある。
  romaji: sono kigen yue ni, kanada eigo ni wa amerika eigo to igirisu eigo no ryouhou no tokuchou ga aru.
  english: Because of its origins, Canadian English has features of both American and British English.
  tatoebaId: "236966"
  recognitionOnly: true
  notes: The same noun-plus-ゆえに, opening the sentence rather than sitting inside it -- exactly where English puts because of. Recognition only, because its reading runs to 48 kana.

- id: band10.some-things-cannot-be-put-into-words
  jlpt: N3
  scenario: cause
  japanese: 愛するがゆえに言葉にできないこともあるし、言わぬが花ということもあります。
  reading: あいするがゆえにことばにできないこともあるし、いわぬがはなということもあります。
  romaji: aisuru ga yue ni kotoba ni dekinai koto mo aru shi, iwanu ga hana to iu koto mo arimasu.
  english: Because I love you there are things I cannot put into words, and there are things better left unsaid.
  tatoebaId: "191565"
  notes: A whole clause in front of ゆえに needs が between them -- 愛する becomes 愛するがゆえに. 言わぬが花, some things are better left unsaid, is a set phrase in its own right.

- id: band10.half-the-muscle-can-give-way-to-fat
  jlpt: N3
  scenario: cause
  japanese: ゆえに、筋肉の５０パーセントが脂肪に取って代わられる可能性がある。
  reading: ゆえに、きんにくのごじゅっパーセントがしぼうにとってかわられるかのうせいがある。
  romaji: yue ni, kinniku no gojuppaasento ga shibou ni totte kawarareru kanousei ga aru.
  english: Hence 50 percent of the muscle can give way to fat.
  tatoebaId: "192977"
  notes: ゆえに standing alone at the head of a sentence, which is where an argument draws its conclusion. 取って代わられる is the passive of 取って代わる, to supplant.

- id: band10.miss-baker-had-a-special-place-in-the-car-park
  jlpt: N3
  scenario: cause
  japanese: 学寮長のベイカーさんは、それゆえに自分の所有する小さい車のために、駐車場に特別なスペースを設けた。
  reading: がくりょうちょうのベイカーさんは、それゆえにじぶんのしょゆうするちいさいくるまのために、ちゅうしゃじょうにとくべつなスペースをもうけた。
  romaji: gakuryouchou no beikaa san wa, sore yue ni jibun no shoyuu suru chiisai kuruma no tame ni, chuushajou ni tokubetsu na supeesu o mouketa.
  english: The head of the college, Miss Baker, therefore had a special place in the car park for her small car.
  tatoebaId: "184184"
  recognitionOnly: true
  notes: それゆえに and ために in one sentence -- therefore, and for the sake of. Worth reading slowly for that pairing alone. Recognition only, because its reading runs to 68 kana.

# ── In, formally speaking ─────────────────────────────────────────────────────

- id: band10.english-is-useful-in-commerce
  jlpt: N3
  scenario: domain
  japanese: 英語は商業において役に立つ。
  reading: えいごはしょうぎょうにおいてやくにたつ。
  romaji: eigo wa shougyou ni oite yaku ni tatsu.
  english: English is useful in commerce.
  tatoebaId: "189119"
  notes: A bare noun, then において, with no particle and no copula in between -- 商業において. で would carry the same sentence in a plainer voice.

- id: band10.salt-was-precious-in-ancient-times
  jlpt: N3
  scenario: domain
  japanese: 古代において塩は希少で貴重な商品であった。
  reading: こだいにおいてしおはきしょうできちょうなしょうひんであった。
  romaji: kodai ni oite shio wa kishou de kichou na shouhin de atta.
  english: Salt was a rare and costly commodity in ancient times.
  tatoebaId: "174595"
  notes: において marking a stretch of time rather than a place, and であった closing the sentence. One sentence, two of this chapter's patterns, and it reads as one continuous voice rather than two decorations.

- id: band10.some-people-place-importance-on-money
  jlpt: N3
  scenario: domain
  japanese: 人生においてお金を重視する人もいる。
  reading: じんせいにおいておかねをじゅうしするひともいる。
  romaji: jinsei ni oite okane o juushi suru hito mo iru.
  english: Some people place a lot of importance on money in life.
  tatoebaId: "144033"
  notes: 人生において is neither a place nor a time but a span you live inside. There is a を in this sentence and it belongs to 重視する -- the noun in front of において is never marked を, which is the surest way to tell this construction from the verb 置く written in kana.

- id: band10.this-suit-is-superior-in-quality
  jlpt: N3
  scenario: domain
  japanese: この服は品質においてあの服よりもずっと優れていると思う。
  reading: このふくはひんしつにおいてあのふくよりもずっとすぐれているとおもう。
  romaji: kono fuku wa hinshitsu ni oite ano fuku yori mo zutto sugurete iru to omou.
  english: I think this suit is much superior to that one in quality.
  tatoebaId: "219951"
  notes: The second job -- in what respect, not in what place. 品質において says the comparison is about quality and nothing else. This is where English says in terms of.

- id: band10.she-is-inferior-to-him-in-math
  jlpt: N3
  scenario: domain
  japanese: 彼女は、彼より、数学において劣っている。
  reading: かのじょは、かれより、すうがくにおいておとっている。
  romaji: kanojo wa, kare yori, suugaku ni oite ototte iru.
  english: She is inferior to him in math.
  tatoebaId: "93694"
  notes: The same respect-marking job with 劣る instead of 優れる. において and より work together here -- より says who the comparison is against, において says what it is about.

- id: band10.accuracy-is-indispensable-in-measurement
  jlpt: N3
  scenario: domain
  japanese: 測定においては正確さは欠かせないものである。
  reading: そくていにおいてはせいかくさはかかせないものである。
  romaji: sokutei ni oite wa seikakusa wa kakasenai mono de aru.
  english: In measurement, accuracy is indispensable.
  tatoebaId: "139892"
  notes: においては, with は added, sets 測定 up as the topic before saying anything about it -- as for measurement. The sentence closes on ものである, the written voice again.

- id: band10.do-everything-on-your-own-responsibility
  jlpt: N3
  scenario: domain
  japanese: 自分の責任において何でも行いなさい。
  reading: じぶんのせきにんにおいてなんでもおこないなさい。
  romaji: jibun no sekinin ni oite nandemo okonainasai.
  english: Do everything on your own responsibility.
  tatoebaId: "149797"
  notes: 責任において is a fixed phrase worth keeping whole -- on someone's own responsibility, under their own authority. JMdict gives this its own sense of において, separate from the place and the respect senses.

- id: band10.you-must-decide-on-your-own-responsibility
  jlpt: N3
  scenario: domain
  japanese: 君らは自らの責任において、自らの良心に照らし合わせ、決定を下さなくてはならない。
  reading: きみらはみずからのせきにんにおいて、みずからのりょうしんにてらしあわせ、けっていをくださなくてはならない。
  romaji: kimira wa mizukara no sekinin ni oite, mizukara no ryoushin ni terashiawase, kettei o kudasanakute wa naranai.
  english: You must make your decisions on your own responsibility, in the light of your own conscience.
  tatoebaId: "176788"
  recognitionOnly: true
  notes: The same fixed phrase, this time with なくてはならない closing the sentence. 自ら is the written register's own word for oneself. Recognition only, because its reading runs to 53 kana.

- id: band10.the-line-between-amateur-and-professional-is-disappearing
  jlpt: N3
  scenario: domain
  japanese: ここで明確にしなければならない点は、スポーツにおいてアマチュアとプロフェッショナルの境界線が消失しつつあるということだ。
  reading: ここでめいかくにしなければならないてんは、スポーツにおいてアマチュアとプロフェッショナルのきょうかいせんがしょうめつしつつあるということだ。
  romaji: koko de meikaku ni shinakereba naranai ten wa, supootsu ni oite amachua to purofesshonaru no kyoukaisen ga shoumetsu shitsutsu aru to iu koto da.
  english: The point we must clarify here is that the lines between amateur and professional in sport are beginning to disappear.
  tatoebaId: "224527"
  recognitionOnly: true
  notes: において and つつある in one sentence, which is what this chapter's register actually looks like in the wild -- not one formal word in a plain sentence, but several agreeing with each other. Recognition only, because its reading runs to 70 kana.
