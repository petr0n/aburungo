# Book Three, chapter 11 phrases -- register and the written voice.
#
# Thirty-three sentences, and not one of them is ours. 04-stage-reading.md
# section 8 withdraws the training-canonical exemption at the reading stage and
# above, in those words -- "no training-canonical sentences at the reading stage
# and above". So every sentence below is a verbatim Tatoeba pair carried out of
# server/data/jmdict-examples-eng-3.6.2.json with its id in `tatoebaId`, and
# nothing here was composed, trimmed, joined or smoothed. Where a shape had no
# attested sentence it is described in a grammarNote and has no card, which is
# what every chapter of this book has done and what the audits of those
# chapters called correct.
#
# Two shapes this chapter names and does not card, both deliberate:
#
#   The kanji spelling of ゆえ, 故に. The corpus has exactly one genuine
#   citation of it, #75231, and that sentence mixes the written copula with
#   net slang (一般ピーポー) and a sentence-final わ. Its English would have to
#   be rewritten almost whole to be usable. It is named in the ゆえ lesson's
#   grammarNote in English and carded nowhere. (The other sixteen raw hits for
#   故に and が故 are 事故, accident, and 故障, breakdown -- unrelated words that
#   happen to contain 故.)
#
#   Bare つつ doing an unambiguously concessive job. The corpus has one --
#   #76645, where a しかし after the つつ makes the concession explicit -- and it
#   is forty-nine characters of otaku slang whose corpus English is a loose
#   paraphrase. It is described in the つつ lesson's grammarNote in English and
#   carded nowhere. The two bare-つつ cards below (#144511, #185773) are the
#   simultaneous job, which is what the corpus actually supplies.
#
# Three things quoting rather than composing cost this chapter:
#
#   The imbalance below is the corpus's, not a choice. である has 761 raw hits,
#   において 50 (47 genuine), つつ 36 (25 genuine) and ゆえ 6 in kana. Five of
#   the six ゆえ sentences are cards here -- six is all there is, and the sixth
#   belongs to another chapter (see the next paragraph).
#
#   Four cards carry `recognitionOnly: true`, every one because its kana
#   reading runs past Book Two's longest typed answer -- 41 kana,
#   quote.my-friend-said-that-shop-is-famous-but-i-wont-go -- not because the
#   grammar is beyond the learner. Their readings run 48, 53, 68 and 70.
#
#   Two sentences this chapter would otherwise have carded belong to the
#   obligation chapter, which teaches the patterns they turn on and cards them
#   there. #232346 (あなたはもっと理性的であるべきだ) is a べき sentence and
#   #204782 (それゆえここにとどまらざるを得ないだろう) is a ざるを得ない one.
#   Neither is carded here. #232346's job in the copula lesson -- showing that
#   a noun needs である in front of べき, because べき wants a verb -- is made in
#   that lesson's grammarNote in English instead, and #227976 carries the
#   paradigm cell it was displaced from. #204782 was the corpus's only それゆえ
#   without a following に; the ゆえ lesson names that variant in English, and
#   #184184 carries それゆえに.
#
# ---------------------------------------------------------------------------
# GLOSS DEPARTURES. The English is Tatoeba's own wherever Tatoeba's own would
# do. Seven of the thirty-three depart from it. Every one is listed here by id so
# a reviewer can diff this list against the corpus rather than take it on
# trust. Every Japanese string is untouched.
#
#   Where the corpus English hid the grammar the card exists to teach:
#   #185773 -- "and prepare to get through the coming crisis" shows nothing of
#     つつ, and 今そこにある危機 is the crisis already here, not a coming one.
#     Glossed "We must keep our eyes on the future while getting through the
#     crisis that is here now."
#   #191565 -- "My love for you won't let me tell you everything" carries no
#     because at all, and がゆえに is the card's whole point. Glossed "Because I
#     love you there are things I cannot put into words, and there are things
#     better left unsaid."
#   #184184 -- それゆえに, therefore, is absent from the corpus English
#     entirely. Glossed with therefore restored and nothing else changed.
#   #139892 -- "Precision in measurement is a necessity" rebuilds the sentence
#     as one noun phrase and においては disappears. Glossed "In measurement,
#     accuracy is indispensable."
#   #149797 -- "at your own risk" is the right English idiom and contains no
#     trace of 責任において, the fixed phrase this card exists for. Glossed "Do
#     everything on your own responsibility."
#
#   Where the corpus English was wrong or used a word the learner would not:
#   #176788 -- "decisions about your responsibility" misreads 自らの責任に
#     おいて, which says how you decide, not what you decide about. Glossed
#     "You must make your decisions on your own responsibility, in the light of
#     your own conscience."
#   #144033 -- "a lot more emphasis" makes a comparison the Japanese does not
#     make; 重視する is to attach importance to something. Glossed "Some people
#     place a lot of importance on money in life."
#
# ---------------------------------------------------------------------------
# ROUTING. Book Three's stage is "reading" (books.ts), and LearnPage routes
# every non-foundation book to the typed FillBlankCard, where the learner types
# the whole reading back. So all of these are typed except the four marked
# recognitionOnly, and each of those four names its length in `notes`. Every
# lesson in this chapter keeps at least three typed cards, so no pattern here
# depends on its grammar card alone the way chapter 2's ものだから had to.
#
# ---------------------------------------------------------------------------
# TRAPS the attestation pass screened out by hand, recorded so the next pass
# does not have to find them again:
#
#   Three of において's 50 raw hits are the verb 置く in its て-form, spelled
#   identically to に + おいて once written in kana -- #234564 (カメラを家に
#   おいてきた), #216737 (トップにおいています), #79178 (手元においてある). In
#   all three the giveaway is the same, a thing marked を being physically put
#   somewhere, with てくる, ている or てある after the おいて. None is used.
#
#   Eleven of つつ's 36 raw hits are unrelated words containing the two kana --
#   つつじ azalea (#174037), づつ running into つめ (#78480), つつく to peck
#   (#197445, #76788, #77078, #195367), つつまれる to be wrapped (#219470),
#   つつがなく without incident (#76078), 夢うつつ half-asleep (#80970),
#   つつましい and つつましやか modest (#159333, #92099). None is used. JMdict
#   carries three more homographs of the bare kana that this corpus does not
#   happen to contain -- 筒 pipe 1449590, 銃 gun 2864475, 鶺鴒 wagtail 1575110 --
#   so the auxiliary is seq 1008120, prt, "while / even though; despite", and
#   nothing else.
#
#   ゆえ has a homophone of its own. JMdict 1267120 is 故 ゆえ, "reason; cause"
#   and the conjunction "because of", which is this chapter's word; 2854173 is
#   湯坐 ゆえ, a Yamato-court nursemaid, an entirely different word. The gloss
#   checked here is 1267120.
#
# ---------------------------------------------------------------------------
# READING JUDGEMENT CALLS, both numerals, both stated rather than left to be
# discovered:
#
#   #192977's ５０パーセント is transcribed ごじゅっパーセント. じゅっ is the
#   ordinary modern reading of 十 before a p-initial counter; じっ is the older
#   prescriptive one and is still heard. Either is defensible and the card asks
#   for one of them.
#
#   #150038's 農作物 is transcribed のうさくぶつ. JMdict 1827050 lists
#   のうさくもつ as a second reading; のうさくぶつ is the ordinary modern one.
#
# content-source: Tatoeba, via the sentence pairs embedded in JMdict for
#   Applications 3.6.2 (server/data/jmdict-examples-eng-3.6.2.json). Every
#   phrase carries its sentence id in `tatoebaId`; the id is quoted, because
#   YAML reads a bare 236127 as a number and the schema rejects it. Verified by
#   id against the corpus on 2026-09-05 -- all 33 resolve and every Japanese
#   string below matches its source character for character. Kana readings and
#   romaji are transcriptions of the quoted sentence, not new content; every
#   compound whose reading was not already obvious was checked against JMdict
#   (自然現象 しぜんげんしょう 1726720, 奇数 きすう 1219410, 平等 びょうどう
#   1507670, 植民地 しょくみんち 1357350, 偉大 いだい 1155920, 政治家 せいじか
#   1375980, 完全 かんぜん 1211510, 球体 きゅうたい 1230000, 大陸 たいりく
#   1415150, 工業製品 こうぎょうせいひん 1935000, 食料 しょくりょう 1358670,
#   農作物 のうさくぶつ 1827050, 自動車 じどうしゃ 1318400, 必需品 ひつじゅひん
#   1487500, 贅沢品 ぜいたくひん 1573160, 秀才 しゅうさい 1332630, 伝統
#   でんとう 1442260, 消滅 しょうめつ 1350380, 大気 たいき 1413330, 汚染 おせん
#   1179040, 国際 こくさい 1286400, 情勢 じょうせい 1356320, 重大 じゅうだい
#   1336500, 回復 かいふく 1199720, 導入 どうにゅう 1453790, 経つ たつ 1251100,
#   次第 しだい 1316680, 悪化 あっか 1151470, 泣き言 なきごと 1684740, 失望
#   しつぼう 1320170, 落胆 らくたん 1548820, 我々 われわれ 1607050, 将来
