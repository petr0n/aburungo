# N5 daily-loop units — mid-way checkpoint (Unit 21).
#
# Authored for this position rather than moved into it. The existing checkpoint
# at 39-40 could not be relocated: its own worked example uses 帰る, which is not
# taught until unit 34, and five of its nine review kanji (天 気 雨 好 日) arrive
# between units 28 and 36. Dropping it here would have reviewed material the
# learner has not met — incoherent rather than merely hard.
#
# Sits at the boundary between "Getting around" and "Hotel", so it consolidates
# four complete situations instead of splitting one: greetings & basics (1-7),
# food & drink (8-12), shopping (13-15), getting around (16-20). 148 words are
# available to it; the sweep samples 24 across themes.
#
# A sweep, not a Hana shell. CheckpointSweep already scopes itself to units
# ordered before the checkpoint, so this needs no new mechanism and — unlike the
# 39-40 pair — it functions today rather than degrading to an intro screen.
#
# The id is deliberately not positional. n5.unit-N ties identity to a slot, and
# the moment anything is inserted the two disagree. PathProgress stores ids, so
# ids must be stable while order is free to move.
#
# content-source: n/a — introduces no content, only re-presents taught items

- id: n5.checkpoint-mid
  order: 21
  situation: Integration & checkpoint
  title: Out and about
  canDo: Recognise the vocabulary from the first four situations
  checkpoint: sweep
  wordIds: []
  phraseIds: []
  kanji: []
  grammarNote: "No new material. A wide pass over everything from greetings, food and drink, shopping, and getting around — the four situations you have worked through so far. Words are sampled across themes rather than tested exhaustively, anything you do not place comes straight back, and it ends when there is nothing left to place. There is no score and nothing is recorded; whatever you miss simply returns to your review queue sooner."
