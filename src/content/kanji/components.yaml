# Component keywords for the kanji intro card.
#
# Keywords are original work, written from KANJIDIC2 meanings and from plain
# shape description. Never adapted from Heisig's Remembering the Kanji or from
# WaniKani -- both are copyrighted keyword sets.
#
# A keyword is a label, not a definition. `note` carries the extra sentence a
# radical-only form needs; components that are themselves taught kanji take the
# same meaning that kanji already carries, so one shape never has two names.

# --- components that are themselves taught kanji -----------------------------
# Keyword is the kanji's first meaning in kanji.yaml, which is the word the
# drill card shows. Where the shape does a second job as a component, the note
# says so rather than the keyword drifting away from the kanji's own name.

- glyph: "一"
  keyword: "one"
- glyph: "九"
  keyword: "nine"
- glyph: "二"
  keyword: "two"
- glyph: "人"
  keyword: "person"
- glyph: "口"
  keyword: "mouth"
- glyph: "夕"
  keyword: "evening"
- glyph: "大"
  keyword: "large"
- glyph: "女"
  keyword: "woman"
- glyph: "子"
  keyword: "child"
- glyph: "小"
  keyword: "little"
- glyph: "山"
  keyword: "mountain"
- glyph: "日"
  keyword: "day"
  note: "the same shape stands for the sun"
- glyph: "月"
  keyword: "month"
  note: "the same shape stands for the moon"
- glyph: "木"
  keyword: "tree"
- glyph: "母"
  keyword: "mother"
- glyph: "水"
  keyword: "water"
- glyph: "牛"
  keyword: "cow"
- glyph: "白"
  keyword: "white"
- glyph: "目"
  keyword: "eye"
- glyph: "立"
  keyword: "stand up"
- glyph: "耳"
  keyword: "ear"
- glyph: "車"
  keyword: "car"
- glyph: "雨"
  keyword: "rain"
- glyph: "食"
  keyword: "eat"
  note: "the same shape stands for food"

# --- radical-only forms ------------------------------------------------------
# These are shapes, not kanji a learner will meet on their own. Where the
# meaning is settled the keyword says it plainly; where it is not, the keyword
# describes the strokes rather than guessing.

- glyph: "⺅"
  keyword: "person"
  note: "the standing form of 人, written down the left side"
- glyph: "⺉"
  keyword: "knife"
  note: "the upright form of 刀, written down the right side"
- glyph: "⺌"
  keyword: "little"
  note: "the top form of 小, three short strokes"
- glyph: "⺖"
  keyword: "heart"
  note: "the upright form of 心, written down the left side"
- glyph: "⺘"
  keyword: "hand"
  note: "the form of 手 written down the left side"
- glyph: "⺡"
  keyword: "water"
  note: "the flowing form of 水, three drops down the left side"
- glyph: "⺣"
  keyword: "fire"
  note: "the four-dot form of 火, written along the bottom"
- glyph: "⺭"
  keyword: "altar"
  note: "the left-side form of 示, a table for offerings"
- glyph: "⺲"
  keyword: "net"
  note: "a net, written flat across the top"
- glyph: "⺹"
  keyword: "old age"
  note: "the top form of 老"
- glyph: "⺾"
  keyword: "grass"
  note: "three strokes like grass, written across the top"
- glyph: "⻌"
  keyword: "road"
  note: "a stroke with a sweeping tail, wrapping the left side and the bottom"
- glyph: "⻖"
  keyword: "mound or village"
  note: "the 阝 shape - a hill on the left of a kanji, a village on the right"
- glyph: "ノ"
  keyword: "a slanting stroke"
  note: "one stroke falling to the left, written like ノ"
- glyph: "ハ"
  keyword: "two strokes apart"
  note: "two strokes spreading downward, the shape of 八"
- glyph: "マ"
  keyword: "a katakana ma shape"
  note: "two strokes like マ, sitting on top"
- glyph: "ヨ"
  keyword: "a katakana yo shape"
  note: "three strokes joined at the left, written like ヨ"
- glyph: "丶"
  keyword: "a dot"
  note: "a single dot stroke"
- glyph: "丷"
  keyword: "two short strokes"
  note: "two strokes leaning apart, sitting on top"
- glyph: "乙"
  keyword: "a bent stroke"
  note: "one stroke that turns and hooks, as in 七"
- glyph: "也"
  keyword: "a wide hooked stroke"
  note: "the 也 shape, three strokes ending in a broad hook"
- glyph: "亅"
  keyword: "a hook stroke"
  note: "a vertical stroke with a hook at the foot"
- glyph: "亠"
  keyword: "a lid"
  note: "a dot over a level stroke, sitting on top"
- glyph: "亡"
  keyword: "deceased"
- glyph: "儿"
  keyword: "legs"
  note: "two strokes like legs, holding up what sits above"
- glyph: "免"
  keyword: "excuse"
  note: "the 免 shape, to let someone off a duty"
- glyph: "冂"
  keyword: "an open frame"
  note: "two strokes forming a frame open at the bottom"
- glyph: "冖"
  keyword: "a cover"
  note: "a flat stroke with a small corner, covering what is below"
- glyph: "冫"
  keyword: "ice"
  note: "two short strokes, the ice radical"
- glyph: "几"
  keyword: "a small table"
  note: "two strokes like a low table"
- glyph: "凵"
  keyword: "an open box"
  note: "three strokes forming a box open at the top"
- glyph: "刀"
  keyword: "sword"
- glyph: "力"
  keyword: "power"
- glyph: "勹"
  keyword: "a wrapping stroke"
  note: "a stroke curving over to enclose what is inside"
- glyph: "勿"
  keyword: "three slants in a wrap"
  note: "the 勿 shape, as in 物 and 易"
- glyph: "匕"
  keyword: "a spoon"
  note: "two strokes, the spoon radical"
- glyph: "十"
  keyword: "ten"
- glyph: "卜"
  keyword: "divination"
  note: "the 卜 shape, a mark read for omens"
- glyph: "厂"
  keyword: "a cliff"
  note: "two strokes like an overhanging cliff"
- glyph: "厶"
  keyword: "a katakana mu shape"
  note: "two strokes like ム, as in 会 and 台"
- glyph: "又"
  keyword: "again"
  note: "the 又 shape, drawn from a right hand"
- glyph: "囗"
  keyword: "an enclosure"
  note: "a box drawn around what is inside"
- glyph: "土"
  keyword: "soil"
- glyph: "士"
  keyword: "gentleman"
  note: "like 土, but the longer stroke is on top"
- glyph: "夂"
  keyword: "a foot"
  note: "three strokes drawn like a foot stepping down"
- glyph: "宀"
  keyword: "a roof"
  note: "a dot and a wide cover, drawn over the whole kanji"
- glyph: "寸"
  keyword: "a measure"
  note: "the 寸 shape, an old unit about an inch long"
- glyph: "尸"
  keyword: "a bent body"
  note: "three strokes like a person bending or lying down"
- glyph: "工"
  keyword: "craft"
- glyph: "巴"
  keyword: "a curled comma"
  note: "the 巴 shape, the lower half of 色"
- glyph: "巾"
  keyword: "cloth"
- glyph: "干"
  keyword: "dry"
- glyph: "幺"
  keyword: "a short thread"
  note: "the 幺 shape, a small twist of thread"
- glyph: "广"
  keyword: "a lean-to roof"
  note: "a dot over a cliff shape, a building open at the front"
- glyph: "廴"
  keyword: "a long stride"
  note: "one sweeping stroke along the bottom left"
- glyph: "廾"
  keyword: "two hands"
  note: "the 廾 shape, two hands raised from below"
- glyph: "弋"
