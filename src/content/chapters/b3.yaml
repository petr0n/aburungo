# Book Three chapters.
#
# A chapter in this book is a **band** (04-stage-reading.md section 3, owner
# sign-off 2026-08-20): roughly ten connective patterns plus the slice of the
# reading library that exercises them, one pattern to a lesson. Not a
# situation -- this stage's vocabulary is too broad to pre-curate and arrives
# by mining, so "the lessons in this chapter" can no longer be a word list.
#
# Five bands, because five bands have content. Five more are designed
# (docs/plans/book-three-band-*.md) and none of them is authored. The same rule
# Book Two's file records applies: a chapter declared here shows up on the
# ladder whether or not any lesson points at it, and an empty chapter is
# something a learner can reach and find hollow. Each joins as its lessons land.
#
# The passive band opens the book rather than sitting among the connectives,
# and that is not an ordering preference. Book Two's quoted-speech chapter
# teaches to-iwarete-imasu for recognition only and states in its own header
# that the conjugation and production of both "open the next book" -- this one.
# The band skeleton originally forgot it; see book-three-bands.md section 3a.
#
# content-source: n/a -- this file names and orders existing lessons; it adds
#   no Japanese content of its own.

