# Book Three, Chapter 5 grammar patterns -- more than one way to say "when".
#
# One pattern per teaching lesson, each blanking the thing that lesson exists
# for out of one of its own sentences. The blank is matched against the
# phrase's reading, so these are kana.
#
# The `pattern` strings are bare kana for a mechanical reason the passive
# chapter's file records first: scripts/levelling.mjs's grammarSurface()
# rejects any pattern containing a Latin character or a digit and needs at
# least one ～-delimited fragment of two or more characters. A Book Two-style
# English description of the rule returns null there and would tag no sentence
# at all, and the levelling pipeline is what the reading library is built on --
# so a pattern that cannot be tagged is a pattern the library cannot find text
# for.
#
# This chapter fares better than the passive chapter did on that front, because
# six of its seven connectives have a single fixed surface. ～うちに, ～際に,
# ～たとたん, ～途中で and ～以来 are the strings themselves, and the noise they
# pick up is small and namable rather than pervasive: ～以来 will not flag
# anything else, ～途中で will not either, ～際に catches nothing lexicalised
# (実際に is 実際 plus に and would have to be screened, and that is the whole
# list). Two are worth flagging honestly:
#
#   ～間に flags 間に合う, make it in time, which shares the two characters and
#   none of the grammar. The corpus has around ninety raw 間に hits and only
#   about sixteen are this pattern; the rest are 間に合う or the spatial
#   "between" sense the learner already owns. A future screen on 間に合 would
#   fix most of it.
#
#   ～かける is the coarse one, and there is no way to sharpen it without
#   losing real hits. It flags 出かける, 話しかける, 追いかける, 呼びかける and
#   every other lexicalised compound built on the same verb -- which are, per
#   JMdict, the same headword (1207610) under different senses, so no lexical
#   test separates them either. Eleven of the corpus's かけ hits are this
#   auxiliary and several dozen are not.
#
# This is a pipeline-design question, flagged here rather than solved.
#
# Five of the seven blank the connective together with what attaches to it, and
# that is the point rather than an oversight. うちに is blanked as ならないうちに
# because the negative is the shape a learner will not produce on their own and
# the bare うちに is not what the lesson is about; 際は is blanked as かじのさいは
# because noun + の is half the teaching; とたん as きいたとたんに because the
# plain past in front of it is the rule; 途中で as いくとちゅうで and 以来 as
# しんでいらい for the same reason in each case. 間 is the exception: the blank is
# あいだに and nothing else, because に against no-に is the entire lesson and
# handing over the surrounding clause would give away which one it has to be.
#
# content-source: n/a for this file -- every pattern references an existing
#   phrase from phrases/b3-04-time.yaml rather than composing new Japanese, and
#   that file carries the Tatoeba id for each.
# jlpt-source: training -- the level marks the chapter this content sits in.
#   All seven connectives are canonically N3 grammar and are tagged as such.

- id: grammar.b3-uchini
  jlpt: N3
  pattern: "～うちに"
  gloss: While it is still true -- and it will not be for long. Attaches like 時 does, straight onto a plain verb or an い-adjective. Most often negative, 〜ないうちに, which is how Japanese says before X happens.
  phraseId: band4.we-set-up-our-tents-before-dark
  blank: ならないうちに

- id: grammar.b3-aida
  jlpt: N3
  pattern: "～間に"
  gloss: During a stretch of time. With に, the second thing happened at one point inside the stretch; without に, it lasted the whole of it. This is the 間 of vocab.aida doing a second job -- not the space between two things, a span of time.
  phraseId: band4.the-tub-ran-over-while-she-was-on-the-phone
  blank: あいだに

- id: grammar.b3-sai
  jlpt: N3
  pattern: "～際に"
  gloss: When, in the formal register -- signs, manuals, announcements, rules. Same attachment as 時 -- plain verb direct, noun with の. 際は rather than 際に when the clause sets up a case.
  phraseId: band4.in-the-case-of-fire-dial-119
  blank: かじのさいは

- id: grammar.b3-totan
  jlpt: N3
  pattern: "～たとたん"
  gloss: The instant one thing happened, another did. Takes a plain past verb and nothing else -- no non-past, no adjective, no noun. The second half is usually something nobody saw coming. Written 途端 as well as とたん.
  phraseId: band4.she-turned-pale-the-moment-she-heard-the-news
  blank: きいたとたんに

- id: grammar.b3-tochu
  jlpt: N3
  pattern: "～途中で"
  gloss: Partway through something not yet finished -- a journey or a task. Plain verb direct, noun with の, or standing alone. Not a moment on a clock, but a place inside a process.
  phraseId: band4.i-met-tom-on-my-way-to-school
  blank: いくとちゅうで

- id: grammar.b3-irai
  jlpt: N3
  pattern: "～以来"
  gloss: Ever since a point in the past, and still. Straight onto a noun with no particle, or onto a te-form verb. The starting point has to be over already, and what follows has to still hold.
  phraseId: band4.he-took-to-drinking-after-his-wife-died
  blank: しんでいらい

- id: grammar.b3-kakeru
  jlpt: N3
  pattern: "～かける"
  gloss: Started and not finished, or on the point of starting. An auxiliary on a verb's ます-stem, not a noun -- 言いかける, 死にかける. Conjugates as an ichidan verb, and freezes into a noun as 〜かけ.
  phraseId: band4.the-man-was-on-the-brink-of-death
  blank: しにかけていた
