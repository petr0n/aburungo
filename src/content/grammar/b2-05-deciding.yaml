# Book Two, Chapter 5 grammar patterns — wanting, planning, proposing.
#
# One pattern per teaching lesson, each blanking the ending itself out of a
# sentence from that lesson. The blank is matched against the phrase's reading,
# so these are kana.
#
# Three of the eight sit on the polite stem (たい, ましょう, ませんか) and two on
# the plain non-past (つもり), which is why the order below is not the order a
# grammar book would use: it follows what a learner can say next, not what
# attaches to what.
#
# The question pattern blanks なにが rather than the ending, because the move it
# teaches is the question word and its particle, not the たい that was already
# taught two patterns earlier.
#
# content-source: n/a for this file — every pattern references an existing
#   phrase from phrases/b2-05-deciding.yaml rather than composing new Japanese.
# jlpt-source: training — the level marks the band this chapter sits in.

- id: grammar.b2-tai
  jlpt: N4
  pattern: "ます-stem + たい"
  gloss: Want to do it. Drop ます, add たい, and the whole thing behaves like an i-adjective.
  phraseId: want.i-want-to-go-to-japan
  blank: いきたい

- id: grammar.b2-tai-negative-past
  jlpt: N4
  pattern: "たくない / たかった"
  gloss: Don't want to, and wanted to — the かった rule you already have from 高かった.
  phraseId: want.i-dont-want-to-eat-anything-today
  blank: たべたくない

- id: grammar.b2-hoshii
  jlpt: N4
  pattern: "noun + がほしい"
  gloss: Want a thing, not an action. ほしくない, ほしかった — an i-adjective like any other.
  phraseId: want.i-want-a-new-car
  blank: ほしい

- id: grammar.b2-asking-what-you-want
  jlpt: N4
  pattern: "何が + たい / ほしい + か"
  gloss: Asking what someone wants — the only safe way to talk about another person's wants.
  phraseId: want.what-do-you-want-to-eat
  blank: なにが

- id: grammar.b2-tsumori
  jlpt: N4
  pattern: "plain non-past + つもりです"
  gloss: What you have decided to do. A plan, not a want.
  phraseId: want.i-plan-to-go-to-japan-next-year
  blank: いくつもり

- id: grammar.b2-tsumori-changed
  jlpt: N4
  pattern: "つもりはない / つもりでした"
  gloss: No such plan, and a plan that was. つもり is a noun, so both come free.
  phraseId: want.i-have-no-plans-to-go-today
  blank: つもりはありません

- id: grammar.b2-mashou
  jlpt: N4
  pattern: "ます-stem + ましょう"
  gloss: Let's. You are proposing and expecting the other person to come along.
  phraseId: want.lets-go-together
  blank: いきましょう

- id: grammar.b2-masenka
  jlpt: N4
  pattern: "ます-stem + ませんか"
  gloss: Would you like to? The same proposal with the answer left open.
  phraseId: want.would-you-like-to-go-together
  blank: いきませんか
