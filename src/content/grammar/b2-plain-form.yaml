# Book Two, Chapter 1 grammar patterns — plain form and its three payoffs.
#
# One pattern per teaching lesson, each blanking the form itself out of a
# sentence from that lesson. The blank is matched against the phrase's reading,
# so these are kana.
#
# The four form patterns come first and are a single conjugation table taken a
# row at a time; the copula sits between them and the register lesson because
# that is where its dropping behaviour starts to matter; the last three are what
# the form buys -- experience, listing, and the negative request.
#
# content-source: n/a for this file — every pattern references an existing
#   phrase from phrases/b2-plain-form.yaml rather than composing new Japanese.
# jlpt-source: training — the level marks the band this chapter sits in.

- id: grammar.b2-plain-dictionary
  jlpt: N4
  pattern: "dictionary form = plain non-past"
  gloss: The form on every verb card is a tense — the casual twin of ます.
  phraseId: plain.i-drink-coffee-every-day
  blank: のむ

- id: grammar.b2-plain-nai-ichidan
  jlpt: N4
  pattern: "る → ない"
  gloss: An ichidan verb drops る and adds ない. する → しない, 来る → こない.
  phraseId: plain.im-not-going-out-today
  blank: でかけない

- id: grammar.b2-plain-nai-godan
  jlpt: N4
  pattern: "godan → あ row + ない"
  gloss: One rule for all eight endings — く→かない, む→まない. う→わない, and ある→ない.
  phraseId: plain.im-not-buying-anything-today
  blank: かわない

- id: grammar.b2-plain-nakatta
  jlpt: N4
  pattern: "ない → なかった"
  gloss: ない is an i-adjective, so the plain past is the かった rule you already have.
  phraseId: plain.i-didnt-eat-anything-yesterday
  blank: たべなかった

- id: grammar.b2-plain-ta
  jlpt: N4
  pattern: "て → た"
  gloss: The plain past is the te-form with て swapped for た, で for だ.
  phraseId: plain.i-read-a-book-last-night
  blank: よんだ

- id: grammar.b2-plain-da
  jlpt: N4
  pattern: "です → だ"
  gloss: The plain copula. だった, じゃない, じゃなかった — and never after an i-adjective.
  phraseId: plain.im-a-student
  blank: だ

- id: grammar.b2-plain-casual
  jlpt: N4
  pattern: "うん／ううん"
  gloss: The casual yes and no. A plain question drops か and rises instead.
  phraseId: plain.yes-got-it
  blank: うん

- id: grammar.b2-ta-koto-ga-aru
  jlpt: N4
  pattern: "～たことがある"
  gloss: Have ever done it — an experience, not an event that happened.
  phraseId: plain.have-you-ever-eaten-sushi
  blank: たべたこと

- id: grammar.b2-tari-tari
  jlpt: N4
  pattern: "～たり～たり + する"
  gloss: Some of the things you do, not all of them and not in order. It ends in する.
  phraseId: plain.on-sundays-i-read-and-listen-to-music
  blank: よんだり

- id: grammar.b2-nai-de-kudasai
  jlpt: N4
  pattern: "～ないでください"
  gloss: Please don't — the ない form in the slot where ～てください takes the te-form.
  phraseId: plain.please-dont-open-the-window
  blank: あけないで
