  grammarNote: "No new material. This is a live conversation with Hana across two of the situations you have already worked through — a cafe stop and then shopping on the same street, say — chosen from your own ladder. Nothing here has a single right answer and nothing is recorded or judged; the point is carrying one thread across a change of scene. Kanji listed above are review items carried over from earlier lessons, not new introductions."

- id: n5.unit-39
  order: 89
  situation: Integration & checkpoint
  title: Can-do checkpoint
  canDo: Handle every situation on the ladder unaided
  checkpoint: can-do
  wordIds: []
  phraseIds: []
  kanji: []
  grammarNote: "No new material. Pick a situation, play it through with Hana, and the conversation is read back afterwards to see whether it worked. Anything that lands is checked off for good; anything that does not simply stays on the list, with unlimited attempts and no record kept of how many you took. The list is drawn from the situations you have been taught, so it grows as the ladder does."
