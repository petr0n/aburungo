# N5 daily-loop lessons — consolidation checkpoint (after Greetings & Food & drink).
#
# One of the regular consolidation checkpoints. DR-021 replaced the "mid-way"
# checkpoint idea with a cadence: roughly every ten teaching lessons, snapped to
# the next situation boundary so a recognition checkpoint never splits a situation in half.
# A cadence survives the ladder changing length; a midpoint does not.
#
# RecognitionCheckpoint scopes itself to lessons ordered before this one, so this needs
# no per-lesson configuration — it covers everything taught so far and nothing
# the learner has not met.
#
# content-source: n/a — introduces no content, only re-presents taught items

