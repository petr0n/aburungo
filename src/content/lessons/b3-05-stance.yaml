  checkpoint: recognition
  grammarNote: "A wide pass over everything this chapter has taught. Type the reading or the meaning rather than picking it out of a line-up. Eight ways of marking how sure you are and how you found out, where Book Two had one. What is being checked is not whether you can recite which is which — it is whether the right one comes to hand for the sentence in front of you, which is the only form this knowledge is any use in. Two things are worth watching for as they come back. The first is the boundary rather than the gloss: given a speaker who saw something, one who was told it, and one who is describing what somebody is like, three different words are correct and they are not interchangeable. The second is attachment, which is where these differ most on the page — the の that ようだ needs and みたい does not, and the bare stem that に違いない and かもしれない both take where everything else wanted a copula. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, nothing is recorded."
