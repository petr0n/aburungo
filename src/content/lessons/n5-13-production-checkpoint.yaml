# N5 daily-loop lessons — the production checkpoint (Lesson 44).
#
# The gate that closes the level (DR-023). Every checkpoint before this one is a
# recognition checkpoint, and that can be cleared by recognition alone — picking the right
# card out of four. This one asks the learner to write each item from its
# English, which is the skill the ladder is actually for.
#
# It sits after the last recognition checkpoint so the level escalates rather than repeats:
# recognise everything (lesson 43), then produce it (lesson 44).
#
# This lesson is always present. The two Hana lessons that follow it are gated
# behind `hanaEnabled` and drop out of the ladder when it is off, so with the
# AI shelved this is the ending — see src/config.ts and DR-023.
#
# No new words, phrases or kanji. Behaviour comes from `checkpoint: production`,
# which LearnPage renders instead of the new-lesson flow.
#
# content-source: n/a — introduces no content, only re-presents taught items

- id: n5.checkpoint-production
  order: 58
  situation: Integration & checkpoint
  title: Write it from memory
  canDo: Produce the vocabulary and phrases from every situation, unprompted
  checkpoint: production
  wordIds: []
  phraseIds: []
  kanji: []
  grammarNote: "No new material. Everything so far has asked you to recognise Japanese; this asks you to produce it. You will see an English meaning and write the Japanese, drawn from across every situation you have worked through. Kana or romaji both count — this is about recall, not spelling. Anything you do not get comes straight back, and the checkpoint ends when there is nothing left to write. There is no score and nothing is recorded; whatever you miss simply returns to your review queue sooner."
