  kanji: []
  patternId: grammar.b4-zo-ze-wa
  grammarNote: "This lesson asks you to recognise, not to produce, and that is not squeamishness — it is that these three particles carry information about the speaker that a learner cannot control until they have heard a great deal of Japanese. You will meet them in the first hour of any film, any manga, any novel. Using them is a decision you should get to make later, on purpose. ぞ pushes a statement out hard. It goes to oneself — 今回はしくじれないぞ, I cannot mess this one up — or downward, to somebody the speaker outranks or is close to, and often it is an alert: watch out, here it comes. In this corpus it is used overwhelmingly by male speakers, and every description of contemporary Tokyo speech says the same thing. Read that as a strong tendency rather than a law: a form can be borrowed, and plenty of speakers borrow this one for effect. What is not a tendency is the direction. ぞ aimed upward, at anyone senior, is wrong in a way that has nothing to do with who is speaking. ぜ is ぞ's neighbour, softer, aimed at somebody the speaker is comfortable with rather than beneath them. さあ劇場に着いたぜ — right, here we are. It also dates a speaker: this corpus of twenty-six thousand sentences contains exactly three short ones ending in ぜ, and that scarcity is itself the finding. It belongs to a register you will read far more often than you will hear. わ is the interesting one, because it is two different particles wearing the same kana. In Tokyo speech, said with a rising tone, わ softens — it adds warmth to an offer or gentleness to an observation, and it reads as feminine and as somewhat dated, the speech of fiction and of older speakers more than of anyone under thirty. お返しに微積分のノートを貸してあげるわ and ほら、あなたの乗る電車が来たわ are both that わ. In Kansai and much of western Japan there is another わ entirely, said with a falling tone, which is a flat emphatic used by everybody regardless of sex and carries none of the Tokyo colouring. If you learn Japanese in Osaka you will meet the second one first and it will not mean what a Tokyo textbook told you. Two cautions about the evidence, since this lesson is built on it. These sentences come from one corpus, largely translated decades ago, with a taste for the theatrical — so わ is over-represented and ぜ survives mainly in period dialogue. And the endings do not come alone: 骨までしゃぶられちゃうぞ carries やつ for a person, a たら conditional, a passive and the ちゃう contraction, all of them casual, and the ぞ is the last brick rather than the whole wall. Register is a package. Reading the whole sentence, not the last syllable, is what actually tells you who is talking."

- id: b4.te-request
  order: 308
  chapterId: b4.band-3
  situation: How people actually talk
  title: Just do it, would you
  canDo: Ask for something the short way, and hear how short is too short
  wordIds:
    - vocab.tsukamaeru
    - vocab.terebi
    - vocab.ayamaru
    - vocab.kaeru-change
    - vocab.tisshu
    - vocab.mottekuru
    - vocab.tsukeru
  phraseIds:
    - b4band3.get-him
    - b4band3.please-turn-on-the-television
    - b4band3.bring-me-the-tissues
    - b4band3.ive-apologised-so-lay-off
    - b4band3.dont-keep-changing-what-you-say
  kanji: []
  patternId: grammar.b4-te-request
  grammarNote: "Take ください off 〜てください and the request still works. That is the whole form: a bare te-form, on its own, asking somebody to do something. テレビをつけて. ティッシュを持ってきて. そいつをつかまえて. Nothing has been added — something has been removed, and what it removes is the distance. Between family, between close friends, from an adult to a child, or in a moment with no time in it, this is what a request sounds like. To anyone outside that circle it is not casual, it is rude, and the difference is not softened by tone. It helps to see the whole ladder at once, from shortest to longest, because Japanese chooses along it constantly. て is bare. てよ is te-form plus the よ of lesson 2, and it presses — 謝ったんだから、さっきのはチャラにしてよ. That よ is the same one that tells you something you did not know, and pointed at a request it comes out as insistence, which is why てよ can sound petulant or childish where plain て does not. てくれる？ and てくれない？ come next: these are Book Two chapter 2's giving verbs turned into a question, and they are the everyday polite-but-casual middle of the ladder, the level most conversation between friends actually lives at. This chapter cards neither of them, because the corpus has no clean short example of either, and a described form with no card is the honest outcome rather than a composed one. Then てください, which you have had since Book One, and beyond it ていただけますか and its relatives, which the keigo chapters later in this book will teach. The negative side runs the same way. ないで on its own asks somebody not to do something — the same 〜ないで the first chapter of this book taught as an adverbial, doing a different job here. ないでくれ adds くれ, the plain imperative of くれる, and lands blunt: そんなにコロコロ、言う事を変えないでくれよ. In this corpus that form is male-coded, and like ぞ it is aimed sideways or downward, never up. Book Two's ないでください is the same request with the register put back in. Two details worth carrying. Rising intonation softens all of these — て said with the voice going up is a request, said flat it is closer to an instruction — and it is the cheapest politeness available in casual speech. And a bare て can also be a sentence that has simply stopped early, trailing off into an unspoken second half rather than asking for anything; when you are reading, the punctuation and the context are what tell you which, and this chapter had to leave one otherwise-good sentence uncarded for exactly that ambiguity."

- id: b4.checkpoint-3
  order: 309
  chapterId: b4.band-3
  situation: Integration & checkpoint
  title: Chapter 4 checkpoint
  canDo: Recognise everything this chapter taught
  wordIds: []
  phraseIds: []
  kanji: []
  checkpoint: recognition
  grammarNote: "A wide pass over the chapter, and this one is mostly about pairs, because almost everything here has a look-alike that means something else. Start with the two that cost the most. Dictionary form plus な is the previous chapter's prohibitive, telling somebody to stop; anything else plus な — past tense, だ, an adjective — is this chapter's musing な, telling nobody anything. 始めるな and 始めたな differ by one kana and by their entire meaning. The second pair is one string with two tunes: sentence-final じゃない falling is a flat denial, and rising is an invitation to agree. Nothing on the page separates them, so what comes back is the sentence around them — a correction and a complaint fall, a shared observation rises. Then the ones that sort by job rather than by shape. よ hands over something new; ね hands over something shared; よね does both and only in that order. かな wonders about the world; っけ reaches for something you already knew and mislaid, which is why it arrives as だっけ and たっけ and not as るっけ. なんて holds a whole idea at arm's length; なんか hedges the noun in front of it — and 何か, which sounds identical, is the ordinary word for something and is not related to either. とか leaves a list open; と closes it. Two things here are recognition only, and the checkpoint treats them that way. ぞ, ぜ and わ tell you about the speaker, and what is being asked is whether you can hear that — not whether you would say it. Same for かしら. Everything else in the chapter is yours to use. Some of what comes back will hinge on something small: a じゃ that turns out to be では between two nouns rather than a negative, a って standing in for は rather than for と, a なんか sitting before a negative and coming out as anything but. Those are the places worth slowing down. Type the reading or the meaning rather than picking it out of a line-up. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, and nothing is recorded."
