# Book Four, chapter 3 -- Why you're saying it.
#
# The stance chapter of the last book taught eight ways of marking how sure you
# are and how you found out, and it had to write around the two commonest words
# in the whole family. でしょう and だろう are not in it. そうだ is not in it --
# the file contains neither string anywhere, which was a deliberate deferral
# rather than an oversight, and this chapter is where the deferral is paid off.
# んです is the third of the three: it has never been taught anywhere, in any
# book, although のです has been sitting in three of the learner's own cards
# since the middle of the last one (走りさえすれば、どんな車でもよいのです,
# 肌が脂っぽいのです, and いつから日本人は精白米を食べるようになったのですか, the
# last of which is this chapter's asking-for-a-reason job in a card the learner
# met without being told what it was doing).
#
# So the chapter is a completion rather than a new department, and the notes
# below are written to be read against the stance chapter rather than beside
# it. でしょう takes its place on a line the stance chapter drew with a gap in
# the middle: かもしれない at the weak end, に違いない at the strong end, and
# nothing in between until now. Hearsay そうだ lands next to らしい and has to be
# told apart from it. Appearance そう lands next to みたい and ようだ and has to
# be told apart from those. Where the last book's chapter asked how do you know,
# this one asks what are you doing by saying it -- explaining, guessing,
# passing on, hedging, or stating what is simply the case.
#
# Six lessons, and the middle two are one string:
#
#    1  んです / のです / のだ    this is the explanation
#    2  でしょう / だろう          probably, and the tag that asks you to agree
#    3  clause + そうだ            I hear that
#    4  stem + そうだ              it looks like it
#    5  のではないか / んじゃない  I suspect, or how about, or don't
#    6  ものだ                     that is how it is, and that is how it was
#
# Lessons 3 and 4 are deliberately not merged. They are the same three kana and
# the difference is entirely in what stands in front -- a whole clause for the
# first, a bare stem for the second -- so the attachment is not a footnote to
# either lesson, it is the lesson, and one lesson teaching both would have to
# choose which of the two got the sentence at the top of the card. The
# checkpoint sets 降るそうだ against 降りそうだ for the same reason.
#
# Two things this chapter says as tendencies rather than rules, because they
# are tendencies and twenty-one content audits on this project have found the
# opposite habit -- a rule stated harder than it is true -- more often than any
# other fault:
#
#   だろう in speech reads blunt, and is often described as male; in writing it
#   is the neutral form and carries none of that. The lesson says so without
#   telling the learner never to say it.
#
#   君 and そいつ are marked familiar by JMdict, which adds sometimes considered
#   male language for the first and derogatory for the second when it points at
#   a person. Both notes are written as what the word tends to do to a room,
#   with the dictionary's own hedge kept in.
#
# The `kanji:` arrays are empty and stay that way -- this chapter's wiring pass
# owns the characters its new words bring, and none of the six patterns is
# written with a kanji in ordinary use. `wordIds` lists only the words this
# chapter teaches, which is the Book Four rule (docs/plans/book-four-bands.md
# section 2): the untaught content words of the sentences the lesson is already
# carding, not a review pull from earlier books.
#
# content-source: every phrase this file references is a verified Tatoeba pair,
#   cited by id in `tatoebaId` in phrases/b4-02-reason.yaml, and every word is a
#   JMdict-verified headword with its sequence number on its own entry in
#   vocabulary/b4-02-reason.yaml. No training-canonical sentence is used
#   anywhere in this chapter (04-stage-reading.md section 8).

- id: b4.ndesu
  order: 294
  chapterId: b4.band-2
  situation: "Why you're saying it"
  title: Because that's the reason
  canDo: Explain yourself, ask for someone's reason, or open a request the way Japanese does
  wordIds:
    - vocab.tariru
    - vocab.teniireru
    - vocab.shikata
    - vocab.ryuukou
    - vocab.saishin
  phraseIds:
    - b4band2.id-like-to-be-a-guitarist
    - b4band2.were-one-baton-short
    - b4band2.how-did-you-get-hold-of-that-money
    - b4band2.this-vending-machine-isnt-working
    - b4band2.id-like-you-to-tell-me-how-to-send-money
    - b4band2.id-like-a-hot-towel
    - b4band2.loose-jackets-are-the-latest-fad
  kanji: []
  patternId: grammar.b4-ndesu
  grammarNote: "You can already give a reason. Book Two taught から and ので, and both of them put the reason inside the sentence: this happened, because that. This lesson is a different move. It does not add a reason to a sentence — it marks a whole sentence as the reason for something that is already in the air between two people. That is why it is so hard to translate, and why leaving it out is one of the things that makes otherwise correct Japanese sound flat. Three jobs, and they are one idea seen from three sides. First, explaining. 私はギタリストになりたいんです is the answer to a question nobody asked out loud — somebody wonders why this person is here, or why they are asking about guitars, and this is the reason. リレー用のバトンが１本足りないんです is a problem handed over as an explanation of why the speaker is standing at your counter. Take the ん out of either and you get a flat announcement that sits there. Second, asking. 〜んですか asks for the story behind something the speaker can see. どうやってそのお金を手に入れたんですか is looking at money that is already on the table. Ask どうやって手に入れましたか instead and it is a neutral request for information, closer to a form than a conversation. Third, opening. 〜んですが hands over the situation and then stops — この自動販売機、動かないんですが. The rest of the sentence is missing on purpose, because finishing it would be pushier than Japanese wants to be, and this trailing が is one of the most useful things in the language for asking a stranger for anything. Attachment. A plain clause takes it directly, whatever tense it is in. A noun or a な-adjective takes な first: 最新の流行なのだ, not 流行のだ. That is the same な that ので takes, and the same な the last book's のに took, so the row is one you have filled in twice already. Four spellings, one word. んです is speech. のです is the unshortened form, more deliberate rather than more polite, since です is already carrying the politeness. のだ is what you meet in writing — an article, an essay, a textbook explaining itself. んだ is the casual spoken form, and this book's spoken-register chapter will do it properly. Last, a caution rather than a rule. Because it presupposes something shared, this ending sounds odd where there is nothing to explain — an out-of-the-blue 雨が降っているんです, said to somebody who has not asked and cannot see the window, invites them to wonder what they are supposed to make of it. It tends to be over-used by learners who read it as a softer です. It is not that; it is a claim that the sentence is an answer."

- id: b4.deshou
  order: 295
  chapterId: b4.band-2
  situation: "Why you're saying it"
  title: Probably
  canDo: Say what you think will happen, and check something you already believe
  wordIds:
    - vocab.kekka
    - vocab.honmono
    - vocab.inai
    - vocab.fukkatsu
    - vocab.seifu
    - vocab.kikan
  phraseIds:
    - b4band2.well-probably-get-there-within-an-hour
    - b4band2.this-is-probably-a-real-diamond
    - b4band2.miniskirts-will-probably-come-back-soon
    - b4band2.the-result-will-probably-be-the-same
    - b4band2.shes-with-a-government-bureau-isnt-she
    - b4band2.this-isnt-a-bad-deal-is-it
  kanji: []
  patternId: grammar.b4-deshou
  grammarNote: "The stance chapter drew a line from I am not sure to it has to be, and left a gap in the middle of it. かもしれない sat at the weak end: the speaker genuinely does not know. に違いない sat at the strong end: the speaker has weighed the evidence and committed. はず sat off to one side, reasoning from a schedule or an arrangement. The word that belongs in the middle of that line is the one this lesson teaches, and it is the commonest of the lot. でしょう is probably. １時間以内にそこに着くでしょう is an estimate, not a promise. Attachment repeats the exception you already met twice. A plain clause goes in front with nothing between — 着くでしょう, 復活するだろう. A noun or a な-adjective goes in bare, with no copula at all: これは本物のダイヤでしょう, not ダイヤだでしょう. That is exactly what に違いない and かもしれない do, so three patterns now share one habit and it is worth treating as the rule rather than as three exceptions. You have met this diamond, as it happens. The stance chapter carded これは本物のダイヤではないかもしれない, and the difference between that speaker and this one is the whole point of putting the two words on one line: one has not decided, the other has. Then the second job, which is not a guess at all. Said on a rising tone, でしょう asks the listener to confirm something the speaker already believes. 彼女は政府機関に勤めているのでしょう？ is not wondering; it is checking, the way English does it with isn't she. Notice the の in front — the previous lesson's explanatory の, stacking quite happily with this one. On a negative it does the same work: これは悪い話ではないでしょう？ invites you to agree that it is not bad, where the same shape in English can sound like doubt. On register, as a tendency rather than a rule. だろう is the plain form, and in speech it lands blunt — direct, assertive, and often described as male-sounding, though plenty of speakers use it and context does most of the work. In writing it is simply the neutral form and carries none of that, and the one sentence carding it below is a written prediction. でしょう is neutral in speech and is the one to reach for while you are still calibrating. Do not read だろう as the plain form you ought to be using because it is shorter. One neighbour worth naming so it does not confuse you: でしょうか, which is a softened question rather than either job in this lesson — the shop assistant's いかがでしょうか — and it turns up in this corpus more than fifty times. It is the same word doing something else."

- id: b4.souda-hearsay
  order: 296
  chapterId: b4.band-2
  situation: "Why you're saying it"
  title: I hear that
  canDo: Pass on something you were told
  wordIds:
    - vocab.kekkyoku
    - vocab.oji
    - vocab.shinbun
    - vocab.machi
    - vocab.honyaku
  phraseIds:
    - b4band2.i-hear-bill-will-go-to-medical-school
    - b4band2.i-hear-my-uncle-died-of-cancer
    - b4band2.they-say-mike-is-sick-in-bed
    - b4band2.that-translation-is-said-to-be-faithful
    - b4band2.according-to-the-papers-there-was-a-big-fire
  kanji: []
  patternId: grammar.b4-souda-hearsay
  grammarNote: "Put そうだ on the end of a plain clause and you have said I hear that, or they say that, or it is said that — and you have said nothing at all about whether you believe it. That is the point of it. The reporter marks the whole clause as somebody else's, and the speaker stays out of it. Attachment is the thing to get right, and it is generous: whatever plain form the clause already had goes in front unchanged. A dictionary verb, ビルは結局医大に行くそうだ. A ている, 寝こんでいるそうだ. A な-adjective with its copula still on it, 原文に忠実だそうだ — both だ present, and this is the cell that separates this lesson from the next one. A noun with the past copula, 癌だったそうです. Nothing is trimmed, nothing is added, and the ending itself does not inflect: there is no past hearsay そうだった and no negative そうじゃない. To report something in the past you put the past inside the clause, which is what 癌だったそうです does. The source can be named, and Japanese names it at the front. 新聞によれば、その町に大火があったそうだ — according to the papers. によると is the same fragment in its other spelling. A later chapter of this book gives によると and によれば a lesson of their own; for now, recognise them as the front half of a matched pair whose back half is this ending. によって, which you have from the passive and cause chapters, is a different marker and does not do this job. Now the two words it lives between. らしい, from the stance chapter, also reports something the speaker did not see. The difference is how much of the speaker is in it: そうだ passes on a statement more or less as received, while らしい filters it — the speaker has drawn a conclusion from what they heard, is holding it at arm's length, and might be inferring rather than quoting. Where そうだ is a report, らしい is an impression formed from one. There are sentences either would fit, and this is a difference of default rather than a wall. ようだ and みたい are further off still: those are the speaker's own inference from what is in front of them. And the warning that the next lesson is built on. These three kana carry a second, unrelated job, and the way to tell them apart is what stands in front. A complete clause in front — a dictionary form, a past, a copula — and it is this lesson. A bare stem in front, 降り or 簡単, and it is the next one, and it means something else entirely."

- id: b4.souda-appearance
  order: 297
  chapterId: b4.band-2
  situation: "Why you're saying it"
  title: It looks like
  canDo: Say how something looks about to turn out
  wordIds:
    - vocab.mondai
    - vocab.kantan
    - vocab.fuan
    - vocab.jitsuwa
    - vocab.mamonaku
    - vocab.atari
    - vocab.furu
  phraseIds:
    - b4band2.it-looks-like-rain-soon
    - b4band2.this-problem-looks-easy-but-isnt
    - b4band2.ill-take-this-tie-it-seems-the-best
    - b4band2.he-looked-around-uneasily
    - b4band2.he-looked-like-someone-you-could-get-along-with
  kanji: []
  patternId: grammar.b4-souda-appearance
  grammarNote: "Same three kana, different word. This one goes on a stem, not a clause, and it says how something looks right now or looks about to go. まもなく雨が降りそうだ is somebody looking at the sky. 降るそうだ, the dictionary form from the last lesson, is somebody who heard the forecast. One kana of difference, two different claims about where the speaker got it, and the sentence around it will not always rescue you — so learn the attachment as the meaning rather than as a spelling rule. What goes in front. A verb gives its ます-stem: 降る becomes 降り, then 降りそうだ. An い-adjective drops its い: 面白い gives 面白そう, 高い gives 高そう. A な-adjective gives its bare stem with the な gone: 簡単そうだ. Two irregulars have to be memorised because the regular rule would give you one kana and the language wants three: いい becomes よさそう, never いそう, and ない becomes なさそう. このネクタイにしましょう、一番よさそうだから is the one you will hear most. Once it has landed, そう behaves like a な-adjective and takes all the endings one takes. そうな in front of a noun: やっていけそうな人, the sort of man it looks like you could get along with. そうに in front of a verb: 不安そうにあたりを見回した, looked around in a way that appeared anxious. そうです politely, そうだった in the past. That flexibility is itself a test — hearsay そうだ never does any of this, so a そうな or a そうに is nearly always this lesson rather than the last one. Nearly, because そう is also an ordinary adverb meaning so, and どうしてそうなるのか carries the same three kana while belonging to neither lesson. Set against the stance chapter: みたい and ようだ are the speaker inferring what is the case from evidence, and they take a whole clause. This そう is narrower and more immediate — it reports the look of the thing, or that it is on the verge of happening, which is why 降りそうだ is about to rain rather than probably rains. One honest gap, and it is the place the neat test fails. たい makes an い-adjective, so its stem is た, and 食べたい plus そう gives 食べたそう — looks like he wants to eat. That is identical in writing to 食べた plus そうだ, which is I hear he ate. A past form in front is otherwise a reliable sign of hearsay, and this collision with たい is the exception; the previous chapter's たがる is what Japanese more often reaches for when reporting somebody else's wanting, which keeps the two apart in practice more than the shapes do."

- id: b4.nodewanaika
  order: 298
  chapterId: b4.band-2
  situation: "Why you're saying it"
  title: Isn't it, though?
  canDo: Put forward a view while leaving room to be wrong
  wordIds:
    - vocab.kyokutan
    - vocab.kimi
    - vocab.mizumashi
    - vocab.sonnani
    - vocab.pabu
    - vocab.usutaasoosu
  phraseIds:
    - b4band2.i-suspect-they-water-down-the-beer
    - b4band2.wouldnt-worcester-sauce-be-good
    - b4band2.isnt-what-youre-saying-a-bit-extreme
    - b4band2.i-didnt-order-this-table
    - b4band2.dont-eat-like-that
  kanji: []
  patternId: grammar.b4-nodewanaika
  grammarNote: "You have じゃない from Book Two's plain copula, and ではない from the written-voice chapter of the last book, where it was である's negative. Put の in front of it and add か, and the negative stops denying anything: のではないか is how Japanese puts a claim forward as a question it has already half answered. あのパブではビールを水増ししているのではないか is not a person who does not know. It is a person who thinks so and is leaving you room to say otherwise. English reaches for I suspect, or I wonder whether, or a rhetorical isn't it. That is the written form. In speech it contracts — の to ん, では to じゃ — and comes out as んじゃない or んじゃないか, and in that shape it picks up a second job. Said on a rising tone it is a suggestion: ウスターソースがいいんじゃない？ is offering an idea without pushing it, and いいんじゃない on its own is one of the most useful things in casual Japanese for approving of something mildly. Then the third job, and it is the one to be careful with, because it is the same string doing the opposite. After a dictionary verb, said falling, んじゃない is a prohibition. そんなにがつがつ食べるんじゃないよ is stop eating like that. It belongs with the blunt commands of the chapter just behind this one rather than with the suggestion above, and what tells you which you are hearing is the form in front — a dictionary verb — and the intonation, which writing does not record. It is carded here as the contrast rather than as something to produce. Two smaller shapes. Without the か, のではない denies a conclusion rather than a fact: このテーブルを頼んだのではない says the table is not what I asked for, where 頼まなかった would say I did not ask. The の is doing visible work there — it is what is being negated. And without the の, じゃないか is a challenge rather than a hedge: 君の言うことは極端じゃないか leaves the other person much less room than のではないか would. On 君: the dictionary marks it familiar and adds that it is sometimes taken as male speech, used towards someone of the same standing or below. Take that as a tendency — it is ordinary between friends and in song lyrics — but not a word for a shop, an office or anyone senior, where Japanese uses a name and さん instead of a word for you at all."

- id: b4.monoda
  order: 299
  chapterId: b4.band-2
  situation: "Why you're saying it"
  title: That's just how it is
  canDo: State a general truth, or recall how things used to be
  wordIds:
    - vocab.suitai
    - vocab.masutaa
    - vocab.soitsu
    - vocab.retorikku
    - vocab.iwayuru
  phraseIds:
    - b4band2.i-used-to-go-to-miami-every-summer
    - b4band2.english-cannot-be-mastered-overnight
    - b4band2.i-would-like-to-go-with-you
    - b4band2.thats-the-rhetoric-of-decline
    - b4band2.this-is-what-we-call-tempura
  kanji: []
  patternId: grammar.b4-monoda
  grammarNote: "もの is a thing, and by now you have filed two grammar patterns under it. The cause chapter taught ものだから, excusing yourself. The contrast chapter taught ものの, although in writing. This is the third and it is the plainest: a plain form, then ものだ, saying that what was described is in the nature of things rather than a fact about one occasion. Four jobs. First, the general truth. 英語というのは一朝一夕にマスターできるものではない is not about one learner's bad week — it says that English is not the kind of thing that gets mastered overnight. The negative ものではない is the half you meet in warnings and maxims, though it is much the rarer of the two in this corpus — ten lines against 167 for the pattern as a whole. Second, memory. A past verb plus ものだ is I used to: 夏はいつもマイアミに行ったものだ. ていた would report the same habit flatly; this adds that the speaker is looking back at it, which is why English reaches for used to rather than would go. Third, a wish, with たい in front: お伴したいものです, the sort of thing I would like to do — warmer and more formal than a plain 〜たいです. Fourth, というものだ, which names what something amounts to. そいつは衰退のレトリックというものだ is that is what you would call it, and これがいわゆる「天ぷら」というものです is the same shape introducing a thing by its name. The という in front is the reference chapter's naming marker, doing exactly what it did there. What is not this pattern: a noun plus の plus ものだ. 独自のものだ is that is hers, the ordinary noun もの with a possessive の in front, and in the sentence collection this chapter draws on fourteen of the ものだ lines are that rather than this. Check what is immediately in front: a の makes it the ordinary noun. A plain verb or adjective usually means this lesson, but not always — その劇は小説を改作したものだ is a relative clause on that same ordinary noun, so let the sense of the sentence settle it. One caution about register, and it is about what the pattern does to a room rather than about grammar. The general-truth use slides easily into prescription: the same shape that says this is how things are also says this is how one ought to behave, and older sentences using it that way — about how a young woman should sit, for instance — read now as a lecture from another era. The corpus has them and this chapter does not card them. Producing 〜ものだ about people rather than about things is worth doing carefully, if at all."

- id: b4.checkpoint-2
  order: 300
  chapterId: b4.band-2
  situation: Integration & checkpoint
  title: Chapter 3 checkpoint
  canDo: Recognise everything this chapter taught
  wordIds: []
  phraseIds: []
  kanji: []
  checkpoint: recognition
  grammarNote: "A wide pass over everything this chapter has taught. Type the reading or the meaning rather than picking it out of a line-up. Three of the pairs here are worth slowing down for, and they are the ones the chapter was built around. 降るそうだ against 降りそうだ: one clause, one stem, and the difference between what you were told and what you can see. でしょう against the stance chapter's かもしれない and に違いない: the same line from not sure to certain, with the middle of it now filled in. いいんじゃない？ against 食べるんじゃない: one string, a suggestion and a prohibition, sorted by what stands in front of it and by a tone of voice that writing does not record. Attachment is the other thing being checked, because it is where these differ most on the page — the な that んです needs after a noun, the bare noun that でしょう takes with no copula at all, and the だ that stays in place in 忠実だそうだ and disappears in 簡単そうだ. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, nothing is recorded."
