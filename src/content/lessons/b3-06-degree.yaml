  grammarNote: "A wide pass over everything this chapter has taught, and this is where the seven get set beside each other, since they were deliberately taught apart. Start with the pair that means \"only\". だけ states a limit and leaves your feelings out of it; ばかり states the same limit with an eye-roll, and then does a second job entirely when a plain past verb is in front of it — 受けたばかり is timing, not complaint. Then the pair that measures. くらい says two things are about level, or how far one thing goes, in an everyday voice. ほど does the same work more carefully, is the one that says A falls short of B when a negative follows it, and has a shape of its own in 〜ば〜ほど, where the word is said twice. Then the three refinements. どころか throws out the claim and replaces it, in either direction — far from X, or forget X, not even Y. に比べて names a comparison outright and is happy in a positive sentence, which ほど often is not. 反面 holds two facts about one subject and weighs them evenly, which is exactly what にもかかわらず and ものの do not do. Type the reading or the meaning rather than picking it out of a line-up. Some of what comes back will hinge on one small thing — whether the verb in front of ばかり is a te-form or a plain past, whether だけ is narrowing a set or opening one up, whether the くらい in a sentence is measuring anything at all or is 暗い written in kana. Those are the places worth slowing down. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, nothing is recorded."
