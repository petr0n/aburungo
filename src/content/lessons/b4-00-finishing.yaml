  kanji: []
  patternId: grammar.b4-mama
  grammarNote: "まま is a noun meaning a state that has not been changed, and the whole construction falls out of that once you see it. Something is in a certain state, and it stays in that state while something else goes on. The commonest shape is a past-tense verb in front. つけたまま, with it left switched on. 込めたまま, with it left loaded. 乗せたまま, with them still aboard. The た there is not saying the event was in the past; it is saying the state is already established by the time the rest of the sentence happens. That is why ヒーターをつけたまま外出した can be about tonight — the heater got switched on, and then, in that condition, out he went. A negative works the same way and takes the plain non-past ない, not なかった: 噛み合わないまま, with it still not meshing. So the state that persists can be a state of something not happening, which is what makes 話がまとまらないまま a useful thing to be able to say. It also goes after a noun with の — 昔のまま, as it was in the old days — and after a demonstrative, which is where そのまま comes from. そのまま is worth learning whole rather than assembled: as it is, leave it, just like that. You will meet it far more often than the grammar around it. Then the shape that connects this lesson to the second one in this chapter. ままにする is deliberately leaving something the way it is, and ままにしている is that this is your standing practice. Hold that against 〜ておく from lesson 2. Both leave a state in place. ておく leaves it in place for the sake of something coming; ままにする just does not change it, and often carries a shade of neglect — a door left open, a gun left loaded. When the sentence has a purpose in it, ておく; when it is simply untouched, ままにする. Two shapes to recognise and not to produce. あるがまま and なすがまま are literary — as things are, at the mercy of — and they belong to writing and to song lyrics rather than to speech. And まま turns up as a noun on its own in fixed phrases like 思うまま and 気の向くまま. Recognise them; you do not need to build them."

- id: b4.zu-ni
  order: 284
  chapterId: b4.band-0
  situation: Finishing what was started
  title: Without
  canDo: Say that something was done without doing something else
  wordIds:
