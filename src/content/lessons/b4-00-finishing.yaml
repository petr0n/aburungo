  phraseIds:
    - b4band0.you-cant-make-an-omelet-without-breaking-eggs
    - b4band0.riding-a-motorbike-without-a-helmet-is-dangerous
    - b4band0.the-students-listened-without-stirring
    - b4band0.he-sent-the-letter-back-unopened
    - b4band0.dont-use-all-the-hot-water
  kanji: []
  patternId: grammar.b4-zu-ni
  grammarNote: "Two ways to say without doing something, and one look-alike that is a different sentence altogether. Start with ずに. Take the ない form you have had since Book Two, drop the ない, and put ずに in its place. 割らない → 割らずに. かぶらない → かぶらずに. 食べない → 食べずに. Godan and ichidan verbs both follow it with nothing to remember. する is the one that does not, and this is the fact to carry out of the lesson: する gives せずに, from an older negative stem, and しずに is not a word. 勉強せずに, 何もせずに, 気にせずに, 身じろぎもせずに. Every noun+する verb inherits it, so it is 開封せずに and 用意せずに. 来る gives こずに, which is regular by the rule but worth hearing once. Then ないで, which says the same thing in a plainer voice. 開封しないで送り返した, sent it back without opening it. The difference between the two is register rather than meaning: ずに is the more written of the pair, ないで the more spoken, and either would be understood in either place. If you are choosing, ないで is the safer default in conversation and ずに is what you will read. Now the look-alike, and it matters because the string is identical. お湯を全部使わないで is not without doing anything; it is a request not to do something — Book Two's 〜ないでください with the ください dropped, which is ordinary and complete on its own. So 使わないで can be a request or the first half of a longer sentence, and what tells you which is whether a second verb follows. Nothing follows in お湯を全部使わないで, so it is asking you to stop. 開封しないで送り返した has 送り返した after it, so the ないで is adverbial and the sentence is about how the letter was sent back. Read to the end of the sentence before deciding. One more shape, named so it does not confuse you and not taught here. 〜ずにはいられない is a fixed emphatic meaning cannot help doing — 笑わずにはいられない, cannot help laughing. It contains ずに and it is not the adverbial; it is an idiom with its own meaning, and pulling it apart the way this lesson pulls apart 割らずに will not give you the sense of it."

