  grammarNote: "A wide pass over everything this chapter taught — eight endings and forty-two words, which is more vocabulary than any chapter of the last book carried. Type the reading or the meaning rather than picking it out of a line-up. Four pairs are worth slowing down for, because they are the ones where getting it wrong costs you a sentence rather than a word. てしまう's two readings, finished against wish-it-hadn't, decided by the sentence and not by the form. ていく against てくる on the same verb, where the whole difference is which direction the speaker is standing in. ずに against the ないで that is a request, where the string is the same and the giveaway is whether another verb follows. And すぎる, too much, against 〜に過ぎない, merely — which this book has not taught yet and will not test, but which is close enough in shape to be worth knowing is coming. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, nothing is recorded."
