# Band 0 -- Doing, and being done to.
#
# Book Two chapter 7 made a promise it could not keep on its own: と言われて
# います, taught for reading only, with a note in its own grammarNote that the
# form itself "is next book's material." This is that book, and this band pays
# the debt before anything else in Book Three is built, because によって --
# band 1's most formal "by" -- cannot mean what it usually means until a
# learner has met the passive it marks.
#
# The order follows Book Two's own rule-chapter precedent, not band 1's
# particle-by-particle shape, because this band is conjugation, not connective
# grammar. Formation comes first and is split in two, exactly the way the
# potential chapter split it, for exactly the same reason: ichidan/する/来る
# take one shape, godan verbs take a different one across eight endings, and
# the two shapes do not teach well in one lesson. The ichidan shape carries a
# debt of its own on the way in -- it is the same られる the potential chapter
# already built, and that chapter's own words are worth repeating rather than
# paraphrasing: "見られる can mean I was able to see it or it was seen by
# somebody. Context does the sorting." This band is where the sorting gets
# built, and lesson 1 quotes that sentence back rather than pretending the
# collision is news.
#
# Formation alone does not make a sentence. A third lesson teaches what changes
# around the verb once it goes passive -- the thing that was the object becomes
# the subject, and whoever did it, if named at all, takes に. A fourth lesson
# teaches the one passive English has no clean equivalent for: something
# happens to you, and the sentence says so whether or not you were ever the
# grammatical object of anything. 財布を盗まれた keeps を on the stolen wallet
# and makes the owner the subject; 雨に降られた has no object at all, because
# rain has nothing to take one. Reference grammars treat these as one
# construction -- the indirect or adversative passive -- because they are, and
# teaching them apart would manufacture a distinction the grammar does not
# make on top of being the thinnest material in the band by a wide margin.
#
# せる/させる earns one lesson, not two, and that is a real compression said out
# loud rather than left to look like an oversight: by this point a learner has
# done the row-shift move twice already -- potential in Book Two, passive twice
# over in lessons 1-2 here -- and the third telling needs far less room.
# Formation and the sentence it builds -- に for a causee taken from a
# transitive verb, を or に for one taken from an intransitive -- fit in one
# lesson because the scaffolding has already been paid for twice.
#
# させられる closes the causative side by combining the last two lessons
# literally. Colloquial speech contracts the godan half of it (待たせられる,
# made to wait, almost always surfaces as 待たされる), and that contraction is
# worth teaching directly rather than leaving a learner to meet it unglossed,
# but it comes with the band's sharpest trap: だまされる, 悩まされる, 励まされる
# and their kin look identical to a contraction and are not one -- they are the
# plain passive of a verb that was already causative-shaped before this lesson
# touched it. Getting this lesson wrong teaches a phantom derivation for real,
# common words, so lesson 6's grammarNote gives the strip-and-check test rather
# than only naming the danger.
#
# によって closes the band because it needed everything before it. Band 1's own
# によって lesson named this dependency and worked around it by refusing the
# sense that needed it; that lesson's two sentences about passive voice not
# existing in Books One and Two go stale the moment this band ships, and
# updating them is a two-line fix in a file this band does not own.
#
#    1  something was done to it, the easy half   ichidan／する／来る, and the
#                                                   collision with "can"
#    2  something was done to it, the rest         every godan ending, one rule
#    3  who did it, and who it happened to         に for the agent, が for the
#                                                   one it happened to
#    4  when it happens to you                     を stays, or there was no
#                                                   object to begin with
#    5  making someone, letting someone            せる／させる, both jobs
#    6  made to do it                              させられる, full and
#                                                    contracted, and its trap
#    7  by, this time for real                     によって as the agent band 1
#                                                    could not spend
#
# Lessons 3 and 4 stand on 1 and 2; lesson 6 stands on both 1-2 and 5; lesson 7
# stands on 1-3. This band does not split before its checkpoint for the same
# reason the te-form, plain-form and potential chapters didn't.
#
# The `kanji:` arrays are empty and should stay that way, and so is
# vocabulary/b3-00-passive.yaml. Every auxiliary this band teaches is kana with
# no kanji of its own, and the vocabulary in its example sentences belongs to
# the reading library and to mining, not to a curated list (04-stage-reading.md
# section 3). The `wordIds` below name words the learner already owns and whose
# passive or causative the lesson actually builds -- they are an SRS pull, not
# new teaching.
#
# Two things the attestation pass found that the breakdown did not:
#
#   来る has no citable passive in this corpus, and neither does any ichidan
#   verb in the *uncontracted* させられる form -- all twelve させられる hits are
#   suru-compounds. Both shapes are stated as rules in their grammarNotes and
#   carry no card, which is the honest outcome when the corpus has nothing to
#   quote. Nothing was composed to fill either gap.
#
#   The つ-row passive is attested only in sentences about people being shot.
#   打たれる and 撃たれる appear in the lesson 2 table and in no phrase card.
#
# One rule the grammarNotes below hold themselves to, stated once because it is
# stricter than Book Two's and a later editor will otherwise undo it by
# accident. A grammarNote here may show a conjugation chain (書く becoming
# 書かれる), a verb phrase (人を笑わせる), or a sentence that is a phrase card
# in this band or in Book Two, quoted whole. It may not show a Japanese
# sentence that is none of those. Several notes therefore describe a sentence
# in English -- the monument sentence, the sentence about a grandmother --
# where a draft would have composed a Japanese one or trimmed an attested one
# down to fit. That is the section 8 rule reaching into the prose, not only
# into the cards.
#
# content-source: every phrase this file references is a verified Tatoeba pair,
#   cited by id in `tatoebaId` in phrases/b3-00-passive.yaml. No
#   training-canonical sentence is used anywhere in this band
#   (04-stage-reading.md section 8).

- id: b3.passive-ichidan
  order: 196
  chapterId: b3.band-0
  situation: Doing, and being done to
  title: Something was done to it, the easy half
  canDo: Read and build a passive sentence for ichidan verbs, する and 来る, and tell it apart from what being able to already sounds like
  wordIds:
    - vocab.miru
    - vocab.taberu
    - vocab.suru
    - vocab.kuru
  phraseIds:
    - band0.he-was-seen-eating-the-cake
    - band0.i-cant-watch-videos-on-this-connection
    - band0.i-was-invited-to-their-wedding
    - band0.a-monument-was-erected
  kanji: []
  patternId: grammar.b3-passive-ichidan
  grammarNote: "The potential chapter left you a note and this is where it gets paid. Its own words: られる has another job this book has not taught yet, so 見られる can mean I was able to see it or it was seen by somebody. Context does the sorting. Here is the other job. Ichidan verbs are the easy half again, and the move is the one you already made — drop る, add られる. 見る → 見られる. 食べる → 食べられる. 育てる → 育てられる. 建てる → 建てられる. That is the same string you built for ability, character for character, and there is no rule anywhere that pulls them apart. A form that means two things is not a problem to be solved; it is a fact about the language, and what you are learning is how to read the sentence around it. する is irregular here too, and the irregularity is small: its passive is される, and every noun+する verb follows it — 招待する → 招待される, 発表する → 発表される, 掃除する → 掃除される. That family alone is most of the passives you will ever meet. 来る goes to 来られる, and the reading shifts the way it always does, こられる, never くられる, the same shift behind 来ない and the potential 来られます. Now the sorting, which is the actual lesson. A potential reading answers can I. A passive reading answers did this happen to me, or who did this. 彼はケーキをつまみ食いするのを見られた has an eater, a cake and somebody who caught him, and nothing in it could be about anyone's ability. この回線の細さじゃ、動画は見られないよ is a complaint about a slow connection, so it is about what is possible. The two verbs are identical. Everything around them is not. Three things tilt a sentence towards the passive and are worth watching for: a person marked に, which is the next lesson but one; a subject that is a thing rather than a person; and ている, where the sentence is describing the state something has been left in. Two more jobs of the same ending, named once so they do not ambush you and not taught here. られる is also honorific — a superior's 来る becomes 来られる out of respect, with no passive anywhere in it — and it is also spontaneous, the 思われる that means it seems to me, where nobody is doing the thinking on purpose. Both are real, both belong to a chapter about register that this chapter is not, and neither changes the shape you just learned. And what comes out is itself an ichidan verb, whatever went in, so everything you know about conjugating 食べる runs on 見られる unchanged: 見られます, 見られない, 見られました."

- id: b3.passive-godan
  order: 197
  chapterId: b3.band-0
  situation: Doing, and being done to
  title: Something was done to it, the rest
  canDo: Read and build a passive sentence for any verb
  wordIds:
    - vocab.kaku
    - vocab.oyogu
    - vocab.hanasu
    - vocab.matsu
    - vocab.shinu
    - vocab.yobu
    - vocab.yomu
    - vocab.kau
    - vocab.kaeru
    - vocab.tsukuru
    - vocab.tsukau
    - vocab.eigo
    - vocab.hana
  phraseIds:
    - band0.the-meeting-was-held-in-the-principals-office
    - band0.english-is-spoken-in-canada
    - band0.the-rose-is-called-the-queen-of-flowers
    - band0.when-will-the-party-be-held
    - band0.this-wine-is-made-from-grapes
  kanji: []
  patternId: grammar.b3-passive-godan
  grammarNote: "One rule covers every godan verb there is, and it is a move you have already made. Take the last sound to the あ row and add れる. 書く → 書かれる. 泳ぐ → 泳がれる. 話す → 話される. 待つ → 待たれる. 死ぬ → 死なれる. 呼ぶ → 呼ばれる. 読む → 読まれる. 買う → 買われる. 帰る → 帰られる. Nine endings, one move, and it is the same あ-row shift that gave you 書かない. う bends the same way it bent there — to わ, not to あ — so it is 買われる and 行われる, never 買あれる. Notice which rule the passive keeps company with: ない has that exception and the potential does not, and the passive sides with ない. Here is the good news the last lesson could not give you. For godan verbs the passive and the potential are different strings, and not by a little. Potential is the え row plus る. Passive is the あ row plus れる. 話せる against 話される. 読める against 読まれる. 呼べる against 呼ばれる. There is nothing to sort by context, because the forms sorted themselves. The exception is the one the te-form, plain-form and potential chapters have all already flagged, and it is exactly the same exception. 帰る, 走る, 作る, 送る, 叱る end in る and are godan, so they take the godan rule: 作られる is 作ら plus れる, built the godan way, even though the string is indistinguishable from what an ichidan verb would have produced. Ask which class the verb is, not what letter it ends in. What those verbs inherit is not the last lesson's ambiguity — 作れる is still potential and 作られる is still passive, two different strings — but the older trap: the finished string cannot tell you which class built it. One shape here you already own without knowing it. 言われる, from 言う, is the form Book Two taught you to read inside と言われています — この山は有名だと言われています, this mountain is said to be famous. You were told at the time that the form itself was next book's material and that you were not expected to build it. This is that lesson. It is yours now."

- id: b3.passive-sentence
  order: 198
  chapterId: b3.band-0
  situation: Doing, and being done to
  title: Who did it, and who it happened to
  canDo: Build a full passive sentence — say what happened to something, and who did it, if it matters
  wordIds:
    - vocab.ane
    - vocab.midori
  phraseIds:
    - band0.youll-get-told-off-by-mum
    - band0.she-is-loved-by-everybody
    - band0.he-was-brought-up-by-his-sister
    - band0.the-lake-is-surrounded-by-hills
  kanji: []
  patternId: grammar.b3-passive-sentence
  grammarNote: "Formation does not make a sentence. Here is what moves around the verb once it goes passive. Start from the active. Everybody loves her — in that sentence 彼女 is the object and would be marked を, and みんな is the subject and would be marked が. Put the verb in the passive and the two trade places. What was the object walks to the front and becomes the subject, marked は or が; whoever was doing it, if it is worth naming at all, takes に. 彼女はみんなに愛されている. を is gone, に has arrived, and the sentence has been turned end for end. You have watched a form rearrange a sentence like this once before, and it is worth calling a real parallel rather than a coincidence. The potential did it too — 英語を話します became 英語が話せます, を giving way to が. Both forms turn a sentence about doing into a sentence about a state, and in both cases the particle is the part a conjugation drill will never show you. Very often the agent is simply left out, and that is the passive doing its main job rather than an omission. The monument sentence two lessons back never says who built it, because nobody cares who built it; the wedding sentence never says who sent the invitation, because it is a sentence about being invited. If you catch yourself hunting for somebody to put in front of に, ask first whether the sentence wants one at all. And に does not need a person in it. 湖は緑の丘に囲まれている — the hills are what the sentence holds responsible, and hills intend nothing. で and から turn up in the same slot for causes and for sources — a flood that washed something away, a friend who walked out on somebody — but に is the one to reach for by default. Four lessons from here this same に gets a formal cousin, によって, doing exactly this job in exactly this slot. Learn に first. によって is a choice of register made on top of it, not a replacement for it."

- id: b3.passive-adversity
  order: 199
  chapterId: b3.band-0
  situation: Doing, and being done to
  title: When it happens to you
  canDo: Say that something happened to you — something taken, lost, or done around you — the way Japanese says it and English cannot
  wordIds:
    - vocab.saifu
    - vocab.kuruma
    - vocab.ame
    - vocab.shinu
    - vocab.watashi
  phraseIds:
    - band0.i-had-my-wallet-stolen
    - band0.he-had-his-car-stolen
    - band0.i-got-rained-on
    - band0.i-had-my-only-son-die
  kanji: []
  patternId: grammar.b3-passive-adversity
  grammarNote: "This is the passive English cannot copy, and that is the reason it gets a lesson rather than a footnote. It comes in two shapes and they are one construction. First, a verb that does have an object, where the object keeps を and the person it happened to becomes the subject. 私は更衣室で財布を盗まれた. The wallet is still marked を, because it is still the thing that was stolen; 私 is the subject, because the sentence is not about a wallet, it is about a loss. English cannot follow — it switches construction to I had my wallet stolen, and that had is doing work Japanese does with the passive alone. Second, a verb with no object at all. 雨に降られてぬれちゃったよ. Rain does not rain anything, so there is nothing for the passive to promote, and the sentence is passive anyway, because the rain happened to the speaker and was not welcome. English switches construction again, to I got rained on, and those two English sentences have nothing to do with each other. The two Japanese ones have everything to do with each other. That is why reference grammars call these one thing, the indirect or adversative passive, and why this lesson does the same. The subject is not who the verb was done to. The subject is who the event happened to, usually for the worse. 私はガンで一人息子に死なれた is the hardest and clearest case in the chapter: the son did nothing to the speaker, and the speaker is the subject regardless. The unwelcome part is not decoration, it is the meaning. This construction carries a complaint, which is why 死なれた reports a bereavement and 降られた is a grumble about the weather. Put a friend and 来る through it and you have not reported a visit, you have complained about one. If what happened was welcome, this is the wrong form and 〜てもらう is the right one, which you already have from Book Two. When you are reading, the fastest way in is to ask whose day this ruined. That person is the subject."

- id: b3.causative
  order: 200
  chapterId: b3.band-0
  situation: Doing, and being done to
  title: Making someone, letting someone
  canDo: Say that you made or let someone do something, and ask politely to be allowed to do something yourself
  wordIds:
    - vocab.matsu
    - vocab.heya
    - vocab.suru
    - vocab.yakusoku
    - vocab.hito
  phraseIds:
    - band0.he-had-the-maid-clean-the-room
    - band0.comedy-makes-people-laugh
    - band0.sorry-to-have-kept-you-waiting
    - band0.please-let-me-cancel-the-appointment
    - band0.may-i-share-this-table
  kanji: []
  patternId: grammar.b3-causative
  grammarNote: "Two lessons ago you moved a godan verb to the あ row and added れる. Do the same move and add せる instead, and you have the causative. 書く → 書かせる. 待つ → 待たせる. 読む → 読ませる. 笑う → 笑わせる, with the same う-to-わ bend, since this is the あ row and the あ row always bends it. Ichidan verbs drop る and add させる: 食べる → 食べさせる, 見る → 見させる. する → させる. 来る → 来させる, read こさせる. This is the third time you have made this shift, counting the potential in Book Two, so there is nothing new here except which auxiliary lands on the end of it. One form does two jobs and Japanese does not distinguish them. Making someone do something and letting someone do something are both せる and させる, and only the situation says which is meant. 彼は家政婦に部屋を掃除させた is making somebody work. The same ending, used of a baby left to cry, is letting. If you need to be unmistakably permissive, 〜させてあげる leans that way and the ordinary causative does not. The particle on the person is the real teaching point of this lesson. If the verb already has an object, the person made to act takes に and the object keeps its を — 家政婦に and 部屋を standing side by side in one sentence, no collision, because they are marked differently. If the verb has no object, the person usually takes を instead — 人を笑わせる, and the same for crying, waiting, going. に is possible there too and shades the sentence towards letting rather than making, so を is the safer default when you mean made. Then the shape you will actually use most, which is not about making anybody do anything at all. 〜させてください is how you ask to be allowed. キャンセルさせてください, let me cancel. One register up, 〜させていただきます and 〜させていただけますか, literally receiving the favour of being allowed, which is what you meet across a counter or in a work email — 相席させていただいてよろしいですか, may I share this table. It looks elaborate written out and it is completely ordinary to hear."

- id: b3.causative-passive
  order: 201
  chapterId: b3.band-0
  situation: Doing, and being done to
  title: Made to do it
  canDo: Say that you were made to do something, and recognise the colloquial contracted form when you meet it
  wordIds:
    - vocab.matsu
    - vocab.suru
  phraseIds:
    - band0.my-boss-made-me-work-overtime
    - band0.he-was-made-to-sign-the-contract
    - band0.he-kept-me-waiting-an-hour
    - band0.we-were-made-to-stand-in-line
  kanji: []
  patternId: grammar.b3-causative-passive
  grammarNote: "Take the causative you just built and put it in the passive. That is the entire form, and it reads left to right in the order the two things happened to you. 待つ → 待たせる → 待たせられる. 食べる → 食べさせる → 食べさせられる. する → させる → させられる. 残業させられた, I was made to work overtime. The person who made you takes に, exactly as an agent has done since the third lesson of this chapter — 上司に残業させられたんだよ. Now the part you have to know or you will not recognise this in speech. Godan verbs contract, with one exception. 待たせられる becomes 待たされる. 働かせられる becomes 働かされる. 並ばせられる becomes 並ばされる. That contraction is not sloppiness to be corrected — it is what people say, and 彼に１時間待たされた is the ordinary way to report an hour lost to somebody else. The exception is godan verbs that already end in す: 話させられる stays as it is, because the contraction would give 話さされる, which is not used. Ichidan verbs and する do not contract either; 食べさせられる stays exactly as it is. And here is the trap, which matters more than the rule does. だまされる, 悩まされる, 励まされる and 満たされる all look exactly like that contraction and none of them is it. Every one is the plain passive of a verb that ends in す — だます, 悩ます, 励ます, 満たす — and the string cannot tell you so, because 待たされる is built the same way, as the passive of 待たす. What tells you is what the す-verb means. 待たす means make somebody wait and nothing else, so its passive is being made to wait. だます means deceive, 悩ます trouble, 励ます encourage, 満たす fill — verbs in their own right, with nobody being made to do anything — so their passives are being deceived, troubled, encouraged, filled. Ask what the verb means before you assume. Guessing wrong here does not just lose you one sentence, it teaches you a derivation that does not exist, for words you will meet constantly. What this form means, nearly always, is that you did not want to. That is why the sentences you meet in this form are about overtime worked late and contracts signed under pressure. If you were glad about it, this is the wrong form."

- id: b3.niyotte-agent
  order: 202
  chapterId: b3.band-0
  situation: Doing, and being done to
  title: By, this time for real
  canDo: Say who or what did something, in the formal register
  wordIds:
    - vocab.ongaku
    - vocab.otouto
  phraseIds:
    - band0.this-music-was-composed-by-bach
    - band0.paper-was-invented-by-the-chinese
    - band0.the-team-is-led-by-tom
    - band0.my-brother-was-brought-up-by-our-grandmother
  kanji: []
  patternId: grammar.b3-niyotte-agent
  grammarNote: "によって is new, and this is its commonest job in written Japanese — naming who did it, in a passive sentence. It has two other jobs, means and variation, and the next chapter teaches both; you meet it here first because this is the job that needs the passive. この音楽はバッハによって作曲された. 紙は中国人によって発明された. The construction is a passive verb with によって in front of whoever is responsible, and it is the formal cousin of the に you learned four lessons ago. Both mark the same role in the same slot. によって is heavier and more written, and it turns up in three places especially: creation and invention, composed by and invented by and written by; discovery; and anything institutional or historical. により is the same word one register higher again. The sentence about a grandmother below uses it; put a plain に in its place and the sentence says exactly the same thing in a plainer voice. When に is enough, use に. Dropping によって into the sentence about being told off by Mum would not polish it, it would make it strange, in the way calling your mother your maternal parent is strange. Keep によって for sentences that were already formal before it arrived. One thing this lesson closes, and it is the reason it comes last. A passive sentence with によって in it has exactly one reading. No potential, no honorific, no spontaneous — because によって demands an agent and only the passive has an agent to give it. Of every shape in this chapter, it is the one you can trust on sight."

- id: b3.checkpoint-0
  order: 203
  chapterId: b3.band-0
  situation: Integration & checkpoint
  title: Chapter 1 checkpoint
  canDo: Recognise everything this chapter taught
  wordIds: []
  phraseIds: []
  kanji: []
  checkpoint: recognition
  grammarNote: "A wide pass over everything this chapter has taught. Type the reading or the meaning rather than picking it out of a line-up. One ending built two ways, one auxiliary stacked on another, and one formal marker for the person behind it all. What is being checked is not whether you can recite a table — it is whether the right reading comes to hand for the sentence in front of you. Some of what comes back is a られる sentence that could be about being able to or could be about something that happened, and the only way through it is to read the rest of the sentence. That is the skill this chapter exists to build, so it is the one worth checking. The を that stays put when a wallet is stolen is worth watching for, and so is the difference between a contraction and a verb that only looks like one. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, nothing is recorded."
