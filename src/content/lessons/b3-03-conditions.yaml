  grammarNote: "Nothing new, and everything at stake. Book Two closed its conditionals chapter by holding たら, と and ば apart from each other; this lesson puts 限り, さえ〜ば and たとえ〜ても on the same board and adds なら back, and asks you to place all seven. Six questions, in this order, and almost everything falls out of them. First: does the second half hold regardless of the first rather than because of it? Then none of the conditionals is right and the answer is たとえ〜ても. This is the only question in the list that takes a form out of the running by meaning rather than by rule, and it is first because getting it wrong turns a sentence inside out. Second: is the point that one thing on its own is enough? さえ〜ば. あなたはボタンを押しさえすればいい — the button is the whole of it. Third: does the second half last exactly as long as the first stays true? 限り. 命がある限りあなたのご恩は忘れません. Its negative, ない限り, is where English says unless. Fourth: is there a request, an invitation, a command or a decision in the second half? Then と is out, completely — it is the one form in this set with a rule that does not bend. ば is out too if its own clause is an action you chose to do, though not if the clause is an adjective, a noun with なら, or a verb of state, where a request after it is completely ordinary — 安ければ and 時間があれば both take one. 限り has no restriction of that kind at all — 汚さない限り、この本を持ち帰ってもいいですよ ends in permission. So the field here is たら and 限り, and 限り only when the first clause names something that keeps being true. Fifth: does the second half follow on its own, every time, with nobody deciding anything? と says that better than anything else. 押すと、開きます. Sixth: is this a general rule or a hypothesis rather than one dated occasion? ば. Leftovers go to たら, which is what made it the default. なら does a job none of the others do: it picks up the situation in front of you and answers it. あの政治家に会うつもりなら、袖の下を使わない限り駄目だね — if that is what you intend, then. Two conditionals in one sentence, and they are not competing; なら frames the case and ない限り states the condition inside it. And 次第 belongs on the board without being on the list, because it is not an if at all. 選択は全く君次第だ names what an outcome depends on rather than stating a condition for it, and 着き次第 fixes a moment rather than a case. If you catch yourself choosing between 次第 and たら you have almost certainly misread the sentence. One to reject on purpose, since a wrong form named is worth more than another right one. 世界最速の走者でさえ、空腹だったら走れない has both a さえ and a conditional in it, and the さえ is not part of one. It is the plain even — even the fastest runner — and たら is carrying the condition by itself. A learner who sees さえ and reaches for さえ〜ば will look for a ば that is not there and lose the sentence. Look for the ば, always."

