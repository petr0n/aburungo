  grammarNote: "A wide pass over everything this chapter has taught. Type the reading or the meaning rather than picking it out of a line-up. Four connectives, one of them doing two jobs and one of them a particle you had never met, and what is being checked is not whether you can recite a table — it is whether the right reading comes to hand for the sentence in front of you. Some of what comes back is a 限り that bounds a promise and some is a 限り that hedges a claim, and the only way through is to read the rest of the sentence. Same for 次第 against 次第に, and for a さえ with a ば after it against a さえ with nothing after it at all. Those are the collisions this chapter exists to sort out, so they are the ones worth checking. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, nothing is recorded."
