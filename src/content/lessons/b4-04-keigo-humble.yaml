  kanji: []
  patternId: grammar.b4-o-go-noun
  grammarNote: "Every lesson in this chapter has been using these two prefixes without stopping to explain them. お部屋, ご不自由, ご連絡, お礼, ご迷惑, お便り, ご提案. Here is the explanation, and it is a tendency rather than a law. お goes in front of words of native Japanese stock: お名前, お部屋, お金, お手紙, お花. ご goes in front of words built from Chinese roots — the ones written in two kanji and read with on-readings: ご連絡, ご案内, ご結婚, ご提案, ご迷惑. The tendency is strong enough to guess with and it has real exceptions, three of which this chapter cards: お電話, お返事 and お客様 are Sino-Japanese words -- 電話, 返事 and 客 are all read with on-readings -- that take お anyway, because they are so much a part of daily service language that the everyday prefix stuck to them. お食事 and お時間 are two more. When you are unsure, listening beats deducing. The prefixes do two different jobs and the same word can do either. On something belonging to the listener, the prefix raises it — お名前 is your name, ご住所 your address, and using them of your own name or address is wrong in the way that praising yourself is wrong. On something belonging to nobody in particular, it simply makes the word polite: お茶, お金, お手洗い. That second use is why some words have effectively swallowed the prefix — ご飯 is just rice, お腹 is just a stomach, and nobody hears politeness in them any more. The same happened to お礼 and お祝い and お悔やみ from lesson 3, which the dictionary lists with the prefix attached. Then 様, which does the same work at the far end of a word. お客様 is how staff address a customer — 客 with both the prefix and 様 — and 様 outranks さん by enough that it belongs to business letters and service, not to conversation between friends. 皆様 from lesson 4 is the same move on 皆さん. One card here previews the next chapter and its note says so. お客様、テーブルにライターをお忘れですよ uses お忘れです, which is お plus a stem plus です — and that raises the listener's action rather than lowering the speaker's. It looks like lesson 5's frame and does the opposite job. That contrast is the whole of the next chapter, and this is a good place to start feeling it."

