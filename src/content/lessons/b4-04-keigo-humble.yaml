# Chapter 5 -- Speaking with care.
#
# Books One and Two taught polite speech: です, ます, てください. Book Three
# taught the written voice -- である, ゆえに, において -- and the connectives
# that hold an argument together. This book's first four chapters taught how
# people talk when they are not being careful at all. What none of them taught
# is the layer above ます, the one an adult in Japan is judged on from the first
# week: keigo.
#
# A learner who has finished Book Three can read a newspaper paragraph and
# cannot write ご連絡いたします or answer a shop assistant. That is this chapter
# and the one after it.
#
# The split between them is the one every reference grammar makes, and it is
# also the order a foreigner's life makes. This chapter is the speaker's own
# side: lowering yourself, being formally polite, asking for things. That is
# what has to be produced first -- requests, apologies, email. The next chapter
# raises the listener, which mostly has to be understood rather than said.
#
#    1  there is, politely        ございます, でございます
#    2  we will do it, formally   いたす on a noun
#    3  saying it humbly          申し上げる, 申す
#    4  we are, we go, humbly     おります and 参ります
#    5  doing it for you          お + stem + する
#    6  could you possibly        ていただけますか
#    7  allow me to               させていただく
#    8  your name, your call      お and ご on a noun
#    9  chapter checkpoint        recognition
#
# The order is not arbitrary. ございます comes first because it is the one
# keigo verb the learner already says daily without knowing it, so the chapter
# opens by naming something owned rather than by adding something new. いたす
# follows because noun + いたします is the most productive frame in the set and
# needs no conjugation. 申し上げる and おる/参る are the two remaining verb
# swaps, and they come before お + stem + する because that frame builds on the
# verbs, not the other way round. ていただけますか sits at six because it is the
# thing a learner uses most and it wants いただく already met. させていただく
# needs both the causative and いただく. お and ご close the chapter because
# every earlier lesson has been quietly using them and the last lesson can
# collect the evidence instead of asserting a rule.
#
# WHAT THIS CHAPTER DOES NOT DO. It does not teach 尊敬語, the honorific half --
# いらっしゃる, なさる, お～になる, お～です. Three of the forty cards carry a
# piece of it (#217155's ご子息, #227316's お忘れです, #216999's お電話ください --
# お plus a noun plus ください is an honorific request frame) and each note says so
# and says it belongs to the next chapter. Mixing the two halves is the classic way
# to get keigo wrong, and keeping them in separate chapters is the cheapest
# defence available.
#
# ONE THING THE CORPUS COULD NOT ATTEST, recorded rather than filled in. The
# self-introduction 〜と申します -- the single most useful sentence in this
# chapter for anyone who works in Japan -- appears in the sentence source only
# inside #224154 こちらはスミスと申します。ジョンソンさんはおいででしょうか,
# which is two utterances and therefore out of scope. Lesson 3 describes the
# frame in English and cards 申します from #121768 instead. No sentence was
# composed to fill the hole.
#
# REGISTER STATEMENTS below name where they come from -- business letter,
# hotel, shop, telephone, in-flight announcement -- because that is the whole of
# what these sentences are evidence for. None of them says a form is required.
# Japanese has degrees of politeness and a speaker picks one; what these lessons
# assert as rules is direction, which is where the errors that matter live.
#
# content-source: every phrase this file references is a verified Tatoeba pair,
#   cited by id in `tatoebaId` in phrases/b4-04-keigo-humble.yaml. No
#   training-canonical sentence is used anywhere in this chapter
#   (04-stage-reading.md section 8).

- id: b4.gozaimasu
  order: 310
  chapterId: b4.band-4
  situation: Speaking with care
  title: There is, politely
  canDo: Recognise and use the polite copula and existence verb of shops, hotels and formal writing
  wordIds:
    - vocab.shurui
    - vocab.touten
    - vocab.moushiwake
    - vocab.kouei
    - vocab.fujiyuu
    - vocab.heya
    - vocab.taihen
  phraseIds:
    - b4band4.we-have-a-single-for-fifty-dollars
    - b4band4.we-have-a-wide-choice-of-books
    - b4band4.the-honour-is-more-than-i-deserve
    - b4band4.im-sorry-the-book-is-out-of-stock
    - b4band4.im-sorry-to-have-caused-you-inconvenience
  kanji: []
  patternId: grammar.b4-gozaimasu
  grammarNote: "You have been saying keigo since your first week. ありがとうございます, おはようございます — that ございます is a verb, and this lesson is what it is. Start there, because the cheapest way into a register is through the piece of it you already own. ございます stands where あります stands. 部屋があります becomes お部屋がございます, and the sentence has not changed shape: が still marks the thing that exists, the topic is still the topic, nothing has moved. What changed is who you sound like — a hotel, a shop, a company writing to a customer. 当店にはいろいろな種類の本がございます is a bookshop saying it has a wide choice; １泊５０ドルのシングルのお部屋がございます is a front desk quoting a room. Both would be perfectly correct with あります and would sound like a friend answering a question. でございます stands where です stands. それは身に余る光栄でございます is X は Y です underneath, with でございます in place of です. This is the copula you hear at a department store counter, in a formal speech, on a recorded announcement. There is no third thing to learn: ございます for existing, でございます for being. Then the negative, which is the form you will use most and the reason this lesson comes first. ございません is ございます negated, and 申し訳ございません is built on it: 申し訳, an excuse, plus ございません, there is none. Literally there is no excuse I could offer. It is the formal end of an apology ladder whose lower rungs you have had since Book One — ごめんなさい between friends, すみません for ordinary trouble, then 申し訳ありません, then 申し訳ございません, which is what a company says when it has genuinely cost you something. 大変ご不自由をおかけして申し訳ございません adds 大変 in front to weight it further. Two cautions, both about how far to take this. First, ございます is polite about the speaker's own side and about the world in general; it is not a way of praising the listener, and raising the listener is a different set of forms in the next chapter. Second, this is not a level you have to reach in ordinary conversation. あります and です are polite. ございます is the register of service and of formal writing, and using it with a friend is not more correct, it is odd. Recognise it everywhere, use it where the situation is the one these sentences come from."

- id: b4.itasu
  order: 311
  chapterId: b4.band-4
  situation: Speaking with care
  title: We will do it, formally
  canDo: Announce what you or your side will do, in business register
  wordIds:
    - vocab.renraku
    - vocab.shiten
    - vocab.waribiki
    - vocab.genkin
    - vocab.tenpu
    - vocab.tegami
  phraseIds:
    - b4band4.we-will-open-our-sapporo-branch
    - b4band4.we-give-a-ten-percent-discount-for-cash
    - b4band4.we-will-be-in-touch
    - b4band4.i-am-attaching-a-copy-of-my-letter
    - b4band4.small-bills-or-large
  kanji: []
  patternId: grammar.b4-itasu
  grammarNote: "する is the busiest verb in Japanese, so lowering it pays for itself immediately. いたす is that lowered verb, and いたします is what you actually meet. The rule is as simple as a rule gets: wherever a noun takes する, it can take いたします instead. 連絡する, to get in touch, becomes ご連絡いたします. 添付する becomes 添付いたします. 割引する becomes 割引いたします. 開設する becomes 開設いたします. Nothing else in the sentence moves — the particles, the objects, the word order are all untouched. What you are doing is telling somebody, in the voice of a business, what your side is going to do. Notice how often ご or お rides along on the noun. ご連絡いたします has both halves working at once: ご on 連絡, いたす in place of する. That is the standard shape of a business sign-off and it is worth learning as one string rather than as two moves. Not every noun takes the prefix — 添付いたします in the letter card has no ご on it — and which nouns do is a matter of custom, which is the last lesson of this chapter. There is a second use of いたす in these cards, and it is worth separating out. 小額の札にいたしますか is にする, choosing between things, one register up: にします becomes にいたします. A bank teller asks it twice in that sentence, once as a plain question and once as にいたしましょうか, the offering form. Anywhere you would say にします to choose between things, にいたします is the version somebody serving you would use. One more piece of furniture you already own. どういたしまして, which you have been answering thanks with since Book One, is this verb — literally what is it that I have done — frozen into a set phrase. You did not need to know that to use it and it costs nothing to notice now. Two warnings. いたす lowers your own side, so using it for what the other person does is wrong in a way that matters -- their actions take なさる, the honorific する, which is the next chapter's. And いたします belongs to notices, letters, telephone calls and counters. Between colleagues at the same desk, します is the ordinary word and いたします sounds like a form letter."

- id: b4.moushiageru
  order: 312
  chapterId: b4.band-4
  situation: Speaking with care
  title: Saying it humbly
  canDo: Thank, congratulate or offer condolences in the register of a letter or a speech
  wordIds:
    - vocab.orei
    - vocab.musuko
    - vocab.kekkon
    - vocab.oiwai
    - vocab.okuyami
    - vocab.shimekiri
  phraseIds:
    - b4band4.we-thank-you-for-your-patronage
    - b4band4.i-thank-you-on-behalf-of-my-son
    - b4band4.please-accept-my-sincerest-condolences
    - b4band4.congratulations-on-your-sons-marriage
    - b4band4.the-deadline-is-march-thirty-first
  kanji: []
  patternId: grammar.b4-moushiageru
  grammarNote: "言う has two lowered forms and they divide the work between them. 申す is the plainer one, 申し上げる the more formal, and the difference is roughly that 申す says something while 申し上げる says something up to somebody. Take 申し上げる first, because most of what you meet sits inside one frame rather than standing as a free verb -- though it does stand alone, as in 詳しく申し上げます. That frame is お or ご, then a noun, then 申し上げます. お礼申し上げます — thanks, offered upward. お祝い申し上げます — congratulations, offered upward. お悔やみ申し上げます — condolences. お祈り申し上げます — a wish for your health, which is how a business letter closes. These are the sentences said at a wedding, written in a condolence card, printed at the foot of a company notice, and they are worth owning whole rather than built from parts. を can sit between the noun and the verb: 日頃のご愛顧にお礼申し上げます has none and 息子に成り代わってお礼を申し上げます has one. Both are ordinary; the version without を is a shade more fixed and a shade more formal. Notice what else those two sentences do. ご愛顧 and ご子息 and ご結婚 raise something belonging to the listener — their custom, their son, their wedding — while お礼 and お祝い lower the speaker's own act of thanking. One sentence, both directions, and the direction is what makes them polite together rather than clashing. Raising the listener is the next chapter; here it is enough to see that the two halves coexist. Now 申す, which the chapter's sentences barely show and your life will show constantly. 念のためにもう一度申しますが is the one clean example there is — let me say it once more to be sure. The word matters far more than that single sentence suggests, because 〜と申します is how you give your own name in any formal setting: on the telephone, at a reception desk, at the start of a meeting. It is the humble twin of 〜と言います: where a friend hears です after your name, a client hears と申します. Learn the frame. The verified sentences this course draws on have no single-utterance example of it to put on a card, so this paragraph is the whole of what can honestly be shown you here. Set the two against Book One's plain 言う and と言いました and the shape of the system appears: one meaning, three heights, and you choose the height by who is listening."

- id: b4.orimasu
  order: 313
  chapterId: b4.band-4
  situation: Speaking with care
  title: We are, we go, humbly
  canDo: State your own side's situation and movements in service register
  wordIds:
    - vocab.kankei
    - vocab.yureru
    - vocab.minasama
    - vocab.meiwaku
    - vocab.tadaima
    - vocab.hayai
  phraseIds:
    - b4band4.we-are-experiencing-turbulence
    - b4band4.we-apologise-for-the-inconvenience
    - b4band4.the-crew-are-opening-the-doors
    - b4band4.i-will-be-with-you-right-away
    - b4band4.ill-come-as-soon-as-i-can
  kanji: []
  patternId: grammar.b4-orimasu
  grammarNote: "Two more verb swaps, and then the chapter has the whole humble set. おる is いる. That is the entire meaning: to be, to exist, of people. What makes it worth a lesson is the form it is almost always met in — ております, which is ています with おる underneath it. 揺れています becomes 揺れております. 待っています becomes お待ちしております, which also swaps in lesson 5's お～する frame on the way. The aspect does not change, the tense does not change, the meaning does not change; only the register moves. If you can build ています, and you have been building it since Book One, you can build every ております in this lesson by swapping four kana. Where you meet it tells you what it is for. ただ今気流の関係で揺れております is a cabin announcement. 皆様にご迷惑をおかけしております is an apology from a company to its customers. 乗務員がただいま出入り口を開けております is the airline talking about its own crew, and that last one carries the rule worth taking away: おる covers your own side, which includes your colleagues, your company and your family, not only you. What it does not do is describe the listener. いらっしゃる is the verb for that and it belongs to the next chapter. 参る is 行く and 来る, both of them, lowered into one verb. Which of the two a given sentence means is settled by who is moving towards whom: ただいま参ります from a waiter is coming to you, and 駅へ迎えに参ります is going to the station. Say 行きます to a friend and 参ります across a counter — the errand is identical and the listener is not. One honest complication. おります and 参ります are not only humble; they are also plain formality, which is why a station announcement says 電車が参ります about a train. A train has no side to be lowered. The form is doing politeness towards the listener rather than modesty about the speaker, and Japanese grammarians give that use its own name. You do not need the name. You need to notice that when the subject is a thing rather than a person, no humility is being claimed. Two more verbs in this family are worth recognising rather than producing. 承る is a humble 受ける and 聞く, met at a counter as 承っております, we are taking your order. 存じる is a humble 知る and 思う, and 存じております is I am aware. Neither is carded here; both will turn up in the first formal email you read."

- id: b4.o-suru
  order: 314
  chapterId: b4.band-4
  situation: Speaking with care
  title: Doing it for you
  canDo: Offer to do something, or ask to borrow something, in humble form
  wordIds:
    - vocab.yoroshii
    - vocab.otaku
    - vocab.tayori
    - vocab.tanoshimi
    - vocab.itsudemo
    - vocab.kariru
    - vocab.tetsudau
  phraseIds:
    - b4band4.may-i-use-this-word-processor
    - b4band4.may-i-borrow-this-book
    - b4band4.i-am-always-ready-to-help
    - b4band4.may-i-see-you-home
    - b4band4.i-look-forward-to-hearing-from-you
  kanji: []
  patternId: grammar.b4-o-suru
  grammarNote: "The verb swaps of the last three lessons only cover a handful of verbs. This lesson is the frame that lowers any of the rest. Take a verb's ます-stem — the part left when you remove ます — put お in front and する behind. 借ります gives 借り, so お借りする. 待ちます gives 待ち, so お待ちする. 送ります gives 送り, so お送りする. 手伝います gives 手伝い, so お手伝いする. いたす works in the same slot and lifts it one more step: お待ちいたします is politer than お待ちします. What the frame does is lower the speaker's own action while pointing it at the listener. That second half matters. お借りする is not merely a formal 借りる; it is borrowing from you. お送りする is seeing you home. There is no version of this frame for what the listener does — お + stem + になる does that job and raises them, and it is the next chapter's. Getting those two backwards is the most common keigo mistake there is, and the two look alike on the page. In requests it produces the polite way to ask permission. このワープロをお借りしていいですか is may I use this, with the borrowing lowered; この本をお借りしてもよろしいですか is the same request with よろしい, the polite いい, in place of いい. Book One's てもいいですか is underneath both, unchanged. In offers it wears Book Two's ましょうか: お宅までお送りしましょうか, shall I see you home. Nothing new is happening in the grammar — an offer is still an offer — and the politeness is entirely in the frame around it. Stack it with the last lesson and you get the sentence that ends most Japanese letters: お便り楽しみにお待ちしております. お待ちする, made ています, made ております. Three things this lesson can teach and one it cannot. Which verbs sound natural in this frame is not computable — it is habit, and the habitual ones are the verbs of service: 待つ, 送る, 借りる, 手伝う, 願う, 持つ, 知らせる. Verbs whose stem is a single mora -- 見る, 寝る, 着る -- do not normally go in it, and Japanese reaches for a different word instead. A noun that takes する uses a different shape again, with the prefix on the noun rather than on a stem: ご案内します. That last one is the last lesson of this chapter arriving early. One word you already say fits here exactly. お願いします is お plus the stem of 願う plus します — this frame, worn smooth by a century of use, sitting in your mouth since Book One."

- id: b4.te-itadakemasu
  order: 315
  chapterId: b4.band-4
  situation: Speaking with care
  title: Could you possibly
  canDo: Make a request one step above てください
  wordIds:
    - vocab.deeta
    - vocab.baggu
    - vocab.hitoban
    - vocab.tomeru-lodge
    - vocab.miseru
    - vocab.menyuu
    - vocab.ireru
    - vocab.nomimono
  phraseIds:
    - b4band4.could-you-update-this-data
    - b4band4.could-you-put-it-in-a-shopping-bag
    - b4band4.can-i-see-the-menu-again
    - b4band4.will-you-put-us-up-for-one-night
    - b4band4.may-i-have-something-to-drink
  kanji: []
  patternId: grammar.b4-te-itadakemasu-ka
  grammarNote: "This is the most useful thing in the chapter. Take it apart once and it stops looking difficult. いただく is もらう lowered — receiving, with the receiver made small. いただける is its potential, can receive. 〜ていただけますか therefore asks: could I receive the favour of your doing this? That indirection is exactly why it lands softer than てください, which is an instruction with a please attached. Any te-form goes in front of it. アップデートして, 入れて, 見せて, 泊めて. If you can build the te-form, and you have built it since Book One, the whole construction is one string bolted onto a verb you already have. Two variations do real work. ませんか in place of ますか — 泊めていただけませんか — asks the question negatively, which leaves the listener more room to decline; it is politer, and the same trick works in English. And 〜ていただきたいのですが trails off deliberately, I would like to receive..., which is softer still and is how a request is made when you are unsure whether it is reasonable. Watch who does what. In もう一度メニューを見せていただけますか, the listener does the showing and you receive the favour, so it is 見せて, not 見て. That mistake is easy to make and easy to hear: swap 見せて for 見て and you have asked them to look at something instead. See the ladder whole, because Japanese chooses along it in every conversation. て is bare and belongs to intimates — the previous chapter. てよ presses. てくれる or てくれない, from Book Two's giving and receiving chapter, are the everyday middle. てください you have had since Book One, and it is polite without being deferential. Above it sits てくださいますか, which raises the listener and is the next chapter's, and beside that ていただけますか, which lowers you. The two top rungs are equally polite by different routes, and the one on this card is the one a customer, a caller or a junior colleague reaches for. Finally, いただく on its own, with no te-form in front. 何か飲み物をいただけますか is receiving a thing rather than a favour: may I have something to drink. The same verb also means to eat and to drink humbly, which is why a meal in Japan opens with いただきます — the word you have said since Book One is this verb, in the form that says I humbly receive."

- id: b4.sasete-itadaku
  order: 316
  chapterId: b4.band-4
  situation: Speaking with care
  title: Allow me to
  canDo: Announce your own action as something the listener permits
  wordIds:
    - vocab.teian
    - vocab.shuusei
    - vocab.shusseki
    - vocab.torihiki
    - vocab.shitsurei
    - vocab.yorokobu
    - vocab.tsugou
    - vocab.yameru
  phraseIds:
    - b4band4.i-wish-to-resign
    - b4band4.i-will-amend-your-proposal
    - b4band4.we-would-love-to-work-with-you
    - b4band4.i-will-be-happy-to-attend-your-party
    - b4band4.i-would-like-to-meet-your-daughter
  kanji: []
  patternId: grammar.b4-sasete-itadaku
  grammarNote: "Book Three's causative said somebody makes or lets somebody do something. Put it in the te-form and hand it to the last lesson's いただく and you get させていただく: I receive the favour of being allowed to do it. In plain English, I will, with your leave. The build is mechanical. 出席する becomes 出席させる becomes 出席させて becomes 出席させていただきます. 修正する, 取引する, やめる all go the same way, and いただく takes its usual endings — いただきます for the plain announcement, いただきたい for the wish, いただきたいと思います for the wish hedged one step further. When does it fit? When the action genuinely touches the listener. 御提案を修正させていただきます is about to change something that belongs to them. お嬢さんに会わせていただきたい asks a parent for access to their daughter. あなたのパーティーに喜んで出席させていただきます accepts an invitation that was theirs to give. In each, permission is a real thing the listener holds, and framing the action as permitted is accurate rather than ornamental. 私この度一身上の都合でやめさせていただきます is the resignation formula, and it is worth noticing that the decision has already been made — the form announces it as permitted, which is what makes the announcement bearable. That is also where the form gets its bad name. Modern service Japanese has spread it far past that description: shops close 休業させていただきます, announcements 中止させていただきます, and every year somebody writes an article about how tiring it has become. Plenty of Japanese speakers find it overdone. This is not a rule you can be marked wrong on, and it is worth knowing that a sentence where the listener permits nothing at all can read as padding rather than politeness. Do not confuse it with two neighbours. 〜させてください, which Book Three taught, asks for permission — キャンセルさせてください, let me cancel. させていただきます does not ask; it states, with the asking implied. And 〜させていただけますか puts the last lesson's potential in, which turns it back into a real question and is about as deferential as ordinary Japanese gets. A word about how thin the evidence is. The verified sentences this course draws on hold eight short examples of this construction: five are on this lesson's cards, one already taught the causative in Book Three, and two could not be used -- one is a shout of ラスト・オーダーは締め切らせていただきました across a bar, whose entire English is the two words Last call. Eight is thin for a form you will hear several times a day in any Japanese shop, and that gap is worth naming rather than hiding."

