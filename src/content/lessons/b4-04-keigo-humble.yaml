  grammarNote: "A wide pass over the chapter, and it is mostly about pairs — because every form here has an everyday twin, and knowing keigo means knowing which one a situation wants. あります against ございます. します against いたします. 言います against 申します and 申し上げます. います against おります, and 行きます and 来ます against 参ります. てもらえますか against ていただけますか. In each pair the meaning is the same and only the listener has changed, so what comes back will hinge on hearing the situation rather than translating the words. Then the frames, which are where production actually lives. お plus a verb stem plus する lowers what you do — お待ちします, お借りします. Noun plus いたします does the same for する-verbs, usually with ご or お on the noun. お or ご plus a noun plus 申し上げます carries thanks, congratulations and condolences. させていただきます announces your own action as something the listener permits. ていただけますか asks for a favour by receiving it rather than requesting it. One direction, said once more because it is the thing that goes wrong: all of these lower your own side. Point them at the listener and the effect is the opposite of polite. The forms that raise the listener are the next chapter's, and two sentences here previewed them — ご子息 and お忘れです — so if those two feel unfinished, that is correct. Some of what comes back will turn on something small: a ご that is raising the listener's property against one that is only smoothing a noun, an おります describing a person against a 参ります describing a train, an いただく with a te-form in front of it against one with a noun. Those are the places worth slowing down. Type the reading or the meaning rather than picking it out of a line-up. Six of this chapter's sentences come back for recognition only, because their English cannot tell you which Japanese to build — the long ones and the formulaic ones. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, and nothing is recorded."
