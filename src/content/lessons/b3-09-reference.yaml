    - band9.the-importance-of-propaganda-in-politics
  kanji: []
  patternId: grammar.b3-niokeru
  grammarNote: "における is the odd one of the three, and the difference is not register. について and に関して both mark a topic for a verb — what the talking or writing is about. における does not do that at all. It sits between two nouns and joins them into a single noun phrase: この町における犯罪, crime in this town; 政治における宣伝活動, propaganda in politics; 人生におけるゴール, a goal in life. Nothing has been marked as a topic; a bigger noun has been built. Once you see that, the sentences fall out. この町における犯罪の発生率は高い is a sentence about a rate, and everything before は is one long noun. 君は人生におけるゴールを見失ってはいけない has を on the end of the phrase, and that を belongs to 見失う, not to における. 彼女は科学における性的偏見について書いた has both markers doing their own jobs in one sentence — における builds 科学における性的偏見, and について makes that whole phrase the topic of 書いた. Try to swap them and you do not get nonsense, you get a different sentence: 科学についての性的偏見 would be bias about science, which is not what she wrote about. The English preposition in covers all of this, which is why English gives no warning that a distinction exists. Register is real too. における is written Japanese — reports, papers, headlines, contracts — and in speech an ordinary で or の would carry the same idea: この町の犯罪, この町で起きる犯罪. Choosing における is choosing a document. It also stacks, which is the main reason writing likes it: 政治における宣伝活動の重要性 is three layers deep, and building that in speech would take a whole sentence. One more thing, for later. における has a cousin, において, which is the same word pointing at the predicate rather than at the next noun, and it comes up in the chapter after this one. You do not need it here — nothing in this lesson depends on it — and when you meet it, it is this word you will be recognising."

