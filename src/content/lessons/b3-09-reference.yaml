  grammarNote: "A wide pass over everything this chapter has taught, and the place where seven things taught one at a time get set beside each other. Two of them do the same job and are worth separating first. こと turns a clause into a noun that can be a subject, an object or a topic; ところ turns a clause into a point in time — before, during or just after. Neither has anything to do with the other beyond the shape of the move. What comes back most often is the boundary that costs the most to get wrong. とは after a bare noun defines a term. こと followed by は is a nominalised clause with the topic particle on it, and it is by far the more common of the two in real text — most of what looks like とは in a search is exactly that. If a sentence sets a word up and then explains it, that is とは; if it turns an action into a thing and then says something about it, that is こと plus は, the material of this chapter's own こと lesson rather than its とは lesson. The same test decides a second pair. という names what something is called and sits inside a sentence, or closes one as hearsay; Book Two's と言いました reports what somebody actually said and needs a sayer and a tensed verb of saying. If nobody is doing the saying, it is という. Then the three that all come out as about or in. について is the neutral default and marks a topic for a verb. に関して is the same job in a formal document, and turns into に関する in front of a noun. における is not the same job at all — it joins two nouns into one phrase, and the giveaway is that a noun follows it directly rather than a verb coming later to be about something. Some of what comes back will hinge on one small thing: a non-past verb in front of ことがある rather than a past one, which changes it from an experience into a tendency; a ところ that turns out to be ところが and a different grammatical category; a について that turns out to be the verb 付く. Those are the places worth slowing down. Type the reading or the meaning rather than picking it out of a line-up. Anything you miss comes back sooner. It finishes when the remaining set empties; retry as often as you like, nothing is recorded."
