  kanji: []
  grammarNote: "You have beaten たら against と, and たら against ば, one pair at a time. Holding all three at once is a different job, and this is where the chapter asks for it. Three questions, in this order, settle almost everything. First: is there a request, an invitation, a command or a decision in the second half? Then と is out completely, and ば is out too if the first half is an action verb you chose to do. たら. Second: does the second half follow on its own, every time, with nobody deciding anything? と says that better than either of the others. この道を右に曲がると、銀行があります — the bank is where it is whatever you intend. Third: is this a general rule or a hypothesis rather than one particular occasion? ば. ゆっくり話せば、わかります is about speech in general, not about this afternoon. Anything the three questions leave over is たら, which is why 仕事が終わったら、すぐ帰ります takes it: today's plan, one occasion, a decision. Now one to reject on purpose, since seeing a wrong form named is worth more than another right one. 頭が痛かったら、病院に行ったほうがいいです is the natural sentence. 頭が痛いと、病院に行ったほうがいいです is not — と cannot be followed by a suggestion, and ほうがいい is a suggestion, so the と version fails on the hard restriction rather than on style. Note what is not wrong: 頭が痛ければ is perfectly acceptable, because 痛い is an adjective, not a chosen action, and the ば restriction does not reach it. Three forms, and only one of them — と — has a rule that never bends."

