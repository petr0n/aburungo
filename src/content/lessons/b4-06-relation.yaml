# Chapter 7 -- In relation to what.
#
# Book Three gave the learner the connectives of cause, contrast, condition and
# time. What it did not give is the family of compound particles that written
# and formal Japanese uses to say what something stands in relation to:
# towards, for, as, with, through, on top of, on the basis of, according to.
# They share one shape -- a noun with a two- or three-part marker after it --
# and they are what a newspaper sentence is made of.
#
#    1  towards, against, in return for  に対して
#    2  for someone, from their side     にとって
#    3  in the role of                   として
#    4  as one changes, so does another  につれて
#    5  together with                    とともに / と共に
#    6  through                          を通して
#    7  on top of, on the basis of       に加えて, に基づいて
#    8  precisely this, and who says so  こそ, によると / によれば
#    9  chapter checkpoint               recognition
#
# The order is the corpus's as much as the grammar's. に対して and にとって come
# first and stand next to each other because they are the pair a learner
# confuses -- English renders both as against, for or to -- and because both are
# richly attested. として follows because it is the simplest of the family. The
# two change-with-change markers, につれて and とともに, sit side by side for the
# same reason as the first pair. を通して, に加えて and に基づいて close the
# teaching because their corpus is thinnest, and こそ is put with によれば
# because neither fills a lesson alone.
#
# WHAT THE LEARNER ALREADY HAS AND THIS CHAPTER DOES NOT REPEAT. Book Three's
# chapter 10 taught について, に関して and における, which are the same family:
# this chapter is the remainder, not a fresh start. によって is taught twice
# already -- as the passive agent in Book Three's chapter 1, and as means and
# variation in its chapter 2 -- so lesson 8 sets によれば against it rather than
# introducing it, and the checkpoint weights that pair. This book's chapter 3
# taught the hearsay そうだ and told the learner in as many words that a later
# chapter would give によると and によれば a lesson of their own. This is it.
#
# TWO CELLS ARE STATED AND NOT CARDED, and the lessons say so where the learner
# would otherwise wonder. を通じて, the written twin of を通して, has three
# verified sentences in the whole corpus: one clinical, two far past the length
# this book cards, so lesson 6 teaches it in prose and cards its twin. に対して
# in its contrastive job -- where English says whereas -- has one verified
# sentence at seventy-six characters, so lesson 1 states the job and does not
# card it. No sentence was composed to fill either gap; the reasoning is in
# phrases/b4-06-relation.yaml.
#
# THE VOCABULARY RUNS HIGH -- fifty words against chapter 6's thirty-one -- and
# that is the register rather than a decision. These markers live in writing
# about economies, societies, science and the weather report, and the sentences
# that attest them carry the words that go with those subjects.
#
# content-source: every phrase this file references is a verified Tatoeba pair,
#   cited by id in `tatoebaId` in phrases/b4-06-relation.yaml. No
#   training-canonical sentence is used anywhere in this chapter
#   (04-stage-reading.md section 8).

- id: b4.ni-taishite
  order: 327
  chapterId: b4.band-6
  situation: In relation to
  title: Towards, against, in return for
  canDo: Say what an action, an attitude or a reaction is directed at
  wordIds:
    - vocab.hankan
    - vocab.taido
    - vocab.jinsei
    - vocab.tsuuka
    - vocab.shuukan
    - vocab.harau
    - vocab.nibui
  phraseIds:
    - b4band6.antipathy-towards-the-speaker
    - b4band6.a-negative-attitude-to-life
    - b4band6.currencies-weakened-against-the-dollar
    - b4band6.no-custom-of-tipping-in-japan
    - b4band6.soles-insensitive-to-heat-and-cold
  kanji:
    - 感
    - 態
    - 通
    - 貨
    - 慣
    - 払
    - 鈍
  patternId: grammar.b4-ni-taishite
  grammarNote: "Everything in this chapter has the same shape: a noun, then a marker of two or three parts, and the marker says how the rest of the sentence stands in relation to that noun. You have four of them already — について and に関して for what something is about, における for where, によって for who did it or by what means — and this chapter is the rest of the family. に対して is the first because it is the commonest and because it is half of the pair that trips people. Put it on a noun and it marks what something is aimed at. Three jobs come out of that one idea. A target: 話し手に対して反感を持った, antipathy aimed at the speaker; 動物に対して, towards animals; 親に対して, towards one's parents. An opposition or a comparison: 欧州通貨はドルに対して弱くなった, one currency measured against another, and the same marker does a war declared against a country and a suit filed against a person. And something given in return: サービスに対してチップ, a tip in return for service; a fee in return for work; a prize in return for cooperation. Nothing in the marker tells you which of the three you are looking at. The noun in front and the verb behind do. In writing it often drops the て — に対し — and in front of a noun it becomes に対する: 戦争は人類に対する犯罪だ, war is a crime against humanity. Both are the same word in a more formal coat. Now the direction, because this is the rule that holds and the reason the next lesson exists. に対して marks the thing an attitude, action or reaction is pointed at. It does not mark whose point of view the sentence is taking. English blurs that line — the evidence was against him could be either — and Japanese does not: point something at somebody and it is に対して; judge something from where somebody stands and it is にとって, which is the next lesson. There is a fourth job you should recognise without producing. With a clause in front rather than a noun, に対して means whereas: one thing is so, whereas another is otherwise. It belongs to comparative writing — an essay contrasting two countries or two decades — and the verified sentences this course draws on contain exactly one example of it, four times longer than anything worth carding. So take it as reading knowledge: if に対して sits after a whole clause rather than a noun, read it as whereas rather than as towards. One caution about how much weight to put on any of this. These sentences come from writing about currencies, customs and attitudes, which is where this marker lives. In an ordinary spoken sentence a plain に often does the same work, and に対して adds formality and a little more weight on the aiming."

- id: b4.ni-totte
  order: 328
  chapterId: b4.band-6
  situation: In relation to
  title: For someone, from their side
  canDo: Say how something stands from a particular person's or group's point of view
  wordIds:
    - vocab.daiji
    - vocab.shouko
    - vocab.furi
    - vocab.futsuu
    - vocab.shakai
    - vocab.karera
  phraseIds:
    - b4band6.he-is-precious-to-us
    - b4band6.the-evidence-was-against-him
    - b4band6.poor-eyesight-handicaps-a-sportsman
    - b4band6.sunday-is-no-ordinary-day-to-me
    - b4band6.a-danger-to-society
  kanji:
    - 証
    - 拠
    - 普
    - 彼
  patternId: grammar.b4-ni-totte
  grammarNote: "にとって sets up a vantage point. Put it on a person, a group, a company or a country, and everything after it is being judged from there: 私にとって, as far as I am concerned; 社会にとって, from society's point of view; スポーツマンにとって, for an athlete. English usually says for or to, which is why the marker is easy to lose in translation and hard to place when producing. What follows it is almost always an evaluation. Look at the five sentences in this lesson: 大事, 不利, 不利, 普通の日ではない, 危険人物. Something is important, disadvantageous, ordinary or dangerous — and always for somebody. That tendency is strong enough to use as a signal when you meet a sentence cold: if the words after にとって are judging rather than describing an event, you have read it right. It is not an absolute rule, but it is a reliable expectation. Now the pair. に対して from the last lesson and にとって from this one both land on English against, for and to, and choosing between them is the one thing this chapter really has to teach. この証拠は彼にとって不利だった is the evidence being disadvantageous from where he stands. If it were 彼に対して, the evidence would be something aimed at him — a different claim, and in a courtroom a materially different one. The test is a question: is the noun being pointed at, or being stood on? Pointed at is に対して. Stood on is にとって. There is one more thing にとって does not do, worth saying because it saves an error. It does not mark the doer of anything: if he did the work, he is 彼が, and putting にとって on him would say the work was somehow being judged from his side instead. にとって introduces a standpoint, never an actor. And it takes は freely, にとっては, when the standpoint is being contrasted with somebody else's: from my point of view at least, whatever anyone else thinks. Two spellings and one register note. にとって is written in kana; dictionaries list it under the kanji spelling 取って and mark it as a word people write in kana, which is what you will meet. And unlike に対して, this one is at home in speech as well as in writing — 私にとって is something people say."

- id: b4.toshite
  order: 329
  chapterId: b4.band-6
  situation: In relation to
  title: In the role of
  canDo: Say in what capacity someone or something acts
  wordIds:
    - vocab.seikou
    - vocab.tsuuyaku
    - vocab.yatou
    - vocab.kashu
    - vocab.kyoushi
    - vocab.keiken
    - vocab.asai
  phraseIds:
    - b4band6.he-succeeded-as-an-entertainer
    - b4band6.he-hired-her-as-an-interpreter
    - b4band6.famous-as-a-soprano
    - b4band6.little-experience-as-a-teacher
    - b4band6.no-objection-on-my-part
  kanji:
    - 功
    - 雇
    - 師
    - 経
    - 浅
  patternId: grammar.b4-toshite
  grammarNote: "The simplest marker in the chapter and one of the most useful. Put として on a noun and it means in the capacity of, in the role of, as. 芸人として成功した, he succeeded as an entertainer — not as anything else, and the sentence says which hat he was wearing when he did it. 通訳として雇った is hired in the capacity of interpreter. ソプラノ歌手として有名だ is famous in that capacity. It works on things and places as readily as on people: a town famous as a summer resort, a room used as an office, a building designated as a shelter. Three shapes to have. Bare として is the base. Add の and it modifies a noun — 教師としての経験, experience as a teacher, in the same way that について becomes についての. Add は and it speaks for one's own side: 私としては, as far as I am concerned, which is the phrase a negotiator uses just before conceding something, and it works for an organisation as readily as for a person, giving a company's position as distinct from any individual's. Now the collision, and it is the reason this lesson needed screening rather than mining. として is spelled exactly like the ordinary particle と plus the te-form of する, and that combination is everywhere: かっとして, in a flash of temper; きちんとして, tidy; 依然として, still, as before; and this book's own 〜うとして, trying to. Nothing in the marker distinguishes them. What stands in front does. A plain noun gives you this lesson. A volitional — 盗もうとして, as in the sentence about being caught stealing jewellery — gives you the trying-to pattern from the chapter on intentions. An adverbial fragment gives you an adverb. Read backwards from として before you decide what it is. You will also meet としても, which looks like this pattern with も added and behaves as a different one; leave it for now. And one honest note about the evidence: this marker is the most frequent thing in the chapter by raw count, but most of what a search returns is と + して rather than the pattern, which is why the lesson carries five carefully chosen sentences rather than fifty."

- id: b4.ni-tsurete
  order: 330
  chapterId: b4.band-6
  situation: In relation to
  title: As one thing changes, so does another
  canDo: Tie two gradual changes together
  wordIds:
    - vocab.toshi
    - vocab.kibou
    - vocab.wareware
    - vocab.keiki
    - vocab.kaifuku
    - vocab.kawaru
  phraseIds:
    - b4band6.days-grow-shorter-as-winter-approaches
    - b4band6.business-improved-as-christmas-approached
    - b4band6.our-hopes-sank-as-time-went-on
    - b4band6.we-grow-forgetful-as-we-age
    - b4band6.the-artists-style-changes-with-age
  kanji:
    - 希
    - 我
    - 景
  patternId: grammar.b4-ni-tsurete
  grammarNote: "につれて ties two changes together: as the first proceeds, the second follows. 冬が近づくにつれて日が短くなる — as winter comes on, the days get shorter. The verb in front is in its dictionary form, whatever tense the sentence ends in, and the sentence's tense is carried entirely by the second half: 回復した makes the whole thing past even though 近づく in front of につれて looks present. That is how every subordinate clause in Japanese has behaved since Book Two, and it is worth noticing again here because the two halves feel like equals. The requirement to remember is that both halves must be changes that unfold over time. Time passing, winter approaching, growing older, an income rising — these go in front. A one-off event does not: something that simply happened has nothing for the second half to keep pace with, and a Japanese speaker would use たら or と or とき instead. Everything in front of につれて in this lesson is a verb in the dictionary form, and that is the shape to produce. A noun of change can also stand there, and you will meet it in writing. Two neighbours worth placing. Book Three's 〜ば〜ほど — the more you do this, the more that — says something close, but it measures degree against degree, while につれて simply lets two processes run together. And とともに, the next lesson, does this same job in writing where につれて does it in speech: 燃料のコストとともに上昇した and 時間がたつにつれて are describing the same kind of relation in two registers. Where につれて sits on the whole scale is worth saying plainly. It is not stiff. 年をとるにつれて忘れっぽくなるんだよ is somebody talking, complete with んだよ, so につれて is at home in an ordinary conversation about getting older. What it is not is casual shorthand — in the most relaxed speech people say だんだん, gradually, and leave the link implied."

- id: b4.to-tomo-ni
  order: 331
  chapterId: b4.band-6
  situation: In relation to
  title: Together with
  canDo: Say that two things happen, move or change together
  wordIds:
    - vocab.shunkan
    - vocab.bakuhatsu
    - vocab.taiyou
    - vocab.houkai
    - vocab.joushou
    - vocab.nenryou
  phraseIds:
    - b4band6.would-you-come-with-me
    - b4band6.it-exploded-with-a-great-noise
    - b4band6.the-marigold-rises-with-the-sun
    - b4band6.the-cold-war-ended-with-the-collapse
    - b4band6.airfares-rose-with-fuel-costs
    - b4band6.a-poet-and-a-diplomat
  kanji:
    - 瞬
    - 爆
    - 発
    - 陽
    - 崩
    - 昇
    - 燃
  patternId: grammar.b4-to-tomo-ni
  grammarNote: "とともに is written と共に about as often, and the two are one word: pick either when you write, and expect either when you read. The と is the ordinary with-particle and ともに is what has been added to it, which is why the whole thing so often translates as nothing more than with. Four jobs, across this lesson's six cards. In company with somebody: 私と共に来てくれませんか, will you come with me — where と一緒に would say the same thing in an everyday voice, and does. At the same moment as something: 大音響とともに爆発した, it exploded with an enormous noise; 春の訪れとともに, with the coming of spring. Keeping step with a change: 燃料のコストとともに上昇した, rose along with the cost of fuel — which is last lesson's につれて in a written coat. And after である, meaning as well as: 詩人であるとともに外交官でもあった, he was a poet and also a diplomat. That last one is easy to miss because English flattens it to and, so it is worth recognising by its shape: である plus とともに is two descriptions of one person or thing, not two events. What holds all four together is that the two things are not in a sequence. They accompany each other — side by side, or in step, or at the same instant — and that is why the marker feels formal even when what it describes is small. It belongs to writing, to speeches, and to the sort of spoken Japanese that is being careful. In an ordinary conversation, と一緒に and につれて between them cover most of its ground. One structural point that saves confusion later. とともに attaches to a noun, and also to a plain verb or to である -- 詩人であるとともに, this lesson's own card, and when a change is what accompanies the other, the noun is usually the name of that change: 崩壊, 上昇, 訪れ — collapse, rise, arrival. Japanese uses those nouns where English is happy with a verb, and this pattern is one of the places you feel that difference most."

- id: b4.o-tooshite
  order: 332
  chapterId: b4.band-6
  situation: In relation to
  title: Through
  canDo: Say what something passes through, or by what means it came
  wordIds:
    - vocab.tsumetai
    - vocab.mi
    - vocab.shiriai
    - vocab.ha-leaf
    - vocab.nikkou
    - vocab.kiri
  phraseIds:
    - b4band6.the-cold-wind-cut-through-his-coat
    - b4band6.i-met-them-through-him
    - b4band6.sunshine-through-the-leaves
    - b4band6.land-through-the-mist
  kanji:
    - 冷
    - 身
    - 葉
    - 霧
  patternId: grammar.b4-o-tooshite
  grammarNote: "を通して is through, in both the senses English gives that word. Physically through something: sunlight through leaves, wind through a coat, land seen through mist, a planet seen through a telescope. And by way of somebody or something: 彼を通して私は町の有力者と知り合いになった, I got to know them through him. The second is the one you will use. An introduction comes 誰かを通して, and so does a flat found through an agent or an application made through a company — the person or organisation in the middle is marked with を, and 通して says the connection ran through them. First, keep it apart from a verb you already own. 通す is an ordinary verb meaning to let something through, and its te-form is 通して too. 資料に目を通しておく, to run your eye over a document, is that verb — 目を通す is a set phrase, to look something over — and so is 係官は私を通してくれた, the official let me through. The difference is what the を is doing: with the verb, を marks the thing being let through; with this pattern, を marks the thing being passed through, and the sentence has another verb of its own. Then its twin, を通じて, which this lesson tells you about rather than drills. It does the same two jobs in a more written register, and it also covers a whole span of time — through the year, through a lifetime — and を通して takes it too -- 一年を通して is the ordinary phrase. The reason there is no card for it is worth knowing rather than guessing: the verified sentences this course draws on contain exactly three examples of を通じて, one of them a medical sentence about how an infection is transmitted and the other two much longer than anything in this book. So recognise it when you read it, and reach for を通して when you write. Nothing was invented to give it a nicer example. One last relative, met properly next chapter's worth of reading rather than here: を通じて and を通して both differ from によって, which you have from Book Three. によって is by what means or by whose hand; を通して is through what intermediate. A letter sent by post went by that means; a letter sent 秘書を通して went through the secretary, who is the channel rather than the means."

- id: b4.ni-kuwaete
  order: 333
  chapterId: b4.band-6
  situation: In relation to
  title: On top of, on the basis of
  canDo: Add a factor to what you have said, or name what something rests on
  wordIds:
    - vocab.kagaku
    - vocab.kansatsu
    - vocab.monogatari
    - vocab.jijitsu
    - vocab.kyuuryou
    - vocab.kimaru
    - vocab.kyuukou
  phraseIds:
    - b4band6.thick-fog-and-a-heavy-swell
    - b4band6.on-top-of-that-he-reads-hebrew
    - b4band6.an-express-ticket-as-well
    - b4band6.science-rests-on-observation
    - b4band6.this-story-is-founded-on-fact
    - b4band6.pay-is-based-on-experience
  kanji:
    - 科
    - 観
    - 察
    - 給
  patternId: grammar.b4-ni-motozuite
  grammarNote: "Two markers in one lesson, because each is thin on its own and both belong to the same job: the plain connective work of written Japanese. に加えて adds. Put it on a noun and the sentence says: on top of that noun, this as well. 濃霧に加えてうねりも高かった — as well as the thick fog, the swell was high. これに加えて at the head of a sentence picks up everything just said and adds the next point, which is how a written argument moves along. Two habits to notice. The second half often carries も, also, echoing the addition — うねりも高かった — though it need not. And when what you are adding is a whole clause rather than a noun, the clause is turned into a noun with こと first, in exactly the way Book Three taught: being a famous physicist, in addition to that, he is also a novelist. に基づいて grounds. Put it on a noun and the sentence says: this rests on that. 科学は観察に基づいている, science rests on observation. この物語は事実に基づいている, this story is founded on fact — the line at the front of a film. What the thing rests on is marked with に, and the shape varies with the job: 基づいている describes the standing state, the te-form 基づいて modifies the verb that follows — 給料は、経験と学歴に基づいて決まります, pay is settled on that basis — and に基づく or に基づいた goes in front of a noun. The word itself is transparent once you see 基, the character of 基本, a foundation. Why they share a lesson rather than each having their own is worth saying plainly: between them the verified sentences this course draws on hold about a dozen usable examples of the two, and a lesson built on half of that would be padding. Both are common in the writing you will meet — contracts, rules, film credits, weather reports, job advertisements — and neither is common in speech, where そのうえ and a plain で do much of the same work. The practical sentence in this lesson is the one about tickets. Japanese railways really do charge a base fare plus a supplement, so 普通券に加えて急行券, an express ticket in addition to an ordinary one, is a thing you may actually have to buy."

- id: b4.koso-ni-yoreba
  order: 334
  chapterId: b4.band-6
  situation: In relation to
  title: Precisely this, and who says so
  canDo: Single out the thing that matters, and name the source of a claim
  wordIds:
    - vocab.shinbou
    - vocab.juubun
    - vocab.yohou
    - vocab.shoujiki
    - vocab.wazurau
  phraseIds:
    - b4band6.patience-is-what-counts
    - b4band6.he-is-the-man-for-the-job
    - b4band6.young-as-he-is
    - b4band6.the-forecast-says-a-mild-winter
    - b4band6.according-to-him-she-is-honest
    - b4band6.the-doctor-says-she-has-rheumatism
  kanji:
    - 辛
    - 抱
    - 十
    - 報
    - 患
  patternId: grammar.b4-ni-yoreba
  grammarNote: "Two last markers, one that points at a thing and one that points at a source. こそ goes straight onto a noun and singles it out: this one, precisely this, and not the other candidates you might have named. 辛抱こそ大事なんだ — it is patience that matters. 彼こそその仕事の適任者だ — he is the man for the job. English has no particle for this, so it rebuilds the sentence instead, with a cleft — it is X that — or with the very, or with stress in the voice. Two things about its grammar. It replaces は and が rather than stacking on them, so 彼こそ and never 彼はこそ; and it attaches to more than a bare subject -- 今こそ, now of all times, and だからこそ, for that very reason. Then a second job: 〜こそ〜が concedes something in order to overturn it. 彼は年こそ若いが十分その仕事をやっていける — granted that he is young, he can do the work perfectly well. And after a conditional ば, ばこそ means precisely because — 君のためを思えばこそ, precisely because I have your interests at heart. Four look-alikes to screen out, because they are unrelated words that happen to contain these two kana: こそこそ, sneakily; こそ泥, a petty thief; そこそこ, roughly or barely; and ようこそ, welcome. None of them is this particle. によると and によれば name where a claim came from. 長期予報によると, according to the long-range forecast; 医者によれば, according to the doctor; 彼のいうところによれば, according to what he says. They are the same marker in two conditional forms of による and the difference between them is not one you have to manage. What they do is keep the speaker out of the claim: the sentence reports rather than asserts, which is why it so often ends in the hearsay そうだ that this book's chapter on reasons taught, or the という of Book Three's reference chapter. That pairing is a habit and not a requirement — 医者によれば、彼女はリューマチをわずらっている has no reporting ending at all, and the source marker alone does the work. One separation to hold onto, because it is the pair the checkpoint will test. によれば is not によって. によって, which you have had since Book Three, marks who did something in a passive sentence, by what means something was done, or what a thing varies with. によれば marks who said so. Same two characters at the front, entirely different job, and only the ending tells them apart."

- id: b4.checkpoint-6
  order: 335
  chapterId: b4.band-6
