name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Nightly on main, 08:00 UTC (3am Central): catches what changes without a PR --
  # dependencies, the design-system pin, Supabase. Failures open an issue (below).
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read
  issues: write

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aburungo

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: aburungo

      - name: Checkout design system
        uses: actions/checkout@v4
        with:
          repository: petr0n/aburungo-design-system
          path: aburungo-design-system
          # Pinned deliberately. Unpinned, this step took the design system's
          # default branch, so a merge in that repo could turn this repo's CI
          # red with no commit here -- which is exactly what happened on
          # 2026-08-21, when the design system dropped 'recalled' from
          # AnswerOutcome and three untouched files here stopped compiling.
          # Bump this ref on purpose, as its own PR, so the upgrade is a
          # decision with a diff rather than a surprise: a design-system
          # change can alter learner-facing copy, which is a product call
          # before it is a version bump. scripts/vercel-install.sh pins the
          # same sha for Vercel builds -- move the two together.
          ref: b4d04312880fb0086b9d3a1c6c5f01d71caf181b

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aburungo/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "aburungo/pnpm-lock.yaml"

      - name: Install ADS dependencies
        run: pnpm install --frozen-lockfile
        working-directory: aburungo-design-system

      - name: Build ADS
        run: pnpm build
        working-directory: aburungo-design-system

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Nightly only: a failure nobody is watching for must land somewhere seen.
      # One open issue collects them; each failed night adds a comment.
      - name: Report a failed nightly run
        if: failure() && github.event_name == 'schedule'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --repo "$R" --color B60205 --force >/dev/null
          n=$(gh issue list --repo "$R" --label nightly-failure --state open --json number -q '.[0].number')
          msg="Nightly **${{ github.workflow }}** failed on main ($(date -u +%F)): $RUN"
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$R" --body "$msg"
          else gh issue create --repo "$R" --label nightly-failure --title "Nightly tests failing" --body "$msg"; fi
