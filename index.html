<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- interactive-widget=resizes-content: without it Chrome on Android shrinks only the
         visual viewport when the soft keyboard opens, leaving the layout viewport full
         height. Anything positioned against the viewport -- sticky, fixed, svh units --
         then anchors to a top edge that is scrolled off the visible area, so a pinned
         prompt survives the first focus and is gone by the second. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="AburunGo — practical Japanese for real-life situations." />
    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
    />

    <title>AburunGo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
